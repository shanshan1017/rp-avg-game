<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AVG Runtime</title>
    <link rel="stylesheet" href="styles.css?v=avg-game-ui-v4" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-hud">
        <div class="brand-lockup">
          <span class="runtime-mark">AVG</span>
          <div>
            <h1 id="game-title">Loading</h1>
            <p id="package-id">runtime package</p>
          </div>
        </div>
        <nav class="mode-tabs" aria-label="views">
          <button id="home-tab" class="is-active" type="button">首页</button>
          <button id="play-tab" type="button">游玩</button>
          <button id="worldline-tab" type="button">世界线</button>
          <button id="records-tab" type="button">记录</button>
        </nav>
      </header>

      <section id="home-view" class="view home-view">
        <div id="home-backdrop" class="home-backdrop"></div>
        <section class="home-hero">
          <div class="home-copy">
            <p class="kicker">七脉会武 · 四强台前</p>
            <h2 id="home-title">未加载</h2>
            <p id="home-description"></p>
          </div>
          <div class="home-actions">
            <button id="continue-button" class="primary-action" type="button">继续</button>
            <button id="new-game-button" type="button">开始新故事</button>
            <label class="file-button">
              插入 JSON
              <input id="import-input" type="file" accept="application/json" />
            </label>
          </div>
          <dl id="home-stats" class="stat-grid"></dl>
        </section>
        <section class="launcher-dock" aria-label="launcher actions">
          <button type="button" data-record-panel="endings">结局记录</button>
          <button type="button" data-record-panel="chapters">选择章节</button>
          <button type="button" data-record-panel="saves">存档槽</button>
          <button type="button" data-record-panel="stats">游玩统计</button>
          <button type="button" data-record-panel="settings">设置</button>
          <button id="reset-save-button" type="button">清除记录</button>
        </section>
      </section>

      <section id="play-view" class="view play-view" hidden>
        <div id="stage" class="game-stage">
          <div class="stage-vignette"></div>
          <div id="scene-media" class="scene-media" aria-hidden="true"></div>
          <div class="stage-topline">
            <div>
              <span id="scene-label"></span>
              <strong id="node-title"></strong>
            </div>
            <div class="topline-actions">
              <span id="progress-label"></span>
              <button id="save-button" type="button">保存</button>
              <button id="restart-button" type="button">重开</button>
            </div>
          </div>
          <div id="character-stage" class="character-stage"></div>
          <div id="media-rail" class="media-rail"></div>
          <aside class="state-hud">
            <dl id="state-list" class="state-list"></dl>
          </aside>
          <section class="dialogue-box">
            <div class="dialogue-meta">
              <span id="speaker-name"></span>
              <span id="segment-count"></span>
            </div>
            <p id="dialogue-text"></p>
            <div id="choices" class="choices"></div>
            <div class="dialogue-controls">
              <button id="next-button" class="primary-action" type="button">继续</button>
              <button id="history-button" type="button">回顾</button>
            </div>
          </section>
        </div>
      </section>

      <section id="worldline-view" class="view worldline-view" hidden>
        <div class="worldline-toolbar">
          <div class="worldline-toolbar-group">
            <button id="fit-current-button" type="button">当前节点</button>
            <button id="fit-worldline-button" type="button">全貌</button>
            <button id="jump-button" type="button">进入节点</button>
          </div>
          <div class="worldline-toolbar-group" aria-label="worldline zoom">
            <button id="worldline-zoom-out-button" type="button" title="缩小">−</button>
            <span id="worldline-zoom-label" class="worldline-zoom-label">100%</span>
            <button id="worldline-zoom-in-button" type="button" title="放大">+</button>
            <button id="worldline-reset-button" type="button">重置</button>
          </div>
        </div>
        <div class="worldline-layout">
          <div id="worldline" class="worldline"></div>
          <section class="inspector-panel">
            <h2 id="inspector-title">选择节点</h2>
            <p id="inspector-body"></p>
            <dl id="inspector-meta" class="state-list"></dl>
          </section>
        </div>
      </section>

      <section id="records-view" class="view records-view" hidden>
        <nav class="record-tabs" aria-label="records">
          <button type="button" data-record-panel="endings">结局记录</button>
          <button type="button" data-record-panel="chapters">选择章节</button>
          <button type="button" data-record-panel="saves">存档槽</button>
          <button type="button" data-record-panel="stats">游玩统计</button>
          <button type="button" data-record-panel="assets">素材</button>
          <button type="button" data-record-panel="settings">设置</button>
        </nav>
        <section class="records-panel">
          <h2 id="records-title">记录</h2>
          <div id="records-body" class="records-body"></div>
        </section>
      </section>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="app.js?v=avg-game-ui-v4"></script>
  </body>
</html>
