<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动小说 — 故事树可视化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  overflow: hidden;
}

#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: linear-gradient(180deg, rgba(13,17,23,0.97) 80%, rgba(13,17,23,0));
  padding: 16px 28px 32px;
  pointer-events: none;
  display: flex; align-items: flex-start; gap: 20px;
}
#header h1 {
  font-size: 20px; font-weight: 700; color: #e6edf3;
  pointer-events: auto; white-space: nowrap;
}
#header .subtitle {
  font-size: 13px; color: #7d8590; margin-top: 5px;
  pointer-events: auto;
}
#story-selector {
  pointer-events: auto;
  background: #161b22; color: #c9d1d9;
  border: 1px solid #30363d; border-radius: 8px;
  padding: 8px 14px; font-size: 14px;
  cursor: pointer; outline: none; margin-top: 2px;
}
#story-selector:hover { border-color: #58a6ff; }

#legend {
  position: fixed; top: 18px; right: 28px; z-index: 100;
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  font-size: 12px; color: #7d8590;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }

#canvas { width: 100vw; height: 100vh; cursor: grab; }
#canvas:active { cursor: grabbing; }

#tooltip {
  position: fixed; z-index: 200;
  background: #161b22; border: 1px solid #30363d;
  border-radius: 10px; padding: 16px 18px;
  max-width: 440px; font-size: 13px;
  line-height: 1.7; color: #c9d1d9;
  pointer-events: none; opacity: 0;
  transition: opacity 0.15s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.tt-title { font-size: 16px; font-weight: 700; color: #e6edf3; margin-bottom: 6px; }
.tt-type {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 10px; margin-bottom: 8px;
}
.tt-act { font-size: 11px; color: #7d8590; margin-left: 8px; }
.tt-desc { font-size: 13px; color: #8b949e; margin-top: 6px; line-height: 1.7; }
.tt-choices { margin-top: 8px; border-top: 1px solid #21262d; padding-top: 8px; }
.tt-choice-item { font-size: 12px; color: #79c0ff; margin-bottom: 3px; }

#detail-panel {
  position: fixed; top: 0; right: -560px; width: 540px; height: 100vh;
  background: #161b22; border-left: 1px solid #30363d;
  z-index: 150; transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto; padding: 28px;
}
#detail-panel.open { right: 0; }
#detail-panel .close-btn {
  position: absolute; top: 14px; right: 18px;
  background: none; border: none; color: #7d8590;
  font-size: 24px; cursor: pointer;
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
#detail-panel .close-btn:hover { color: #e6edf3; background: #21262d; }
#detail-panel h2 { font-size: 20px; color: #e6edf3; margin-bottom: 6px; line-height: 1.3; }
.dp-meta {
  font-size: 12px; color: #7d8590; margin-bottom: 20px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.dp-tag {
  display: inline-block; font-size: 11px; padding: 3px 10px;
  border-radius: 10px; font-weight: 500;
}
.dp-section { margin-bottom: 20px; }
.dp-section h3 {
  font-size: 13px; color: #7d8590; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 10px;
  border-bottom: 1px solid #21262d; padding-bottom: 5px;
  font-weight: 600;
}
.dp-section p,
.dp-section li {
  font-size: 14px; line-height: 1.8; color: #c9d1d9;
}
.dp-section ul { padding-left: 20px; }
.dp-narrative {
  font-size: 14px; line-height: 2; color: #c9d1d9;
  padding: 16px 20px;
  background: #0d1117; border: 1px solid #21262d;
  border-radius: 10px;
  max-height: 50vh; overflow-y: auto;
  white-space: pre-wrap;
}
.dp-choice {
  background: #0d1117; border: 1px solid #30363d;
  border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  cursor: pointer; transition: all 0.15s;
}
.dp-choice:hover { border-color: #58a6ff; background: #161b2a; }
.dp-choice .choice-text { font-size: 14px; color: #79c0ff; font-weight: 500; line-height: 1.5; }
.dp-choice .choice-hint { font-size: 12px; color: #7d8590; margin-top: 5px; line-height: 1.5; }
.dp-choice .choice-effects { font-size: 12px; color: #3fb950; margin-top: 5px; }
.dp-choice.dead-choice { border-color: #f8514944; }
.dp-choice.dead-choice .choice-text { color: #f85149; }

.dp-characters { display: flex; flex-wrap: wrap; gap: 8px; }
.dp-char-tag {
  font-size: 13px; padding: 4px 12px;
  background: #a371f715; border: 1px solid #a371f730;
  border-radius: 20px; color: #a371f7;
}
.dp-facts { display: flex; flex-direction: column; gap: 8px; }
.dp-fact {
  font-size: 13px; padding: 10px 14px; line-height: 1.6;
  background: #58a6ff08; border-left: 3px solid #58a6ff;
  border-radius: 0 8px 8px 0; color: #c9d1d9;
}
.dp-death {
  padding: 14px 16px; background: #f8514910;
  border: 1px solid #f8514930; border-radius: 10px;
  color: #f85149; font-size: 14px; line-height: 1.7;
}
.dp-ending {
  padding: 14px 16px; border-radius: 10px;
  font-size: 15px; line-height: 1.6; font-weight: 600;
}

.dp-next { display: flex; flex-wrap: wrap; gap: 8px; }
.dp-next-link {
  font-size: 13px; padding: 6px 14px;
  background: #21262d; border: 1px solid #30363d;
  border-radius: 8px; color: #79c0ff;
  cursor: pointer; transition: all 0.15s;
}
.dp-next-link:hover { border-color: #58a6ff; background: #161b2a; }

#controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 100; display: flex; gap: 8px;
}
#controls button {
  background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
  padding: 8px 16px; border-radius: 8px; font-size: 13px;
  cursor: pointer; transition: all 0.15s; font-weight: 500;
}
#controls button:hover { background: #30363d; border-color: #484f58; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

.value-badge { font-size: 10px; fill: #3fb950; }
.edge-label { pointer-events: none; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1 id="title">互动小说故事树</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <select id="story-selector"></select>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>叙事</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d29922"></div>选择</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f85149"></div>死亡</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a371f7"></div>结局</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>门控</div>
</div>

<svg id="canvas"></svg>
<div id="tooltip"></div>

<div id="detail-panel">
  <button class="close-btn" onclick="closePanel()">&times;</button>
  <div id="detail-content"></div>
</div>

<div id="controls">
  <button onclick="zoomIn()">放大 +</button>
  <button onclick="zoomOut()">缩小 −</button>
  <button onclick="resetView()">重置视图</button>
  <button onclick="toggleLabels()">切换标签</button>
</div>

ding", "value_conditions": [], "description": "死结局：最后的失误 - 独自行动被杀"}], "characters": [{"name": "艾德蒙·克劳福德", "role": "protagonist", "description": "年轻的私人侦探，观察力敏锐但经验不足。在维多利亚时代的伦敦小有名气，善于推理但有时过于自信。"}, {"name": "伯爵夫人伊莎贝拉", "role": "npc", "description": "已故伯爵的遗孀，意大利裔贵族女性。外表优雅神秘，实则是意大利统一运动的秘密支持者，与管家是同父异母的兄妹。"}, {"name": "管家拉扎罗", "role": "npc", "description": "意大利裔管家，伯爵夫人同父异母的哥哥。表面忠诚寡言，实则是革命组织的联络人。身手矫健，对外来者高度警惕。"}, {"name": "警探威廉", "role": "npc", "description": "苏格兰场的老派警探，经验丰富但思维传统。正直但墨守成规，代表官方正义的力量。"}, {"name": "女仆艾米莉", "role": "npc", "description": "庄园的年轻女仆，胆小易惊但观察敏锐。她知道许多庄园的秘密，但因恐惧而三缄其口。"}, {"name": "已故伯爵", "role": "npc", "description": "布莱克伍德庄园主人，表面是艺术品收藏家，实则是意大利烧炭党的秘密资助者。被奥地利密探杀害于密室之中。"}, {"name": "奥地利密探", "role": "antagonist", "description": "奥地利帝国的秘密警察，奉命铲除支持意大利统一运动的英国资助者。冷酷专业，是本案的真正凶手。"}]}, "narratives": {"node_001": {"node_id": "node_001", "narrative_text": "一八六二年的深秋，伦敦被浓雾吞噬。煤烟与泰晤士河的湿气交织，在街道上凝结成一层灰黄色的幕布，行人的轮廓在其中若隐若现，仿佛幽灵穿行于人间。\n\n艾德蒙·克劳福德站在贝克街寓所的窗前，手中捏着一封信。信纸是上等的羊皮纸，边缘烫金，散发着淡淡的紫罗兰香气——这是贵族才会使用的香水。信的内容简短而神秘：\n\n「克劳福德先生：我夫君于三日前死于密室之中。门窗皆从内部锁闭，钥匙在他口袋里。警方束手无策，而我需要真相。布莱克伍德庄园恭候您的大驾。随信附上马车费用。——伊莎贝拉·布莱克伍德伯爵夫人」\n\n艾德蒙将信折好，放入西装内袋。二十六岁的他已在伦敦侦探界小有名气——他破获过西区珠宝大盗案，也揭穿过假冒贵族的骗婚者。但密室杀人？这将是他职业生涯中最大的挑战。\n\n他披上厚重的呢绒大衣，戴好礼帽，走出寓所。雾气立刻包裹了他，冰凉的水珠凝结在他的眉毛和胡须上。街角的马车已经等候多时，车夫是个沉默的老头，只是点了点头便扬鞭启程。\n\n马车穿过拥挤的城区，驶向伦敦西北郊。随着建筑渐渐稀疏，雾气反而更加浓重。艾德蒙靠在车厢里，脑中反复推演着各种可能：密室杀人通常意味着自杀、意外，或者精心设计的诡计。但一位收藏珍贵画作的伯爵，有什么理由自杀？\n\n约莫两个小时后，马车在一座庄严的铁门前停下。透过雾气，艾德蒙隐约看见一座哥特式庄园的轮廓——尖塔、拱窗、爬满常春藤的灰色石墙。庄园的名字铸在铁门上：布莱克伍德。\n\n门房是个驼背的老人，他用一种奇怪的眼神打量着艾德蒙，仿佛在审视一只即将踏入陷阱的猎物。铁门吱呀作响地打开，马车缓缓驶入。\n\n车道两旁是修剪整齐的紫杉树，在雾中如同沉默的哨兵。艾德蒙注意到树丛间有几处新翻的泥土——有人最近在这里挖掘过什么。他将这个细节默默记在心里。\n\n庄园正门是一扇巨大的橡木门，上面的黄铜门环被擦得锃亮。艾德蒙还未来得及敲门，门便从里面打开了。\n\n一个身材高大的男人站在门口，他有着橄榄色的皮肤和深邃的黑眼睛——明显的意大利血统。他穿着无可挑剔的黑色管家制服，但站姿却带着一种军人般的警觉。\n\n「克劳福德先生？」他的英语带着轻微的意大利口音，「我是拉扎罗，庄园管家。夫人正在等您。」\n\n艾德蒙跨过门槛的瞬间，感到一阵寒意——不仅仅是因为庄园内阴冷的空气。他有一种强烈的预感：这座庄园隐藏着远比密室杀人更深的秘密。而他，即将踏入一个精心编织的蛛网中心。", "choice_presentation": null, "echo_applied": []}, "node_002": {"node_id": "node_002", "narrative_text": "管家拉扎罗带领艾德蒙穿过宽敞的门厅。大理石地板上铺着波斯地毯，墙上挂满了油画——风景、肖像、宗教题材，每一幅都价值不菲。艾德蒙注意到有几处墙面的颜色比周围浅淡，显示那里曾经挂着画作，如今已被取走。\n\n「伯爵生前是位艺术收藏家？」艾德蒙随口问道。\n\n拉扎罗的脚步几不可察地顿了一下。「是的，先生。伯爵对文艺复兴时期的意大利绑画尤为痴迷。」\n\n他们来到一处宽阔的楼梯前。艾德蒙抬头望去，看见二楼的走廊上有一扇窗户微微开着，一个女性的身影正站在那里向下张望。逆光中，她的脸被面纱遮住，只能看见一个优美的轮廓。那一定是伯爵夫人伊莎贝拉。\n\n就在这时，拉扎罗停下脚步，转身面对艾德蒙。他的眼神中带着一种难以捉摸的光芒——是警惕？是审视？还是某种更深层的情感？\n\n「在我引您去见夫人之前，」管家低声说道，「请容许我提醒您一件事：庄园里的每个人都有自己的秘密。包括我。而有些秘密，最好让它们永远埋葬。」\n\n这番话让艾德蒙心中警铃大作。一个管家为何要对调查者说出这样的话？是威胁？还是警告？二楼窗户处的身影已经消失了。艾德蒙面临着第一个选择：他应该如何应对这个神秘的管家？", "choice_presentation": "拉扎罗的话语如同一颗石子投入平静的湖面，激起层层涟漪。艾德蒙意识到，从踏入这座庄园的第一刻起，一场无声的博弈就已经开始了。\n\n他可以选择诚实，表明自己侦探的身份，请求正式会见伯爵夫人——这样做光明磊落，但也可能让庄园里的人提高警惕，隐藏更多信息。\n\n或者，他可以抛出一个谎言，声称自己是伯爵生前的朋友，借此试探管家的反应——这种做法有风险，但如果成功，或许能窥见更多真相。\n\n拉扎罗正等待着他的回应，那双深邃的黑眼睛仿佛能洞察一切。", "echo_applied": []}, "node_003": {"node_id": "node_003", "narrative_text": "艾德蒙决定以诚相待。在这样一个充满秘密的地方，至少他自己应该是坦诚的。\n\n「拉扎罗先生，」他从口袋里取出那封邀请信，「我是艾德蒙·克劳福德，私人侦探。伯爵夫人邀请我来调查伯爵的死因。我希望能正式拜见她，了解案件的详情。」\n\n管家接过信，仔细端详了片刻。他的表情没有任何变化，但艾德蒙注意到他握信的手指微微收紧了。「请跟我来，克劳福德先生。」\n\n他们穿过走廊，来到一间装饰华美的会客厅。壁炉里的火焰噼啪作响，为阴冷的房间带来些许暖意。墙上挂着一幅巨大的家族肖像画——一个面容严峻的中年男子坐在扶手椅上，身旁站着一位年轻美丽的女子。\n\n「那是伯爵和夫人的结婚肖像，」拉扎罗解释道，「绘于去年春天。」\n\n还没等艾德蒙细看，一阵轻柔的脚步声传来。会客厅的门被推开，伯爵夫人伊莎贝拉走了进来。\n\n她比肖像画中更加美丽，也更加憔悴。一头乌黑的秀发挽成简单的发髻，身着黑色丧服，衬得她的肌肤如同瓷器般苍白。她的眼眶微微发红，显然哭过，但举止间依然保持着贵族的优雅与从容。\n\n「克劳福德先生，」她的声音低沉而富有磁性，带着淡淡的意大利口音，「感谢您愿意接受我的委托。请坐。」\n\n艾德蒙在她对面的沙发上坐下。拉扎罗退到角落，但并没有离开房间。\n\n「伯爵夫人，请您告诉我那天晚上发生了什么。」\n\n伊莎贝拉的目光变得空洞，仿佛陷入了回忆。「三天前的夜里，我丈夫在晚餐后说要去书房处理一些私人事务。他让所有人都不要打扰他，包括我。那是他的习惯——每当他需要独处时，就会把自己锁在书房里。」她停顿了一下，手指不自觉地绞着手帕。「第二天早上，他没有按时出现在餐厅。我让拉扎罗去叫他，但书房的门从里面锁着。我们叫了仆人来撞门，发现他……发现他已经死了。倒在书桌旁，后脑有一处致命的伤口。」\n\n「门窗都是从内部锁着的？」艾德蒙问道。\n\n「是的。所有的门窗都从里面闩上了。唯一的钥匙在我丈夫的口袋里。」伊莎贝拉的声音颤抖了，「警察说这可能是自杀或意外，但我不相信。我丈夫不是会自杀的人。而且……」\n\n「而且？」\n\n「书房里有一幅画不见了。一幅非常珍贵的画。」\n\n艾德蒙敏锐地捕捉到了这个信息。一幅失踪的画，一个密室杀人案——这两者之间必然存在联系。\n\n「伯爵夫人，我需要查看案发现场，以及与所有可能的证人交谈。您能安排吗？」\n\n伊莎贝拉点了点头。「拉扎罗会配合您的一切需求。庄园里的每个人都会配合。」她抬起头，直视艾德蒙的眼睛，「克劳福德先生，请找出杀害我丈夫的凶手。无论真相是什么，我都想知道。」\n\n艾德蒙站起身，微微鞠躬。「我会尽我所能，夫人。」\n\n当他转身离开时，他注意到伯爵夫人和管家之间交换了一个短暂的眼神。那个眼神太快，他无法判断其中的含义。但他的直觉告诉他：这两个人之间，有着某种不为人知的联系。", "choice_presentation": null, "echo_applied": []}, "node_004": {"node_id": "node_004", "narrative_text": "艾德蒙决定冒一个险。侦探的直觉告诉他，在这样一个充满秘密的地方，有时候谎言反而能撬开真相的缝隙。\n\n「拉扎罗先生，」他换上一副悲伤的表情，「我是伯爵生前的朋友。我们在意大利相识，他邀请我来庄园做客。没想到刚到伦敦，就听到了这个噩耗……」\n\n他刻意停顿，观察管家的反应。\n\n拉扎罗的眼神瞬间变得锐利如刀。他没有说话，只是微微侧头，嘴角浮现出一丝几乎察觉不到的冷笑。\n\n「是吗？」管家的语气平静得近乎冰冷，「请问先生是在哪里与伯爵相识的？佛罗伦萨？罗马？还是……都灵？」\n\n艾德蒙立刻意识到自己踏入了一个陷阱。管家对伯爵的交际圈了如指掌——任何虚假的细节都会立刻暴露他的谎言。\n\n「都灵，」他决定赌一把，「三年前的艺术博览会上。」\n\n拉扎罗的表情没有任何变化。他只是微微点头，做了一个「请」的手势。「请跟我来，先生。夫人正在等候。」\n\n他的配合太过顺利，顺利得让艾德蒙后背发凉。这个管家没有戳穿他的谎言，但他的眼神分明在说：我知道你在撒谎。\n\n他们穿过走廊时，艾德蒙的大脑在飞速运转。这个意大利管家对伯爵的社交圈如此熟悉，说明他绝不是普通的仆人。而他选择不拆穿艾德蒙的谎言，这本身就意味深长——他想看看这个「假朋友」究竟想做什么？还是他有自己的目的，不希望真正的调查展开？\n\n无论如何，艾德蒙已经在这个精明的管家心中留下了一个「不诚实」的印象。这可能会让未来的调查更加困难，但同时，他也发现了一个重要的信息：拉扎罗绝不仅仅是一个管家。他知道太多事情，而一个知道太多的人，往往也是最危险的人。\n\n他们在会客厅门前停下。拉扎罗推开门，用一种意味深长的语气说道：「先生，有些人的眼睛能辨别真假。请您在夫人面前，谨慎选择您的言辞。」\n\n这是警告，还是好意的提醒？艾德蒙带着这个疑问，走进了会客厅。", "choice_presentation": null, "echo_applied": []}, "node_005": {"node_id": "node_005", "narrative_text": "警探威廉·霍克是苏格兰场的老将了。他的胡须已经花白，脸上的皱纹如同刻在橡木上的年轮，记录着三十年来与伦敦罪恶打交道的岁月。当艾德蒙提出要查看案发现场时，伯爵夫人安排威廉警探陪同。\n\n「私人侦探，是吧？」威廉的语气不冷不热，带着老派警察对「外行」的轻蔑，「我见过太多你们这样的人，在报纸上吹得天花乱坠，到了现场连脚印都不知道保护。」\n\n「我会小心的，警探。」艾德蒙没有争辩。\n\n他们沿着走廊来到庄园东翼。书房位于走廊尽头，一扇厚重的橡木门上还残留着被撞开的痕迹——门框处有明显的裂痕，门锁也已经扭曲变形。\n\n「我们花了将近十分钟才撞开这扇门，」威廉说道，推开门让艾德蒙进去，「门闩是黄铜的，非常结实。从里面闩上的，没有任何被撬动的痕迹。」\n\n书房是一个宽敞的方形房间，约有四百平方英尺。三面墙壁被高大的书架覆盖，第四面墙有两扇落地窗，窗外是庄园的花园。房间正中是一张巨大的红木书桌，书桌旁的地板上用粉笔画着一个人形轮廓——伯爵倒下的位置。\n\n艾德蒙蹲下身，仔细检查地板。粉笔轮廓的头部位置有一小片深色污渍，那是血迹。\n\n「致命伤在后脑，」威廉解释道，「钝器击打，力度很大。凶器可能是某种金属制品，但我们没有在现场找到。」\n\n「没有找到凶器？」艾德蒙皱眉。\n\n「是的。这也是这个案子最诡异的地方之一。门窗都从里面锁着，钥匙在死者口袋里，但凶器却不翼而飞。」\n\n艾德蒙站起身，环顾四周。他的目光落在书架之间的一处空白墙面上——那里的壁纸颜色比周围浅淡，明显曾经挂着什么东西。\n\n「那里原来挂着一幅画？」\n\n「是的。据伯爵夫人说，是一幅非常珍贵的意大利画作。连同画框一起失踪了。」\n\n艾德蒙走到窗边，检查窗户。窗户是双层玻璃的，锁扣从内部锁着，没有任何被强行打开的迹象。窗外是一片精心修剪的灌木丛，再往外是庄园的围墙。\n\n「窗户呢？有没有可能从窗户进出？」\n\n「不可能。」威廉摇头，「窗户也是从里面锁着的。而且窗外的灌木丛没有任何被践踏的痕迹。我们检查过了。」\n\n艾德蒙的目光在房间里扫视，最后停留在壁炉上。壁炉里还有一些没有燃尽的灰烬，壁炉上方挂着一面巨大的镜子。他注意到壁炉旁边的墙壁似乎有些不同——砖缝的灰泥颜色比其他地方更新。而书桌上有一些散落的文件，其中一封信的边缘露出来，上面有意大利文的字迹。\n\n现在，艾德蒙面临选择：他应该先调查哪条线索？", "choice_presentation": "案发现场如同一个沉默的谜题盒，等待着有人来破解。艾德蒙的目光在三个方向之间游移：\n\n壁炉旁的墙壁似乎藏着某种机关——那些新旧不一的砖缝让他想起侦探小说中常见的密道。如果这里有一条秘密通道，就能解释凶手如何进出密室。\n\n失踪的画作是另一条重要线索。一幅珍贵的意大利画作与一位意大利裔管家，以及伯爵从意大利带回的收藏——这之间是否存在联系？\n\n而书桌上的那些文件和信件，或许能揭示伯爵生前的秘密。那封意大利文的信是谁写的？内容是什么？\n\n警探威廉站在一旁，等待着这位年轻侦探的决定。时间紧迫，他只能选择一个方向深入调查。", "echo_applied": []}, "node_006": {"node_id": "node_006", "narrative_text": "艾德蒙的目光锁定在壁炉旁那片可疑的墙壁上。密室杀人案最常见的解释就是存在秘密通道——如果他能找到这条通道，就能解开凶手进出的谜团。\n\n「警探，请允许我检查一下壁炉周围。」\n\n威廉耸了耸肩。「随便你。我们已经检查过了，什么都没有。」\n\n艾德蒙走到壁炉旁，用手指轻轻敲击墙壁。大部分地方发出沉闷的声响，但在壁炉右侧约两英尺处，他听到了一个轻微的空洞声。\n\n他蹲下身，仔细检查那片区域。墙壁的表面看起来与其他地方无异，但当他用手掌按压时，感觉到了一丝松动。「有意思……」他喃喃自语。\n\n艾德蒙的手指沿着壁炉的边缘摸索，终于在壁炉台下方找到了一个隐蔽的凹槽。他按下去——\n\n一阵低沉的机械声响起，壁炉旁的一整面书架缓缓向内滑动，露出一个黑洞洞的入口。一股霉味和泥土的气息扑面而来。\n\n「见鬼！」威廉警探惊呼出声，「这里居然有暗道！」\n\n艾德蒙从口袋里取出火柴，点燃了一支蜡烛。烛光摇曳中，他看见一条狭窄的石阶向下延伸，消失在黑暗之中。\n\n「这条暗道通向哪里？」威廉凑上前来。\n\n「看方向，应该是通往地下室或者庄园地基。」艾德蒙判断道，「这就是凶手进出密室的方式。他从暗道进入书房，杀死伯爵，然后带着画作和凶器从暗道离开。之后用某种方式从外面触发机关，让门闩自动锁上。」\n\n「可是钥匙在伯爵口袋里……」\n\n「钥匙只是个幌子。」艾德蒙的眼睛闪烁着兴奋的光芒，「凶手根本不需要钥匙，因为他从来没有通过那扇门。」\n\n他转身看向威廉。「警探，现在最重要的问题是：谁知道这条暗道的存在？」\n\n威廉的脸色变得凝重。「在这座庄园住了这么久的人……管家？伯爵夫人？或者某个老仆人？」\n\n艾德蒙点点头，将暗道的位置和机关详细记在笔记本上。这条暗道的发现大大缩小了嫌疑人的范围——凶手必然是熟悉庄园秘密的人，或者是受到这样一个人的指使。", "choice_presentation": null, "echo_applied": []}, "node_007": {"node_id": "node_007", "narrative_text": "艾德蒙决定先了解那幅失踪画作的信息。在他的经验中，盗窃往往是谋杀的动机，而一幅珍贵的画作足以让人铤而走险。\n\n「警探，能告诉我更多关于那幅失踪画作的事吗？」\n\n威廉走到那片空白的墙面前，指着壁纸上残留的钩痕。「根据伯爵夫人的描述，这里原本挂着一幅卡拉瓦乔的作品——《圣马太蒙召》的临摹品。大约三英尺乘四英尺，镀金木框。」\n\n「临摹品？」艾德蒙挑了挑眉。\n\n「是的，官方说法是临摹品。」威廉压低声音，「但你知道艺术品市场是怎么回事。有传言说伯爵收藏的可能是真迹。如果是真的，这幅画的价值……」\n\n「足以让人杀人。」\n\n「正是如此。」威廉点头，「卡拉瓦乔的真迹，在黑市上至少值五万英镑。这足够一个人舒舒服服地过一辈子了。」\n\n艾德蒙在房间里踱步，思考着。「这幅画是伯爵从哪里得到的？」\n\n「据说是十五年前从意大利带回来的。伯爵年轻时曾在意大利生活过一段时间，那里是他艺术收藏的起点。」威廉从口袋里掏出一个笔记本，翻了几页，「伯爵夫人提到，画是从一个『已故的』意大利贵族那里购得的。但她没有提供更多细节。」\n\n「已故的意大利贵族？」艾德蒙重复着这个词，「听起来像是为了掩盖来源而编造的故事。」\n\n「我也这么认为。」威廉合上笔记本，「还有一件事——伯爵生前收到过一些威胁信，内容与这幅画有关。信里要求他归还『本属于意大利的国宝』，否则会让他『血债血偿』。」\n\n艾德蒙的目光转向书桌。如果威胁信还存在，它们很可能藏在某个暗格里。而这些信的内容和来源，可能直接指向凶手的身份。\n\n他深吸一口气，将这些信息整理在脑中：一幅可能是真迹的卡拉瓦乔画作，从意大利带回英国，引来了威胁信，最终画作失踪，伯爵死于密室。而庄园里有一位意大利裔的管家。这是巧合吗？", "choice_presentation": null, "echo_applied": []}, "node_008": {"node_id": "node_008", "narrative_text": "艾德蒙走向书桌，决定仔细检查伯爵的私人物品。死者的物品往往能揭示他生前的秘密——而秘密，正是谋杀的温床。\n\n书桌是一件精美的红木家具，有三个抽屉和一个可以折叠的写字台。桌面上散落着一些文件、几支羽毛笔和一瓶已经干涸的墨水。\n\n「警察已经检查过这张桌子了吗？」艾德蒙问威廉。\n\n「大致看过，没发现什么特别的。」\n\n艾德蒙开始逐一检查抽屉。第一个抽屉里是一些账目和收据——庄园的日常开支，没什么可疑之处。第二个抽屉里是私人信件，大多是社交往来，措辞客套而无聊。第三个抽屉是锁着的。\n\n「这个抽屉打开过吗？」\n\n「没有。我们没找到钥匙。」威廉回答。\n\n艾德蒙从口袋里掏出一套开锁工具——这是每个私人侦探的必备品。他花了不到一分钟就打开了锁。抽屉里有一个暗格，暗格里放着一叠信件，用红色丝带捆扎着。\n\n艾德蒙取出信件，发现它们的纸张与普通英国信纸不同——更薄，更脆，有一种独特的纹理。「这是意大利产的纸。」他低声说道。\n\n他解开丝带，抽出最上面一封信。信没有署名，也没有日期，但内容让他的血液几乎凝固：\n\n「布莱克伍德伯爵阁下：您从我国窃取的那幅画作，原本属于意大利人民。它是我们民族的瑰宝，而您却将它藏在您阴暗的庄园里。我们已经给过您机会。您选择了无视。现在，您将付出血的代价。——圣马太的复仇者」\n\n艾德蒙又翻了几封信，内容大同小异，但语气越来越激烈，威胁越来越直白。最后一封信只有一行字：「时间到了。」\n\n「警探，」艾德蒙将信递给威廉，「我找到了威胁信。」\n\n威廉接过信，脸色变得铁青。「『圣马太的复仇者』？这是什么组织？」\n\n「我不知道。但有一点是确定的——这些威胁不是空穴来风。」艾德蒙将暗格里剩余的物品一一取出：几份意大利文的文件、一枚印章、一把小型手枪。\n\n「伯爵生前已经感受到了危险，否则他不会在书桌里藏一把枪。但他最终还是死在了这里……」\n\n谜团越来越深了。一幅画，一系列威胁信，一个神秘的组织，还有一个来自意大利的管家。所有这些线索似乎都指向同一个方向——但那个方向通往哪里，艾德蒙还无法确定。", "choice_presentation": null, "echo_applied": []}, "node_009": {"node_id": "node_009", "narrative_text": "夕阳的余晖透过彩色玻璃窗，在庄园的走廊上投下斑驳的光影。艾德蒙完成了对书房的初步调查，现在是时候与庄园里的其他人交谈了。\n\n他漫步穿过走廊，观察着这座宏伟建筑的每一个细节。墙上的挂毯讲述着中世纪的战争故事，铠甲雕塑静静伫立在角落，仿佛沉默的卫兵。空气中弥漫着蜡烛燃烧的气息和一丝淡淡的霉味——这是老宅子特有的味道。\n\n在走廊的尽头，艾德蒙看到了三个可能的调查方向：\n\n女仆艾米莉正在走廊另一端徘徊，她的脚步犹豫不安，不时回头张望，仿佛在害怕什么。当她发现艾德蒙在看她时，她的脸色瞬间变得苍白，赶紧低下头假装整理墙上的挂画。\n\n厨房方向传来低语声。艾德蒙认出其中一个声音属于管家拉扎罗——他似乎在用一种外语与人交谈，语速很快，语气紧迫。\n\n而从画廊的方向，他看到伯爵夫人伊莎贝拉的身影。她独自站在一幅巨大的画作前，背影寂寥，仿佛与世隔绝。\n\n艾德蒙知道，每个人都可能握有一块拼图。女仆通常知道最多的家庭秘密，管家的神秘对话可能揭示重要信息，而伯爵夫人本身就是整个案件的核心人物。但他的时间有限，必须做出选择。", "choice_presentation": "走廊的分岔口如同命运的十字路口，每条路都通往不同的真相。\n\n女仆艾米莉的紧张举止引起了艾德蒙的注意。她显然在害怕什么——或者说，她知道什么让她害怕的事情。下人们往往是庄园里最敏锐的观察者，他们看见主人看不见的东西，听到主人听不到的秘密。\n\n厨房里的密谈同样耐人寻味。管家拉扎罗用外语与人交谈，在伯爵刚死三天的节骨眼上，这种秘密对话绝非寻常。如果艾德蒙能听到他们在说什么，或许能发现关键线索。\n\n而伯爵夫人独自站在画廊中，她的孤独背影似乎在诉说着什么。她是委托人，但也可能是嫌疑人。一个新婚不到一年的妻子，丈夫死后第一时间请来私人侦探——这是悲痛的遗孀，还是高明的凶手在掩盖罪行？\n\n艾德蒙必须做出选择。", "echo_applied": []}, "node_010": {"node_id": "node_010", "narrative_text": "艾德蒙决定找女仆艾米莉谈话。在他的经验中，仆人往往是最好的情报来源——他们在主人眼中是透明的，因 _text": "艾德蒙抓起桌上的黄铜烛台，吹灭了蜡烛。黑暗中，他能听到自己的心跳声如同战鼓。\n\n门被推开了。两个黑衣人走了进来，手里提着灯笼。他们的动作训练有素，完全不像普通的仆人或盗贼。\n\n艾德蒙决定先发制人。他从阴影中跃出，烛台狠狠砸向最近的黑衣人的头部。但他的对手反应更快。\n\n那人侧身一闪，艾德蒙的攻击落了空。与此同时，另一个黑衣人已经绕到了他的身后。\n\n艾德蒙感到后颈一阵剧痛，然后是更大的疼痛从腹部传来——一把短刀刺入了他的身体。\n\n他跪倒在地，烛台从手中滑落，发出清脆的声响。温热的血液从伤口涌出，染红了冰冷的石板地面。\n\n「可惜了，」其中一个黑衣人用带着口音的英语说道，「一个聪明的年轻人，却选择了愚蠢的方式死去。」\n\n艾德蒙试图说些什么，但嘴里涌出的只有血沫。他的视野渐渐模糊，最后看到的是头顶挂着的那幅画——卡拉瓦乔的杰作，那束神圣的光芒似乎正在召唤他。\n\n然后，一切陷入永恒的黑暗。", "death_text": "艾德蒙·克劳福德的尸体被发现于布莱克伍德庄园的花园中，官方结论是遭遇窃贼行凶。他的死成为伦敦社交界一时的谈资，但很快就被新的丑闻所取代。没有人知道他在生命的最后时刻发现了什么，那些秘密与他一起被埋葬在海格特公墓的一块普通墓碑之下。", "choice_presentation": null, "echo_applied": []}, "node_dead_003": {"node_id": "node_dead_003", "narrative_text": "艾德蒙决定逃跑。他冲向房间另一端的那扇门，心中祈祷它不是锁着的。\n\n门把手在他手中转动——没锁！他猛地拉开门——然后他的心沉到了谷底。\n\n门后是一堵墙。准确地说，是砖墙——新砌的砖，灰泥还没有完全干透。这扇门通往的通道曾经存在，但不知何时被人封死了。\n\n他听到身后传来一声冷笑。「你以为我们不会防备吗，侦探先生？」\n\n艾德蒙慢慢转过身。两个黑衣人站在几步之外，其中一人手里握着一根铁棍——沾着深色污渍的铁棍，那或许就是杀死伯爵的凶器。\n\n「你们是谁？」艾德蒙试图拖延时间，眼睛在房间里搜寻任何可能的武器。\n\n「我们是来清理遗留问题的人。」黑衣人举起铁棍，「就像我们清理伯爵一样。」\n\n艾德蒙突然向左侧扑去，试图绕过他们逃向暗道。但狭小的空间没有给他足够的回旋余地。\n\n铁棍砸在他的后脑上，发出一声沉闷的声响——与几天前伯爵死去时一模一样的声响。\n\n艾德蒙倒在地上，视野中浮现出伯爵的面孔。他终于明白了密室杀人的真相，但这个真相将随他一起被埋葬。", "death_text": "艾德蒙的尸体被塞进了地下室角落的一个木箱中。一周后，木箱被运上了一艘开往大西洋的货船。他的遗骸最终沉入大海深处，与那幅卡拉瓦乔真迹一起，消失在历史的迷雾中。", "choice_presentation": null, "echo_applied": []}, "node_015": {"node_id": "node_015", "narrative_text": "艾德蒙决定找警探威廉一同前往。在这样一个充满危险的调查中，有一个代表官方权威的同伴是明智之举。\n\n他在庄园的起居室找到了威廉。老警探正坐在壁炉旁抽烟斗，皱着眉头翻看一本笔记。\n\n「警探，我需要您的帮助。」\n\n威廉抬起头，眼中闪过一丝警惕。「什么事？」\n\n「我发现书房有一条暗道通向地下室。我认为那里藏着案件的关键证据，但我不想独自前往。」\n\n威廉站起身，将烟斗放在桌上。「你应该早点告诉我这些。走，带我去看看。」\n\n两人穿过空旷的走廊，来到书房。艾德蒙按下壁炉旁的机关，书架缓缓移开，露出那条向下的暗道。\n\n「见鬼，」威廉低声咒骂，「我们搜查的时候怎么没发现这个？」\n\n两人沿着陡峭的石阶向下走去。在暗道的尽头，那扇厚重的木门出现在眼前。威廉一脚踹开门，手枪对准房间内部。「警察！不许动！」\n\n但房间里空无一人。\n\n艾德蒙跟着走进去，点燃更多的蜡烛。随着光线增强，他们看清了地下室的全貌：墙上挂满的画作，桌上散落的文件，以及角落里那幅失踪的卡拉瓦乔真迹。\n\n但最让威廉震惊的，是桌上的那些文件。\n\n「这是……」老警探拿起一份文件，脸色变得凝重，「这是烧炭党的联络文件。我见过类似的东西——意大利统一运动的地下组织。」\n\n「伯爵是烧炭党的资助者？」艾德蒙问道。\n\n「不仅是资助者。」威廉翻看着更多文件，「他是整个英国网络的核心人物。这些文件记录了他如何通过出售画作为革命筹集资金，以及他与意大利本土组织的联系。」\n\n艾德蒙拿起另一份文件——这是一封信，用意大利文写成，但信末的签名让他心中一惊：拉扎罗·卡瓦列里。管家的全名。\n\n「警探，管家也是这个组织的成员。」\n\n「这件事比我们想象的要复杂得多。如果伯爵是被奥地利人杀死的，作为对意大利革命运动的报复……那么凶手可能不是庄园里的任何人，而是外部的刺客。」\n\n两人对视，一个更大的阴谋逐渐浮出水面。", "choice_presentation": null, "echo_applied": []}, "node_016": {"node_id": "node_016", "narrative_text": "艾德蒙决定去找伯爵夫人。她是这座庄园的女主人，如果有人知道所有的秘密，那就是她。\n\n他在画廊找到了伊莎贝拉。她坐在窗边的长椅上，月光透过彩色玻璃在她的脸上投下斑驳的光影。她手中握着一串念珠，嘴唇微微翕动，似乎在祈祷。\n\n「伯爵夫人。」\n\n伊莎贝拉抬起头，眼中闪过一丝复杂的情绪。「克劳福德先生。这么晚了，您还没有休息？」\n\n「我需要告诉您一些事情。」艾德蒙在她旁边坐下，压低声音，「我发现了书房的暗道，它通往地下室。我认为那里藏着与案件相关的重要证据。」\n\n伊莎贝拉的身体微微僵硬了，但她的表情没有任何变化。\n\n「我打算今晚去地下室调查，但我需要更多的信息。」艾德蒙直视她的眼睛，「伯爵夫人，请告诉我真相。管家拉扎罗到底是谁？你们之间是什么关系？」\n\n长久的沉默。月光在窗外的云层后躲藏，画廊陷入更深的黑暗。\n\n然后，伊莎贝拉开口了，声音低沉而平静：「拉扎罗是我同父异母的哥哥。」\n\n艾德蒙感到一阵震惊，但他努力保持镇定。「你们是兄妹？」\n\n「是的。我们有同一个父亲——一位参与意大利统一运动的贵族。五年前，我父亲去世，临终前他给我们留下一个任务：保护那幅画——卡拉瓦乔的真迹。它不仅是艺术品，更是意大利民族精神的象征。」\n\n她从衣兜中取出一把钥匙，递给艾德蒙。「这是通往地下室的另一条路。从庄园后门的花房出发，有一条秘密通道。用这把钥匙可以打开。」\n\n艾德蒙接过钥匙，感受着它的重量。「现在，你知道了真相。问题是，你打算怎么做？」", "choice_presentation": "伯爵夫人的话语在艾德蒙心中激起千层浪。她递来的不仅是一把钥匙，更是一个抉择。\n\n如果他相信她，使用这把钥匙，就意味着站在了革命者这一边。他将成为这个秘密的一部分，帮助他们完成未竟的事业。但这也意味着他放弃了作为侦探的中立立场。\n\n如果他怀疑这是陷阱，拒绝她的帮助，那他就只能靠自己继续调查。但这样做会失去一个可能的盟友，也会让他在这个充满敌意的庄园中更加孤立。\n\n钥匙在他手中，冰凉而沉重。月光再次从云层后探出，照亮了伊莎贝拉期待的眼神。", "echo_applied": ["node_003"]}, "node_dead_004": {"node_id": "node_dead_004", "narrative_text": "艾德蒙不相信她。\n\n太多巧合了——意大利裔的伯爵夫人，意大利裔的管家，意大利的革命运动。这一切听起来像是精心编织的谎言，用来掩盖真正的罪行。\n\n「我不需要你的钥匙，」他冷冷地说，将钥匙放在窗台上，「我会用自己的方式找到真相。」\n\n伊莎贝拉的表情变得难以捉摸。「如你所愿，克劳福德先生。但请记住我的警告——这座庄园里不只有我们。」\n\n艾德蒙转身离开画廊，没有注意到伊莎贝拉眼中闪过的一丝痛苦。\n\n他沿着走廊向自己的房间走去，心中盘算着下一步的计划。就在他掏出钥匙的瞬间，一双手从背后捂住了他的口鼻。一股奇怪的甜味钻入他的鼻腔——氯仿。\n\n他试图挣扎，但身体迅速变得软弱无力。最后的意识中，他看到一个穿着黑色大衣的陌生人，面无表情地注视着他。\n\n「可惜，」陌生人用带着德语口音的英语说道，「伯爵夫人本可以保护你的。」\n\n然后，一切归于黑暗。艾德蒙再也没有醒来。奥地利密探从不留下活口。", "death_text": "三天后，一具身份不明的男性尸体在泰晤士河畔被发现。死因是溺水，但验尸官注意到死者生前曾被氯仿麻醉。这具尸体后来被确认是失踪的私人侦探艾德蒙·克劳福德。他的死被官方归类为「调查中意外身亡」，没有人追究真正的凶手。", "choice_presentation": null, "echo_applied": []}, "node_017": {"node_id": "node_017", "narrative_text": "艾德蒙屏住呼吸，紧紧贴在墙角的阴影中。他吹灭了手中的蜡烛，让黑暗成为他的保护色。\n\n脚步声在门口停下，然后门被推开了。灯笼的光芒涌入地下室，艾德蒙从阴影中看到两个熟悉的身影：管家拉扎罗和伯爵夫人伊莎贝拉。\n\n「确定没有人跟踪你？」拉扎罗低声问道，用意大利语。\n\n「确定。那个侦探还在他的房间里。」伊莎贝拉回答，「我们必须在午夜前把画转移走。码头的人已经安排好了。」\n\n艾德蒙的心跳加速。他能听懂他们的对话——多亏了他在罗马度过的那两年。\n\n他们的对话揭示了真相：伯爵是被奥地利密探杀害的，而不是面前这两个人。管家和夫人正试图转移画作，为革命筹集资金。\n\n「是我。」艾德蒙从阴影中走出，双手举起以示没有恶意。「我听到了一切。我知道你们不是凶手。我想帮忙。」\n\n两个人都惊住了。伊莎贝拉的眼中闪过复杂的情绪。「你……你都听到了？」\n\n「是的。奥地利密探杀死了伯爵，你们正试图保护那幅画，并且逃离他们的追杀。」艾德蒙深吸一口气，「我可以帮你们。作为交换，我只想要一样东西——真相。全部的真相。」", "choice_presentation": null, "echo_applied": ["node_010"]}, "node_018": {"node_id": "node_018", "narrative_text": "艾德蒙和威廉警探站在地下室中，被文件堆积如山的证据所包围。这不仅仅是一起密室杀人案——这是一个涉及国际政治的阴谋。\n\n「我必须向上级汇报这件事，」威廉说，「这已经超出了普通谋杀案的范畴。如果伯爵真的是被奥地利密探杀死的，这可能引发外交事件。」\n\n艾德蒙明白威廉的立场，但他也看到了问题。「警探，如果您现在就上报，伯爵夫人和管家会被逮捕。他们参与了革命组织——这在英国法律下是严重的罪行。但他们不是杀死伯爵的人。真正的凶手——奥地利密探——会逍遥法外。」\n\n威廉沉默了。「你有什么建议？」", "choice_presentation": "威廉警探等待着艾德蒙的回答。老警察的眼睛里有一种复杂的神情。\n\n支持警探上报是最稳妥的选择。法律虽然不完美，但它是维持秩序的基础。\n\n但请求暂缓可能是唯一抓住真凶的机会。奥地利密探不会在伦敦逗留太久——一旦他们发现伯爵的死引起了调查，他们就会消失得无影无踪。\n\n「给我24小时，」艾德蒙可以这样说，「如果我找不到真凶，就按您的方式办。」", "echo_applied": []}, "node_019": {"node_id": "node_019", "narrative_text": "艾德蒙选择相信伯爵夫人。他握紧那把钥匙，点了点头。\n\n伊莎贝拉的眼中闪过一丝欣慰。「跟我来。」\n\n她带领艾德蒙穿过庄园的后门，来到月光下的花房。这是一座玻璃建筑，里面种满了各种热带植物。伊莎贝拉推开一丛蕨类植物，露出墙壁上的一个小门。艾德蒙用钥匙打开它，发现里面是一条狭窄的石砌通道。\n\n在接下来的一个小时里，艾德蒙听到了一个跨越三十年的故事：伯爵是意大利统一运动的资助者，那幅画是革命的象征。奥地利帝国的秘密警察追踪到了伯爵的活动，派出刺客杀死了他。\n\n「现在你知道了一切，」伊莎贝拉说，「问题是，你会怎么做？」", "choice_presentation": null, "echo_applied": ["node_011"]}, "node_020": {"node_id": "node_020", "narrative_text": "真相终于完全呈现在艾德蒙面前。\n\n他站在地下室中央，被历史的重量所包围。墙上的画作不仅是艺术品，更是一个民族争取自由的象征。\n\n「我看到三条路，」他说，「第一，我可以帮助你们转移画作，让革命者完成使命。第二，我可以将所有真相公之于众，让法律来裁决。第三，我可以追捕那些奥地利密探，为伯爵复仇，同时保护你们不受威胁。」\n\n伊莎贝拉和拉扎罗交换了一个眼神。「无论你选择什么，我们都尊重你的决定。你已经证明了自己是一个正直的人。」", "choice_presentation": "三条路径在艾德蒙面前展开，每一条都通向不同的未来。\n\n帮助转移画作意味着站在革命者这一边。他将成为这个秘密的一部分。\n\n坚持揭露真相则是侦探的本分。真相永远是真相，不应因为政治立场而被掩盖。\n\n追捕奥地利密探是最直接的正义之路。他们杀死了伯爵，应该为此付出代价。\n\n时间在流逝，决定必须在黎明前做出。", "echo_applied": ["node_008"]}, "node_ending_001": {"node_id": "node_ending_001", "narrative_text": "奥地利密探被逮捕的消息迅速传遍了伦敦的上流社会。苏格兰场史无前例地成功抓获了外国间谍，这成为了报纸上连续数周的头条新闻。\n\n审判持续了三个月。艾德蒙作为主要证人，反复出庭作证。最终，三名密探被判处绞刑。\n\n「你干得漂亮，」威廉在案件结束后对艾德蒙说，「没有你，我们不可能做到这一点。」\n\n艾德蒙笑了笑，没有立刻回答。他的目光穿过窗户，看向外面雾蒙蒙的伦敦街道。\n\n凶手伏法了，这是他的胜利。但他心中始终有一个疑问：伯爵夫人和管家——那些为了理想而奋斗的革命者——他们现在在哪里？他们安全吗？\n\n几年后，当意大利统一的消息传来时，艾德蒙正站在贝克街寓所的窗前。他举起手中的酒杯，向窗外的夜空致敬：\n\n「敬自由。敬那些为之奋斗的人。」", "death_text": null, "choice_presentation": null, "echo_applied": []}, "node_ending_002": {"node_id": "node_ending_002", "narrative_text": "船在大西洋上航行了七天七夜，最终抵达法国的勒阿弗尔港。艾德蒙和伊莎贝拉踏上了欧洲大陆的土地，开始了他们的新生活。\n\n艾德蒙没有回英国。他选择留在法国，与伊莎贝拉一起继续为意大利统一的事业奋斗。\n\n1870年9月20日，当意大利军队终于攻克罗马、统一大业最终完成的那一天，艾德蒙站在奎里纳莱宫的广场上，身边站着伊莎贝拉。\n\n他们已经结婚八年了。那幅卡拉瓦乔画作最终被捐赠给了新生的意大利国家博物馆——这是对所有为自由献身的人最好的纪念。\n\n「我们做到了。」伊莎贝拉的眼中含着泪水，「拉扎罗，父亲，伯爵——他们都会为此骄傲的。」\n\n艾德蒙握着她的手，看着飘扬的三色旗，心中充满了平静。\n\n这是他选择的人生，也是最好的人生。", "death_text": null, "choice_presentation": null, "echo_applied": []}, "node_ending_003": {"node_id": "node_ending_003", "narrative_text": "艾德蒙找到了完美的平衡。\n\n在他精心构建的叙述中，奥地利密探是冷血的凶手，为了夺取一幅珍贵的画作而杀死了无辜的伯爵。伯爵夫人和管家只是受害者的家人，他们雇佣侦探是为了追寻正义，而非掩盖任何阴谋。\n\n密探被判处绞刑，伯爵夫人和管家被释放。他们悄悄离开英国，带着那幅画，前往意大利继续他们的事业。\n\n艾德蒙收到了一封没有署名的信：「你选择了正确的道路。我们永远不会忘记你。——I.」\n\n他将信烧毁，但那上面的字迹，他会记一辈子。\n\n此后的岁月里，他继续在伦敦做着私人侦探的工作。但他始终没有忘记布莱克伍德庄园教给他的那一课：真相并非总是非黑即白。有时候，最大的正义来自于在灰色地带中做出正确的选择。", "death_text": null, "choice_presentation": null, "echo_applied": []}, "node_ending_004": {"node_id": "node_ending_004", "narrative_text": "艾德蒙坚持了真相，付出了代价。\n\n伯爵夫人伊莎贝拉在纽盖特监狱度过了三年，最终死于肺结核。管家拉扎罗被判处绞刑。\n\n而艾德蒙·克劳福德，那个揭露真相的侦探，成为了伦敦最负盛名的调查者。但他知道自己不配这些赞美。\n\n每年的某一天——伊莎贝拉的忌日——他都会去海格特公墓献上一束白玫瑰。\n\n「我做了正确的事吗？」他经常问自己这个问题，从来没有得到过答案。\n\n他坚持了真相，但真相带来了什么？凶手逃脱了应有的惩罚，而那些追求自由的人却死在了异乡的土地上。\n\n艾德蒙·克劳福德活到了七十二岁，是一个备受尊敬的老人。但当他闭上眼睛的时候，最后浮现在脑海中的，是一个意大利女人的面孔——苍白、美丽、饱含泪水。\n\n「我很抱歉，」他低语道，然后陷入了永恒的沉寂。", "death_text": null, "choice_presentation": null, "echo_applied": []}, "node_ending_005": {"node_id": "node_ending_005", "narrative_text": "艾德蒙做出了明智的选择：让警察去做警察应该做的事。\n\n密探被成功逮捕。艾德蒙成为伦敦最负盛名的侦探。但这只是开始——他了解到奥地利秘密警察网络遍布欧洲，更大的阴谋正在酝酿。\n\n「我想我找到了新的事业。」他说。\n\n在接下来的岁月里，艾德蒙从一个私人侦探转变为某种更隐秘的角色。他游走于各国之间，有时是侦探，有时是顾问，有时是影子中的保护者。\n\n1871年，当罗马最终回归意大利，统一大业完成的那一天，艾德蒙站在人群中，看着三色旗在奎里纳莱宫上空飘扬。\n\n身边有人拍了拍他的肩膀。他转过头，看到了一张熟悉的面孔——伊莎贝拉。\n\n「我就知道会在这里见到你。」她说。\n\n艾德蒙微笑。「我不会错过这一刻。」\n\n他的下一个案件已经在等待了。", "death_text": null, "choice_presentation": null, "echo_applied": []}, "node_ending_006": {"node_id": "node_ending_006", "narrative_text": "案件悬而未决。\n\n尽管艾德蒙付出了所有努力，但最终的结果却令人失望。密探在被逮捕前设法销毁了大部分证据，伯爵的死被官方定性为「原因不明的暴毙」，案件被封存。\n\n艾德蒙的声誉受到了严重打击。两年后，他关闭了贝克街的事务所，离开伦敦，前往乡下定居。\n\n他不再是侦探了。他成为了一个普通人——种种花，养养狗，偶尔去村里的酒馆喝一杯。\n\n但在某些夜晚，当他独自坐在壁炉旁，看着跳动的火焰，他会想起那座雾蒙蒙的庄园，想起地下室的暗道，想起伊莎贝拉那双燃烧着信念的眼睛。\n\n有些谜团注定要永远保持神秘，有些故事注定没有结局。\n\n艾德蒙·克劳福德在那间乡间小屋里平静地度过了余生。他的墓碑上没有任何关于侦探生涯的记载，只有简单的几行字：「艾德蒙·克劳福德，1836-1895，愿他在另一个世界找到真相。」", "death_text": null, "choice_presentation": null, "echo_applied": []}, "node_021": {"node_id": "node_021", "narrative_text": "艾德蒙选择支持威廉警探的决定。法律是社会秩序的基石。\n\n第二天清晨，苏格兰场的警察包围了布莱克伍德庄园。伯爵夫人伊莎贝拉和管家拉扎罗被逮捕。\n\n但在审讯过程中，艾德蒙发现了新的线索。一个仆人承认，案发当晚曾看到两个陌生人从庄园后门离开。他们穿着黑色大衣，其中一人好像有德国口音。\n\n德国口音。奥地利人说德语。\n\n艾德蒙向威廉汇报了这个发现。老警探的眉头紧锁。「如果真是奥地利密探干的，这件事就麻烦了。外国特工在英国领土上行刺——这是外交事件。」", "choice_presentation": "案件似乎已经接近尾声——嫌疑人被捕，证据被收缴，官方正在介入。但艾德蒙心中有一个声音在低语：真正的凶手还在逍遥法外。\n\n继续追查是侦探的本能。那两个黑衣人——奥地利密探——才是杀死伯爵的真凶。\n\n或者，他可以认为自己的工作已经完成。让官方去处理国际间谍的事务，这才是明智之举。", "echo_applied": []}, "node_dead_005": {"node_id": "node_dead_005", "narrative_text": "艾德蒙决定收手。案件已经移交官方，他的工作结束了。\n\n他离开苏格兰场，坐上了返回贝克街寓所的马车。伦敦的街道在雾中若隐若现。艾德蒙靠在座椅上，闭上眼睛，准备好好休息一下。\n\n他没有注意到，一辆黑色马车一直跟在他身后。\n\n马车停在他的寓所门口时，天已经黑了。就在他掏出钥匙的瞬间，一双手从背后捂住了他的口鼻。那是他最后的记忆。\n\n他的尸体三天后在泰晤士河畔被发现，死因是后脑钝器击打——与伯爵一模一样的死法。\n\n艾德蒙·克劳福德，年轻有为的私人侦探，成为了布莱克伍德案的第二个受害者。他以为案件已经结束，却忘记了最基本的道理：在一个阴谋中知道太多的人，永远不可能真正安全。", "death_text": "艾德蒙的葬礼很简单，只有几个同行和一些老客户出席。没有人知道他真正的死因，也没有人会追查。他的墓碑上只刻着简单的几个字：艾德蒙·克劳福德，1836-1862，真相的追寻者。但真相，永远埋葬在了那个雾蒙蒙的夜晚。", "choice_presentation": null, "echo_applied": []}, "node_022": {"node_id": "node_022", "narrative_text": "艾德蒙决定冒险。「警探，给我24小时。如果我找不到奥地利密探的踪迹，我们就按您的方式办。」\n\n威廉沉默了很长时间。「24小时，不能再多了。」\n\n艾德蒙立刻投入了紧张的调查。他首先询问了庄园的所有仆人，终于从马夫那里得到了关键线索：案发当晚，有两个陌生人曾在庄园附近的小路上出现，他们往伦敦东区的方向去了。\n\n线索指向伦敦东区——那里是码头工人、水手和各种不法之徒聚集的地方。如果奥地利密探要逃离英国，他们很可能会从那里的某个秘密港口登船。\n\n艾德蒙回到庄园，在马厩里发现了更多证据：一枚刻有奥地利双头鹰图案的纽扣。这些人曾在这里藏身，等待下手的机会。", "choice_presentation": null, "echo_applied": []}, "node_023": {"node_id": "node_023", "narrative_text": "艾德蒙做出了选择：帮助伯爵夫人和管家转移画作。\n\n「我帮你们，」他说，「告诉我需要做什么。」\n\n当夜，三人开始行动。拉扎罗小心翼翼地将画从框中取出，卷起来放入一个特制的皮管。伊莎贝拉将最重要的文件烧毁，剩下的打包装箱。艾德蒙则负责望风。\n\n午夜时分，他们从庄园后门离开，乘坐一辆不起眼的马车前往伦敦港。夜色成了他们最好的掩护。\n\n但他们没有想到，奥地利密探早已布下了天罗地网。\n\n马车刚驶入码头区，一群黑衣人就从阴影中涌出，挡住了他们的去路。\n\n「下车！把画交出来，我们可以让你们活着离开。」\n\n艾德蒙的心沉了下去。他们被包围了——至少有六个人，每个人手里都拿着武器。", "choice_presentation": "码头的空气中弥漫着煤烟和海水的气息，以及即将来临的死亡。六个黑衣人形成一个半圆，缓缓逼近。\n\n让管家断后，带伯爵夫人先撤离是最实际的选择。拉扎罗年长、强壮，有军人的背景。而伊莎贝拉是革命网络的核心。\n\n三人一起正面突围则是豪赌。对方有六个人，训练有素。\n\n或者，艾德蒙可以牺牲自己吸引火力，让伯爵夫人和管家逃走。", "echo_applied": ["node_012"]}, "node_dead_006": {"node_id": "node_dead_006", "narrative_text": "艾德蒙做出了最冲动的决定。\n\n「跟我来！」他大喊一声，从马车上跳下，直接冲向最近的黑衣人。\n\n拉扎罗和伊莎贝拉别无选择，只能跟上。接下来的几秒钟如同地狱。\n\n艾德蒙撞倒了一个黑衣人，但立刻被另一个人扑倒在地。他感到一阵剧痛——一把匕首刺入了他的肩膀。\n\n远处传来伊莎贝拉的尖叫声。艾德蒙转头看去，看到她被两个黑衣人抓住，拉扎罗则倒在地上，一动不动。\n\n一只靴子踩在他的胸口上，一张面无表情的脸俯视着他。「英勇但愚蠢。」\n\n最后一击落下时，艾德蒙看到的是码头上空的星星——如此遥远，如此冷漠。\n\n三具尸体被抛入泰晤士河，随着潮水漂向大海。英雄主义害死了他们所有人。", "death_text": "码头的血迹在第二天就被雨水冲刷干净。三个人的失踪没有引起任何关注。布莱克伍德庄园被政府没收，最终被改建成一所疗养院。没有人记得那里曾经发生过什么，也没有人知道那三个为了理想而死的人的名字。", "choice_presentation": null, "echo_applied": []}, "node_dead_007": {"node_id": "node_dead_007", "narrative_text": "艾德蒙看着伊莎贝拉的眼睛，在其中看到了恐惧、希望和某种更深层的东西。\n\n「跑，」艾德蒙低声说，「我来挡住他们。」\n\n「不——」伊莎贝拉想要抓住他的手臂，但他已经跳下了马车。\n\n「照顾好那幅画。」这是他留下的最后一句话。\n\n然后他向黑衣人冲去，大声呼喊，吸引所有人的注意。\n\n第一颗子弹击中了他的大腿，他跪倒在地。第二颗子弹击中了他的胸口，他仰面倒下。但他的嘴角却浮现出一丝微笑。因为他听到了——汽笛声越来越远，那艘船正在驶向大海，载着伊莎贝拉、拉扎罗和那幅象征意大利精神的画作。\n\n他成功了。\n\n月光洒在他的脸上，血液在身下缓缓蔓延。艾德蒙·克劳福德，二十六岁，死于伦敦码头，为一个他从未到过的国家献出了生命。\n\n这是一个英雄的死亡。也是一个悲剧。", "death_text": "艾德蒙的尸体最终被码头工人发现，但没有人知道他是谁。他被以无名氏的身份埋葬在一个公共墓地里。但在遥远的意大利，在革命者的秘密会议上，人们会提起他——那个为了意大利的自由而牺牲的英国人。1871年，意大利统一时，有人在罗马竖起了一座小小的纪念碑，上面只刻着一行字：献给所有为自由献身的无名英雄。", "choice_presentation": null, "echo_applied": []}, "node_024": {"node_id": "node_024", "narrative_text": "艾德蒙深吸一口气，做出了他作为侦探的本能选择：揭露真相。\n\n「真相必须大白于天下，」他说，「这是我的职责。」\n\n伊莎贝拉的眼中闪过一丝失望，但她点了点头。「我理解。你是一个正直的人，克劳福德先生。」\n\n第二天，他向威廉警探详细汇报了所有发现。接下来的日子里，苏格兰场和外交部陷入了疯狂的行动。伯爵夫人和管家被逮捕，地下室的所有物品被没收。\n\n他面临着最后的选择：是只揭露凶手的身份，同  null, "echo_applied": []}, "node_dead_010": {"node_id": "node_dead_010", "narrative_text": "复仇的欲望战胜了理智。\n\n艾德蒙从藏身处跃出，快步走向密探们。他的手伸向口袋里的小型手枪。\n\n「站住！」他大喊，「你们被——」\n\n他的话还没说完，最近的保镖已经转身向他扑来。艾德蒙举枪，但那人的速度太快了——一把匕首从袖子里滑出，在艾德蒙的手腕上划出一道血痕。手枪落地，发出清脆的声响。\n\n周围的旅客惊叫着四散逃开。混乱中，艾德蒙感到腹部一阵剧痛——另一个保镖已经从背后接近，一把匕首刺入了他的身体。\n\n他跪倒在月台上，鲜血在石板地面上蔓延。远处，威廉警探正带着人赶来，但已经太晚了。\n\n密探们趁乱跳上了即将出发的火车。汽笛长鸣，车轮转动，列车缓缓驶离月台，带走了那三个凶手。\n\n艾德蒙躺在冰冷的月台上，看着火车消失在雾中。黑暗降临时，他听到的最后一个声音是火车远去的汽笛——那是逃脱的凶手留给他的讽刺。", "death_text": "艾德蒙·克劳福德在维多利亚车站的月台上断气，享年二十六岁。他的死登上了伦敦各大报纸的头版——「勇敢侦探追凶身亡」。但真正的故事，没有人知道。奥地利密探成功逃离英国，从此消失在欧洲大陆的某个角落。", "choice_presentation": null, "echo_applied": []}, "node_026": {"node_id": "node_026", "narrative_text": "艾德蒙决定继续追查。他将新证据递交给威廉警探，老警察看完后神色凝重。\n\n「你找到什么了？」\n\n「目击证人、行踪线索，还有这个。」艾德蒙从口袋里掏出那枚刻有奥地利双头鹰的纽扣，「他们就藏在伦敦东区，等待离开英国的机会。」\n\n威廉站起身，走到办公室的窗前。沉默持续了很长时间。\n\n「你知道，」他终于开口，「追查外国间谍不是我们的职责范围。但我进入这一行的时候，曾经发誓要让正义得到伸张。三十年了，也许这是我最后一次能够做点真正重要的事情的机会。」\n\n两人连夜展开行动。经过一天一夜的跟踪，他们终于锁定了目标：三名奥地利密探确实藏身于那家叫「锚与链」的酒馆，并计划第二天在维多利亚车站乘坐火车前往利物浦。\n\n第二天清晨，艾德蒙和威廉带着六名便衣警察出现在维多利亚车站。上午九点整，三个穿着黑色大衣的男人出现在了月台上。\n\n「先生们，」威廉亮出警徽，「苏格兰场。请跟我们走一趟。」\n\n密探们的脸色瞬间变得苍白。在众目睽睽之下，任何暴力行动都会立刻暴露他们的身份。他们束手就擒。", "choice_presentation": null, "echo_applied": []}, "node_027": {"node_id": "node_027", "narrative_text": "艾德蒙做出了最艰难的选择。\n\n「管家断后，」他低声对伊莎贝拉说，「我带你先走。」\n\n拉扎罗没有争辩。作为一个经历过无数危险的革命者，他比任何人都清楚：有时候，必须有人牺牲，才能让希望延续。\n\n「保护好妹妹，」他对艾德蒙说，「还有那幅画。别让我们所有人的努力白费。」\n\n然后他转身，向黑衣人冲去。\n\n「跑！」艾德蒙抓住伊莎贝拉的手，向码头上的那艘船狂奔。\n\n身后传来打斗声、枪声、喊叫声。艾德蒙不敢回头。\n\n船在眼前越来越近。「开船！」他大喊，「现在就开船！」\n\n蒸汽机轰鸣起来，船缓缓离开码头。艾德蒙站在甲板上，回头望去——他看到拉扎罗倒在了码头上，但已经没有人追来了。\n\n「拉扎罗……」伊莎贝拉的声音颤抖着，泪水夺眶而出。\n\n艾德蒙沉默地搂住她。一个人死了，只为了让另外两个人活下来。这就是革命的代价。\n\n三天后，船抵达法国。艾德蒙和伊莎贝拉踏上了新的土地，开始了新的生活。而那幅画，最终被安全地送到了意大利革命组织的手中。", "choice_presentation": null, "echo_applied": ["node_007"]}, "node_028": {"node_id": "node_028", "narrative_text": "艾德蒙选择了折中之道。\n\n站在听证会的证人席上，他深吸一口气，开始陈述。他详细描述了密探的行动方式、作案手法和逃离路线，但在涉及伯爵的政治倾向和革命活动时，他巧妙地回避了。\n\n「伯爵是一位艺术品收藏家，」他说，「那幅画的失窃是凶手的主要动机。至于伯爵为何会成为目标……也许是因为那幅画的争议来源。但这只是推测。」\n\n他没有提及烧炭党、意大利统一运动，或者伯爵夫人和管家的真实身份。\n\n听证会结束后，密探被正式起诉并移交给英国法庭审理。最终，三名密探被判处绞刑。\n\n而伯爵夫人和管家——由于没有确凿证据证明他们参与了任何非法活动——被释放。他们悄悄离开英国，带着那幅画，前往意大利继续他们的事业。\n\n艾德蒙收到了一封没有署名的信：「你选择了正确的道路。我们永远不会忘记你。——I.」\n\n他将信烧毁，但那上面的字迹，他会记一辈子。", "choice_presentation": null, "echo_applied": ["node_015"]}, "node_029": {"node_id": "node_029", "narrative_text": "艾德蒙选择全盘托出。\n\n他站在听证会的证人席上，用平静的声音讲述了他所发现的一切：地下室的画作和文件、伯爵与意大利烧炭党的关联、伯爵夫人和管家的真实身份、奥地利密探的暗杀行动。\n\n他没有隐瞒任何事情。真相就是真相，不应该被操纵或过滤。\n\n听证会后，事态的发展超出了艾德蒙的控制。\n\n最终的解决方案是一个政治妥协：密探被驱逐出境，而不是受到审判。作为交换，奥地利承诺不再在英国领土上采取类似行动。\n\n凶手逃脱了真正的惩罚。\n\n而伯爵夫人和管家则没有那么幸运。他们被指控「支持外国革命组织」和「资助颠覆活动」。伊莎贝拉被判处五年监禁，最终因肺病死于狱中。拉扎罗被判处绞刑。\n\n艾德蒙亲眼目睹了绞刑的执行。那一刻，他开始怀疑自己做的选择是否正确。\n\n他坚持了真相，但真相带来了什么？凶手逍遥法外，无辜者惨死狱中。这是正义吗？", "choice_presentation": null, "echo_applied": []}, "node_030": {"node_id": "node_030", "narrative_text": "艾德蒙选择了最谨慎的方式：伪装。\n\n他在东区的旧货市场买了一套水手的衣服——沾满油污的帆布裤子、褪色的条纹衬衫、一顶皱巴巴的帽子。他还从一个码头工人那里借来了一股浓烈的朗姆酒味，只需把酒洒在衣服上就行。\n\n当天深夜，一个看起来醉醺醺的水手踉踉跄跄地走进了「锚与链」酒馆。\n\n酒馆里烟雾缭绕，挤满了各种粗犷的面孔。艾德蒙装作寻找座位，实际上他的目光在搜寻着目标。很快，他看到了——角落里的那张桌子，三个穿黑色外套的人。\n\n艾德蒙在吧台找了个位置，点了一杯最便宜的啤酒。他假装喝酒，实际上在偷听黑衣人的对话。\n\n幸运的是，他们说的是德语，而且没有压低声音——显然认为在这个地方不会有人听懂。\n\n「明天上午十点，」其中一人说，「在维多利亚车站第三月台。联络人会带来假护照。」\n\n艾德蒙心中一震。他获取了关键情报。离开酒馆后，他立刻去找威廉警探。有了这些信息，他们可以在车站设下埋伏，一网打尽。", "choice_presentation": null, "echo_applied": []}, "node_031": {"node_id": "node_031", "narrative_text": "第二天清晨，伦敦笼罩在浓雾中。艾德蒙早早来到维多利亚车站，在候车大厅找了个角落坐下，假装阅读报纸。\n\n威廉警探和他的人已经就位——两人在售票处附近，两人在第三月台入口，还有两人混在人群中随时准备行动。一切都按计划进行。\n\n上午九点五十分，三个黑衣人出现了。他们穿着普通的旅行装，身边还有两个人——应该就是联络人派来的保镖。\n\n五对七。情况比预想的要复杂。\n\n艾德蒙与威廉交换了一个眼神。老警探微微点头，示意按原计划行动。\n\n但在行动之前，艾德蒙面临最后一个选择：是按计划让警察去抓捕，还是自己冲上去亲手解决这些杀人凶手？\n\n复仇的欲望在他心中燃烧。这些人杀死了伯爵，害得伊莎贝拉和拉扎罗流亡，让他自己也陷入危险之中。但理智告诉他，冲动可能会毁掉一切。\n\n密探们正在向第三月台走去。时间所剩无几。", "choice_presentation": "密探们正在向第三月台走去。时间所剩无几。\n\n通知警察抓捕是最稳妥的选择。威廉的人已经就位，他们训练有素，装备精良。让专业的人做专业的事，这才是明智之举。\n\n但另一方面，独自出手的诱惑如此强烈。这些人杀死了一个无辜的人，如果艾德蒙能亲手将他们击倒，那种满足感将是无与伦比的。\n\n密探们已经走到了月台边缘。火车的汽笛声响起，离开车只有几分钟了。\n\n艾德蒙做出了最后的选择。", "echo_applied": []}}, "reward": 1.0, "duration": 3820.7}, {"seed_id": "seed_002", "story_graph": {"title": "末日列车：永恒号的抉择", "genre": ng", "merge_to": null, "knowledge_facts": []}, "ending_018": {"node_id": "ending_018", "title": "新大陆", "act": 3, "node_type": "ending", "scene_description": "在修复引擎的过程中，叶婷发现了一个惊人的秘密：列车的传感器早就检测到了一片温暖的地区——一个地热活跃带形成的绿洲。列车长一直隐瞒这个信息，因为停靠意味着他失去权力。林晓公开了这个发现，全车投票决定：永恒号将驶向新家园。当列车停靠在那片绿色的土地上时，人们第一次走出车厢，呼吸到了新鲜的空气。", "characters_present": ["林晓", "叶婷", "所有乘客"], "next_nodes": [], "choices": [], "value_conditions": [{"dimension": "tech_progress", "operator": ">=", "value": 80}, {"dimension": "trust", "operator": ">=", "value": 70}], "death_cause": null, "death_description_hint": null, "ending_type": "hidden_ending", "merge_to": null, "knowledge_facts": [{"fact_id": "fact_hidden_001", "content": "存在一片地热绿洲可供定居", "witnesses": ["林晓", "叶婷"]}]}}, "branches": {"branch_revolution": {"branch_id": "branch_revolution", "branch_type": "strong", "source_node_id": "node_004", "node_ids": ["node_007", "node_011", "node_017", "node_025", "node_037", "node_052"], "merge_node_id": "node_071", "description": "革命路线：支持老王发动三等舱起义，通过暴力手段夺取列车控制权"}, "branch_technical": {"branch_id": "branch_technical", "branch_type": "strong", "source_node_id": "node_006", "node_ids": ["node_010", "node_016", "node_024", "node_035", "node_050", "node_064"], "merge_node_id": "ending_009", "description": "技术路线：专注于引擎修复，与叶婷合作通过技术手段解决问题"}, "branch_diplomatic": {"branch_id": "branch_diplomatic", "branch_type": "strong", "source_node_id": "node_005", "node_ids": ["node_009", "node_014", "node_022", "node_032", "node_047", "node_076"], "merge_node_id": "ending_013", "description": "外交路线：通过正式渠道和人际关系，建立跨阶层联盟"}, "branch_pearl_escape": {"branch_id": "branch_pearl_escape", "branch_type": "pearl_string", "source_node_id": "node_046", "node_ids": ["node_063", "node_083", "node_084", "node_098", "node_099"], "merge_node_id": null, "description": "逃生舱支线：发现列车长的逃生计划，决定如何利用这个信息"}}, "echo_points": [{"source_node": "node_003", "source_option": "立即返回向老王报告", "target_node": "node_025", "echo_type": "consequence_echo", "echo_instruction": "老王提及林晓第一时 uction": "握手时描写林晓的紧张，想起之前做出这个冒险决定的场景"}, {"source_node": "node_088", "source_option": "拒绝接受这个逻辑", "target_node": "ending_005", "echo_type": "dialogue_echo", "echo_instruction": "结局中林晓的演讲引用他拒绝列车长时说的话，成为新时代的座右铭"}, {"source_node": "node_099", "source_option": "拒绝，宁可玉石俱焚", "target_node": "ending_011", "echo_type": "mood_echo", "echo_instruction": "在极寒中建立避难所时，人们想起林晓宁折不弯的选择"}], "ending_matrix": [{"ending_id": "ending_005", "ending_type": "true_ending", "value_conditions": [], "description": "信念的力量：林晓拒绝功利主义，带领所有人找到新的生存方式"}, {"ending_id": "ending_009", "ending_type": "true_ending", "value_conditions": [], "description": "技术的胜利：用智慧和技术解决问题，没有牺牲任何人"}, {"ending_id": "ending_013", "ending_type": "true_ending", "value_conditions": [], "description": "三方联盟：不同阶层代表组成管理委员会，建立真正平等的新秩序"}, {"ending_id": "ending_017", "ending_type": "true_ending", "value_conditions": [], "description": "全民觉醒：和平变革，开启真正的民主时代"}, {"ending_id": "ending_018", "ending_type": "hidden_ending", "value_conditions": [{"dimension": "tech_progress", "operator": ">=", "value": 80}, {"dimension": "trust", "operator": ">=", "value": 70}], "description": "新大陆：发现地热绿洲，列车停靠新家园"}, {"ending_id": "ending_003", "ending_type": "good_ending", "value_conditions": [], "description": "英雄的抉择：击毙列车长，引擎修复，但留下心理创伤"}, {"ending_id": "ending_004", "ending_type": "good_ending", "value_conditions": [{"dimension": "tech_progress", "operator": ">=", "value": 70}], "description": "险中求胜：替代方案成功，林晓成为英雄"}, {"ending_id": "ending_008", "ending_type": "good_ending", "value_conditions": [], "description": "密钥之战：夺取密钥完成修复，列车长坠亡"}, {"ending_id": "ending_015", "ending_type": "good_ending", "value_conditions": [{"dimension": "trust", "operator": ">=", "value": 60}], "description": "政变：用证据迫使列车长下台，不流血的权力交接"}, {"ending_id": "ending_016", "ending_type": "good_ending", "value_conditions": [{"dimension": "revolution", "operator": ">=", "value": 70}], "description": "革命胜利：三等舱占领列车，建立新秩序"}, {"ending_id": "ending_001", "ending_type": "neutral_ending", "value_conditions": [], "description": "妥协的和平：放走列车长，引擎修复但正义未伸张"}, {"ending_id": "ending_007", "ending_type": "neutral_ending", "value_conditions": [], "description": "逃离者：列车长逃跑但列车存活，新秩序建立"}, {"ending_id": "ending_010", "ending_type": "neutral_ending", "value_conditions": [], "description": "囚徒困境：列车长被软禁，不稳定的和平"}, {"ending_id": "ending_012", "ending_type": "neutral_ending", "value_conditions": [], "description": "灰色英雄：帮助镇压起义但暗中改革，代价与改变并存"}, {"ending_id": "ending_002", "ending_type": "bad_ending", "value_conditions": [], "description": "血色胜利：叶婷等人质死亡，胜利但人性受损"}, {"ending_id": "ending_006", "ending_type": "bad_ending", "value_conditions": [], "description": "方舟计划：成为刽子手，背叛所有人只为文明延续"}, {"ending_id": "ending_011", "ending_type": "bad_ending", "value_conditions": [], "description": "同归于尽：谈判破裂，列车停止但获得自由"}, {"ending_id": "ending_014", "ending_type": "bad_ending", "value_conditions": [], "description": "孤独的修复者：放弃革命完成修复，但永远孤立"}], "characters": [{"name": "林晓", "role": "protagonist", "description": "三等舱工程师，沉默寡言但技术天才。发现引擎危机后，他必须在修复列车和改变命运之间做出选择。"}, {"name": "列车长赵明远", "role": "antagonist", "description": "永恒号的最高统治者。表面维护秩序，实际上是一个冷酷的功利主义者，愿意牺牲大多数人来保存'精英'。"}, {"name": "叶婷", "role": "npc", "description": "头等舱科学家，引擎专家。知道引擎的秘密但被列车长软禁，渴望自由并愿意帮助林晓。"}, {"name": "陈浩", "role": "npc", "description": "二等舱医生，中间人角色。有家人在头等舱，不愿轻易站队，但良心驱使他帮助林晓。"}, {"name": "老王", "role": "npc", "description": "三等舱领袖，革命的火种。多年来一直等待推翻阶层秩序的机会，但容易因愤怒失去理智。"}]}, "narratives": {"node_001": {"node_id": "node_001", "narrative_text": "永恒号的第2847个黎明，和之前的每一天并无不同。\n\n林晓睁开眼睛，头顶是锈迹斑驳的金属天花板，不到两米的距离让人透不过气。三等舱的空气永远带着一股机油和汗水混合的味道，七年了，他早该习惯。\n\n身侧的铺位上，老张还在打鼾，呼出的白气在寒冷的空气中凝结。供暖系统又出问题了，这在三等舱是常态。林晓裹紧那件补了又补的工作服，把双手塞进腋下取暖。\n\n列车轰鸣着穿过永恒的冰原。透过狭小的舷窗，外面是一片死寂的白色——核冬天已经持续了将近八年，气温常年维持在零下七十度。据说曾经有人试图离开列车，尸体在三十秒内就被冻成了冰雕。\n\n永恒号是人类最后的方舟，也是最后的牢笼。\n\n林晓坐起身，习惯性地将手掌贴在墙壁上。金属传来熟悉的震动，那是引擎心脏的跳动，是三千条生命的保障。作为三等舱为数不多的工程师，他比任何人都熟悉这种节奏。\n\n但今天，有些不对。\n\n震动的频率变了，那种微妙的变化普通人根本察觉不到，但林晓的手指能感受到——像是一个人的心跳突然漏了半拍。他皱起眉头，又仔细感受了一遍。不是错觉，引擎确实在某个环节出了问题。\n\n\"小晓，又在发什么呆？\"老王的声音从对面铺位传来。这个五十多岁的男人是三等舱公认的领袖，曾经是核电站的高级技术员，现在却只能和所有人一样挤在这个铁皮罐头里苟延残喘。\n\n\"王叔，引擎的声音......好像不太对。\"\n\n老王翻身坐起，浑浊的眼睛里闪过一丝警觉。他也把手贴在墙上，沉默了片刻。\n\n\"你没听错，\"老王压低声音，\"这几天我也感觉到了。但这事......先别声张。\"\n\n广播系统发出刺耳的电流声，列车长赵明远的声音准时响起：\"永恒号全体乘客早安。今天是安全运行的第2847天。各车厢维持正常作息，三等舱维护组请于七点整到指定区域报到。愿永恒号永远前行。\"\n\n林晓和老王交换了一个眼神。在这列车上，有些事情，只有靠自己去查清楚。", "choice_presentation": null, "echo_applied": []}, "node_002": {"node_id": "node_002", "narrative_text": "维护组的工作一如既往地繁重。\n\n林晓被分配去检查三等舱E区的供暖管道，那里已经连续三天供暖不足，居民们怨声载道。他背着工具包，穿过拥挤的走廊，尽量无视那些投来的目光——有些是期待，有些是麻木，还有些是隐藏不住的怨恨。\n\n三等舱住着将近两千人，却只有不到一百名维护工，而真正懂技术的不超过二十个。林晓是其中最年轻的一个，也是技术最好的一个。这本该是他的骄傲，但在这列车上，技术好只意味着干更多的活。\n\nE区的供暖管道藏在一堵假墙后面，林晓拆开检修口，钻进狭窄的维护空间。手电筒的光芒在管道间跳跃，照出厚厚的灰尘和锈蚀的痕迹。这些管道已经超期服役太久，打补丁只是治标不治本。\n\n他沿着管道往深处爬，寻找泄漏点。爬过一个拐角时，他的手肘撞到了一块松动的金属板，发出沉闷的回响。林晓停下动作，用手电照向那块板子——那不是普通的墙壁，像是被人故意封死的通道。\n\n好奇心驱使他撬开了那块板子。\n\n后面是一条废弃的维护通道，比他正在爬的这条宽敞得多，却布满了蛛网和灰尘。显然已经很多年没人来过。通道向下倾斜，消失在黑暗中。\n\n林晓犹豫了一下，还是钻了进去。\n\n通道越来越热，空气中开始弥漫着一股焦糊的气味。他爬了大约十五分钟，突然感到脚下的金属开始剧烈震动。他趴在格栅上，透过缝隙往下看——\n\n那是永恒号的心脏。\n\n巨大的引擎就在他脚下三十米处运转着，蓝色的等离子火焰在反应堆中跳跃。但让林晓血液冰凉的不是引擎本身，而是缠绕在冷却系统上的那些红色警告灯。\n\n至少有七个冷却模块闪烁着故障信号。\n\n林晓的手开始发抖。他在核电站的培训资料里见过这种情况——冷却系统连续失效，意味着反应堆会逐渐过热，最终......\n\n他不敢往下想。但他必须弄清楚，这列车还能跑多久。", "choice_presentation": null, "echo_applied": []}, "node_003": {"node_id": "node_003", "narrative_text": "林晓在维护通道里蹲了整整两个小时，用随身携带的检测仪收集数据。\n\n数字一个个跳出来，每一个都像是死刑判决书上的印章。冷却液泄漏率：每小时0.3%。主冷却泵效率：67%并持续下降。备用冷却系统：三个中有两个已经完全失效。\n\n他在脑子里快速计算。按照目前的衰减速度，冷却系统会在25到30天内彻底崩溃。届时，反应堆会自动启动紧急停机程序——如果他们运气好的话。如果运气不好，那就是一场足以让整列火车蒸发的核爆炸。\n\n不管哪种结果，三千条命都会在冰原上画上句号。\n\n林晓靠在滚烫的墙壁上，盯着那些闪烁的红灯发呆。他的手还在抖，不是因为恐惧——虽然恐惧确实存在——而是因为愤怒。\n\n这种级别的故障，上面不可能不知道。那些红色警告灯不是昨天才亮起的，冷却液泄漏也不是一夜之间发生的事。头等舱的那些人，列车长赵明远，他们一定早就知道了。\n\n但他们什么都没说。\n\n他们选择让三等舱的两千人在不知情的情况下等死。\n\n林晓深吸一口气，强迫自己冷静下来。愤怒解决不了问题。他需要做决定：这个发现，要告诉谁？\n\n老王第一个浮现在脑海里。三等舱的人信任老王，如果要组织什么行动，老王是关键。但老王一直对上层怀有敌意，这个消息会成为他点燃革命火种的绝佳燃料。\n\n另一个选择是走正规渠道，向二等舱的技术部门报告。这样做更安全，也许能争取到上层的信任和配合。但风险是显而易见的：消息会被封锁，他自己可能会因为\"散布谣言\"被处理掉。\n\n第三个选择是自己动手。他有技术，有知识，也许能在不惊动任何人的情况下尝试修复。但修复需要零件，三等舱没有的稀有金属和精密仪器，而且时间......时间够吗？\n\n引擎的轰鸣声在耳边震响，像是催促，又像是倒计时。林晓知道，无论他选择哪条路，都没有回头的余地。", "choice_presentation": "三十天。三千条命。林晓握紧拳头，做出了决定——", "echo_applied": []}, "node_004": {"node_id": "node_004", "narrative_text": "林晓连夜找到了老王。\n\n三等舱深处有一间废弃的储物舱，那是老王和核心成员秘密聚会的地方。林晓敲了三长两短的暗号，锈蚀的舱门吱呀一声打开，老王布满皱纹的脸出现在缝隙中。\n\n\"小晓？这个点来......出什么事了？\"\n\n林晓没有回答，径直走进去，把舱门关严。储物舱里点着一盏油灯，昏黄的光芒照着七八个人的面孔——都是老王的心腹，三等舱里最不安分的那批人。\n\n\"引擎要完蛋了，\"林晓开门见山，\"最多三十天。\"\n\n房间里的空气瞬间凝固。\n\n老王的眼睛慢慢眯了起来，那不是恐惧的神情，更像是猎人终于等到了猎物露出破绽。\n\n\"你确定？\"\n\n林晓把检测数据递过去。老王看不懂那些专业数字，但他看得懂林晓的表情。这小子从不说大话，技术上的事，他说是就是。\n\n\"上面知道吗？\"一个叫老李的中年人问道。\n\n\"肯定知道。这种级别的故障，控制室不可能监测不到。他们瞒着我们。\"\n\n沉默在储物舱里蔓延。油灯的火焰跳动着，把每个人的影子拉得忽长忽短。\n\n老王突然笑了，那笑声低沉而压抑，带着一种诡异的快意。\n\n\"好啊，好啊......\"他喃喃道，\"终于等到这一天了。七年了，我等这一天等了整整七年。\"\n\n他转向众人，眼中燃烧着危险的光芒：\"他们把我们关在这个铁皮罐头里像猪一样养着，吃他们的残羹剩饭，干他们不愿意干的活，生病了等死，老了扔出去。现在，他们连活路都不想给我们留了。\"\n\n\"但他们忘了一件事，\"老王压低声音，\"我们有两千人，他们只有几百。他们有什么资格决定谁生谁死？\"\n\n空气中弥漫着一种躁动的情绪。林晓感受到周围人的呼吸在加速，那是被压抑太久的怒火终于找到了出口。\n\n\"王叔，\"林晓开口，\"我理解你的愤怒，但是......\"\n\n\"但是什么？\"老王看着他，\"小晓，你把这个消息带来，不就是为了这一刻？\"\n\n林晓沉默了。他确实想过老王会这样反应，但当这一刻真正来临，他发现自己还没准备好。革命，流血，混乱......然后呢？引擎依然会停，列车依然会变成三千人的坟墓。\n\n\"我需要你做出选择，\"老王直视他的眼睛，\"是和我们站在一起，还是......继续做你的乖乖维修工？\"", "choice_presentation": "老王的目光像刀子一样锋利。林晓感到所有人的视线都集中在自己身上，等待他的回答。", "echo_applied": []}, "node_005": {"node_id": "node_005", "narrative_text": "林晓选择了看起来更稳妥的路。\n\n第二天一早，他来到三等舱的管理办公室，填写了一份故障报告表。表格是统一印制的，纸张泛黄，边角卷曲，显然已经用了很多年。林晓在\"故障描述\"一栏里斟酌用词，最终写下：\"在常规检修中发现主冷却系统存在异常，建议技术部门进行全面检查。\"\n\n他没敢写得太详细。直接说\"列车还有三十天就要爆炸\"，要么会被当成疯子，要么会被当成散布谣言的危险分子。\n\n管理员是个面无表情的中年女人，机械地接过表格，扫了一眼，扔进身后堆积如山的文件堆里。\n\n\"会转交技术部门，\"她说，连眼皮都没抬，\"下一个。\"\n\n林晓张了张嘴，想说这是紧急情况，不能和那些换灯泡、修马桶的报告混在一起，但对方显然没有给他说话的机会。身后排着长队，都是来反映各种鸡毛蒜皮问题的三等舱居民。\n\n他只能离开。\n\n接下来的三天，林晓几乎没有合眼。他反复通过那条废弃的维护通道潜入引擎观测区，记录冷却系统的恶化速度。数字一天比一天难看。第一天，主冷却泵效率跌到了63%。第二天，又一个备用模块亮起了红灯。第三天，他开始能闻到一股焦糊的气味。\n\n没有人联系他。他的报告石沉大海，连个回响都没有。\n\n就在林晓几乎要放弃希望的时候，第四天早上，一个穿着整洁制服的二等舱通讯员出现在三等舱的入口处。\n\n\"林晓？\"他核对着手里的名单，\"二等舱技术主管要见你，现在就去。\"\n\n周围的人投来好奇的目光。三等舱的人被召见去二等舱，这可不常见。要么是好事——被破格提拔，要么是坏事——被问罪处理。\n\n林晓跟着通讯员穿过那道他从未跨越过的闸门。刺眼的白色灯光取代了三等舱昏暗的黄光，空气中不再有那股挥之不去的霉味，走廊宽敞得可以让三个人并行。\n\n这就是二等舱。干净，明亮，秩序井然。\n\n林晓攥紧了拳头，不是因为紧张，而是因为那种熟悉的愤怒又涌了上来。同一列火车，头顶同一片铁壳，为什么他们可以住得像人，而三等舱的人只能像老鼠一样挤在一起？\n\n技术主管的办公室就在走廊尽头。林晓深吸一口气，推开了门。\n\n门内，除了一张宽大的办公桌和一个背对着他的身影，还有另一个人——一个穿着白大褂、看起来三十出头的男人，正靠在墙边，用一种奇怪的表情打量着他。\n\n那是二等舱的医生，陈浩。\n\n林晓曾经在三等舱的医疗站见过他几次。陈浩是少数几个愿意来三等舱出诊的二等舱人，据说医术不错，但为人有些......难以捉摸。", "choice_presentation": null, "echo_applied": []}, "node_006": {"node_id": "node_006", "narrative_text": "不告诉任何人。自己动手。\n\n林晓做出了这个决定后，就开始了秘密的零件收集工作。他在脑子里列出了修复冷却系统所需的清单：三个高纯度铜质散热片、一套精密的压力传感器、至少五升冷却液，以及——最关键的——一块耐高温的陶瓷绝缘垫。\n\n这些东西在三等舱根本找不到。\n\n林晓利用维修工的身份，开始系统地搜索每一个可能藏有有用材料的角落。废弃的储物间、报废的机械设备、甚至是其他维修工丢弃的垃圾堆。三天下来，他只找到了一些勉强能用的铜管和几瓶过期的润滑油。\n\n距离引擎彻底罢工，还有二十七天。\n\n他开始意识到，有些东西是无论如何都没法在三等舱找到的。精密的压力传感器不会从天上掉下来，高纯度的材料更不可能在垃圾堆里挖出来。他需要去二等舱，或者更高的地方。\n\n林晓站在三等舱与二等舱交界处的闸门前，透过巴掌大的观察窗向外张望。闸门那边是另一个世界：干净的走廊，明亮的灯光，穿着整洁制服的人们行色匆匆。\n\n没有通行证，三等舱的人无法通过这扇门。强行闯入只有一个结果——被守卫制服，然后扔到列车外面去喂风雪。\n\n但他还有另一条路。\n\n那条废弃的维护通道不仅通向引擎舱，还向上延伸到了列车的其他区域。林晓花了一个晚上绘制了一张粗略的地图，发现有一条支线可能通往二等舱的仓储区。如果他的判断没错，那里应该堆放着各种设备零件。\n\n风险是巨大的。万一被发现，他不仅没法救任何人，自己也会搭进去。\n\n但还有另一个选择：用三等舱现有的材料凑合。他手里有一些回收的废铜，强度不够但可以用数量弥补；冷却液可以用纯净水加防冻剂勉强替代；陶瓷绝缘垫......也许可以用几层云母片叠加来模拟效果。\n\n这是一场赌博。用替代材料修复，成功率也许只有三成，而且可能只是拖延几天时间。但至少不用冒被抓的风险。\n\n林晓盯着手里那堆质量参差不齐的废料，陷入了沉默。", "choice_presentation": "窗外的寒风呼啸而过，仿佛在催促他做出决定。是冒险潜入二等舱寻找合格的零件，还是用手头的材料赌一把？", "echo_applied": []}, "node_007": {"node_id": "node_007", "narrative_text": "\"我和你们站在一起。\"\n\n话一出口，林晓感觉肩上的重量似乎轻了一些，但心里却沉甸甸的。他知道自己跨过了一条看不见的线，这条线的另一边是血与火，是无法回头的深渊。\n\n老王的脸上绽放出笑容，那不是快乐的笑，更像是猎人得手时的满足。\n\n\"好，好，\"老王拍了拍林晓的肩膀，\"我就知道你小子不会让我失望。你是三等舱的人，你的血和我们一样，流的都是被上面那些人看不起的血。\"\n\n储物舱里的气氛瞬间热烈起来。那些沉默的身影开始低声交谈，讨论着接下来该怎么做。林晓听到了\"武器\"、\"时机\"、\"内应\"这些词，每一个都像是一颗等待引爆的炸弹。\n\n\"但是，\"林晓突然开口，打断了周围的嘈杂，\"革命归革命，引擎的事不能拖。如果列车停了，我们都得死。\"\n\n老王摆了摆手：\"我知道，我知道。你负责引擎的事，技术上的东西我们不懂。其他的事，交给我。\"\n\n接下来的几天，三等舱表面上风平浪静，但暗流涌动。老王开始秘密串联，以\"引擎危机\"为由，把消息一点点透露给他信任的人。愤怒像瘟疫一样蔓延开来，越来越多的人知道了上层隐瞒真相的事实。\n\n林晓一边继续他的\"维修工作\"，一边感到不安与日俱增。他在三等舱的走廊里走过时，能感受到某种电流般的紧张感。人们说话的声音变低了，聚在一起时会突然停止交谈，眼神中多了一些他不熟悉的东西。\n\n那是期待，也是恐惧，更是蓄势待发的暴力。\n\n第五天晚上，林晓被老王叫到了储物舱。这一次，里面的人更多了，大约有二十几个，挤满了整个房间。\n\n\"情况有变，\"老王的声音压得很低，\"我的人说，上面已经察觉到三等舱有异动。列车长派了更多的眼线下来，甚至有传言说他在考虑封锁三等舱。\"\n\n\"封锁？\"有人惊呼出声。\n\n\"对，把我们像老鼠一样关起来，等着引擎爆炸一起陪葬。\"老王的声音带着压抑的怒火，\"我们不能等了。\"\n\n林晓的心猛地一跳：\"王叔，你是说......\"\n\n\"我们需要加快行动。\"老王看向众人，\"问题是，消息走漏的风险太大，列车长的眼线无处不在。我们需要外援，或者更多的时间。\"\n\n他转向林晓：\"小晓，你觉得呢？我们该怎么办？\"", "choice_presentation": "所有人的目光都集中在林晓身上。他的决定，可能关系到整个行动的成败——甚至是生死。", "echo_applied": []}, "node_008": {"node_id": "node_008", "narrative_text": "\"王叔，先让我修好引擎。\"\n\n林晓的声音不大，但足够坚定。储物舱里的低语声停了下来，所有人都看着他。\n\n\"如果引擎修不好，\"他继续说道，\"就算革命成功也没有意义。我们会坐在一列停下来的火车里，冻死在这片冰原上。谁控制列车都不重要，重要的是让它继续跑下去。\"\n\n老王的眉头皱了起来，但他没有立刻反驳。他活了五十多年，见过太多热血上头最后死得很难看的人。林晓这小子的话虽然扫兴，但不是没有道理。\n\n\"你有把握修好？\"老王问。\n\n\"有把握，\"林晓没有犹豫，尽管他知道自己的把握也许只有五成，\"但我需要时间，还需要你们的掩护。我得进入二等舱，甚至头等舱，去弄到必要的零件和设备。\"\n\n\"你想让我们帮你潜入上面？\"老李插嘴道，语气里带着怀疑。\n\n\"不是潜入，是找一条可以来回的通道。\"林晓解释道，\"我发现的那条维护通道可以通往引擎舱，但要修复它，我需要那边的东西。老王叔，你在三等舱的人脉广，有没有什么办法？\"\n\n老王沉默了很长时间。油灯的火焰在他脸上投下摇曳的阴影，让他的表情更加难以捉摸。\n\n终于，他开口了：\"行。我可以给你时间，也可以帮你打掩护。但有一个条件。\"\n\n\"什么条件？\"\n\n\"修引擎的同时，帮我找一条进入头等舱的路。\"老王的眼睛直视林晓，\"我要知道那些人在想什么，他们有什么打算，有什么弱点。你是技术人员，进出方便，比我们这些老骨头强。\"\n\n林晓明白老王的意思。这是一笔交易：他帮老王探路，老王帮他争取修复引擎的时间和资源。\n\n\"可以，\"他点头，\"但不管发生什么，修引擎是第一位的。如果你们要动手，至少得等我把引擎修好。\"\n\n老王露出一个意味深长的笑容：\"你放心。我老王活了这么多年，不是一个毛躁的人。火，可以慢慢烧。重要的是，让它烧起来的时候，能烧到该烧的人。\"\n\n他站起身，向周围的人挥了挥手：\"今晚就到这里。大家回去，什么都别说，什么都别做，像平常一样过日子。等小晓的消息。\"\n\n人群散去，林晓却被老王留了下来。\n\n\"小晓，\"老王低声说，\"你是个聪明孩子，我知道你不喜欢流血，不喜欢混乱。但这列车上，有些事情是没法靠修机器解决的。你明白吗？\"\n\n林晓沉默了一会儿：\"我明白。但我会先做我能做的。\"\n\n老王拍了拍他的肩膀，没有再说什么。", "choice_presentation": null, "echo_applied": []}, "node_009": {"node_id": "node_009", "narrative_text": "二等舱的走廊比林晓想象的还要宽敞。\n\n地板是防滑的金属格栅，每隔几米就有一盏明亮的LED灯，墙壁上甚至挂着一些装饰画——风景照片，据说是核冬天之前的地球。蓝色的海洋，绿色的森林，金色的沙滩。对林晓来说，这些都只是传说。\n\n通讯员把他带到技术主管办公室门口就离开了。门虚掩着，林晓刚要敲门，就听到里面传来说话的声音。\n\n\"......报告确实是他提交的，内容基本属实。问题是，他是怎么发现那条废弃通道的？\"\n\n\"这个可以之后再查。现在的问题是，这件事怎么处理。\"\n\n林晓的心跳加速。他们在谈论他的报告，这说明报告确实送到了，而且他们认为内容\"基本属实\"——这意味着他们早就知道引擎的问题。\n\n门突然从里面打开，一个穿白大褂的男人几乎和林晓撞个满怀。\n\n\"哎哟，\"那人退后一步，打量着林晓，\"你就是林晓？\"\n\n\"是......是我。\"\n\n\"进来吧，\"男人侧身让路，\"我是陈浩，二等舱医疗部的。正好，我也想见见你。\"\n\n林晓走进办公室，视线第一时间落在那张宽大的办公桌后面——技术主管是个五十多岁的男人，头发花白，面容严肃，正用一种审视的目光看着他。\n\n\"坐。\"技术主管指了指桌前的椅子。\n\n林晓坐下，后背僵直，双手放在膝盖上。陈浩没有坐，而是靠在墙边，双手抱胸，似乎只是来看热闹的。\n\n\"你的报告我看了，\"技术主管开口，声音没有任何感情波动，\"你说主冷却系统存在异常，建议全面检查。\"\n\n\"是的，长官。\"\n\n\"说具体点。什么样的异常？\"\n\n林晓斟酌着用词：\"我在例行检修时，发现......通往引擎区域的一些管道温度异常升高。根据我的判断，可能是冷却系统出了问题。\"\n\n\"你的判断？\"技术主管扬起眉毛，\"你一个三等舱的维修工，凭什么判断冷却系统的问题？\"\n\n\"我......以前接受过相关培训，长官。核电站的基础课程。\"\n\n技术主管沉默了片刻，然后低头翻看桌上的一份文件——那应该是林晓的档案。\n\n\"核电站培训，技术评估A级，因态度问题被降为维修工......\"技术主管念着档案上的内容，\"挺有意思。一个本该在技术组的人，因为'态度问题'被扔到了三等舱。\"\n\n林晓攥紧了拳头，但他什么都没说。那段往事他不想回忆，也不想解释。\n\n\"好了，\"技术主管合上档案，\"你的报告我会上交给列车长处理。现在我有一个问题：那条废弃的维护通道，你是怎么发现的？\"", "choice_presentation": "技术主管的目光像两把刀，直直刺向林晓。旁边的陈浩脸上带着若有所思的表情，似乎在等待他的回答。", "echo_applied": []}, "node_010": {"node_id": "node_010", "narrative_text": "入夜后，林晓再次钻进了那条废弃的维护通道。\n\n这一次他的目标不是引擎舱，而是向上——通往二等舱的仓储区。他花了两天时间研究通道的走向，确信有一条支线可以到达那里。\n\n通道里漆黑一片，手电筒的光芒是他唯一的依靠。林晓爬行在狭窄的金属管道中，尽量不发出声音。他的呼吸在寒冷的空气中凝结成白雾，双膝和手肘已经被磨得生疼。\n\n二十分钟后，他来到了一个分岔口。左边的通道明显更新一些，应该是后来加建的；右边则布满灰尘和蛛网，像是很久没人走过。林晓选择了右边——越是被遗忘的路，越不容易被发现。\n\n又爬了大约十五分钟，他感觉周围的空气变得不一样了。温度略有下降，而且有一股淡淡的金属锈蚀的味道。他应该已经进入了二等舱的区域。\n\n通道的尽头是一块可以活动的金属板。林晓小心翼翼地撬开一条缝隙，向外张望——\n\n那是一个巨大的仓库，货架从地面一直延伸到天花板，上面堆满了各种箱子和设备。有些箱子上贴着标签：\"精密仪器\"、\"医疗物资\"、\"备用零件\"。林晓的心跳加速，这正是他需要的地方。\n\n他正要钻出通道，突然听到了脚步声。\n\n有人来了。\n\n林晓立刻缩回通道，屏住呼吸。透过那条细小的缝隙，他看到一个人影走进了仓库。那人穿着白大褂，手里拿着一个手电筒，似乎在寻找什么。\n\n手电筒的光芒扫过货架，扫过地面，最后停在了林晓藏身的那块金属板附近。\n\n林晓的心脏几乎要跳出嗓子眼。那道光束离他只有不到一米的距离，只要稍微偏一点，就会照到他的脸上。\n\n\"奇怪，\"那人自言自语，\"刚才好像听到了动静......\"\n\n脚步声越来越近。", "choice_presentation": "脚步声在黑暗中回响，距离林晓藏身的位置越来越近。他必须立刻做出决定——", "echo_applied": []}, "node_011": {"node_id": "node_011", "narrative_text": "等待是最煎熬的事情。\n\n林晓每天像往常一样去维修组报到，干着那些琐碎的工作，但心里始终悬着一块石头。他知道老王在三等舱里秘密活动，知道愤怒的火焰正在每一个角落悄悄燃烧，但表面上一切如常。\n\n日子一天天过去。第五天，第八天，第十天。\n\n林晓每隔两天就会通过那条废弃的维护通道潜入引擎观测区，记录冷却系统的恶化速度。数据越来越触目惊心：主冷却泵效率已经跌破了50%，又有两个备用模块亮起了红灯，冷却液的泄漏率翻了一倍。\n\n按照这个速度，他最初估算的三十天可能还要缩短。\n\n第十五天的凌晨，林晓被一阵刺耳的警报声惊醒。\n\n整个三等舱都在震动。警报声响彻每一个角落，红色的应急灯疯狂闪烁，把所有人从睡梦中拉出来。孩子的哭声、大人的惊呼、金属碰撞的响动混成一片。\n\n\"怎么回事？\"老王的声音从混乱中传来。\n\n林晓冲到最近的舷窗边，但外面只有漫天的风雪，什么也看不清。他转身往引擎方向跑，却被人群堵在了走廊里。所有人都在向同一个方向涌去——闸门，通往二等舱的闸门。\n\n\"放我们出去！\"有人在喊，\"我们要知道发生了什么！\"\n\n但闸门紧闭，两侧站着全副武装的列车卫队。\n\n五分钟后，警报停了，广播系统传来列车长赵明远的声音：\n\n\"全体乘客请注意。刚才的警报是一次例行的系统测试，所有设备运转正常，不存在任何危险。请各车厢乘客保持秩序，返回各自的舱位休息。重复一遍，这是一次例行测试，没有任何危险。\"\n\n广播结束后，走廊里响起了嗡嗡的议论声。有人松了口气，有人半信半疑，但更多的人——尤其是那些知道内情的人——脸上写满了愤怒。\n\n林晓找到老王，两人挤到一个相对僻静的角落。\n\n\"例行测试？\"老王冷笑，\"这种鬼话他们自己信吗？十五天了，他们一直瞒着，现在瞒不住了就说是测试。\"\n\n\"不管怎样，警报响了，\"林晓低声说，\"这说明引擎的问题已经严重到触发自动警告了。我们的时间比想象的更少。\"\n\n老王的眼睛在暗淡的灯光下闪烁：\"你说得对。时间不多了，我们也不能再等了。\"\n\n他看向林晓，声音中带着一种危险的兴奋：\"小晓，我觉得这是个机会。恐慌已经开始蔓延，人心浮动。如果我们现在发动——\"", "choice_presentation": "老王的话像一把刀悬在林晓头顶。警报刚过，三等舱人心惶惶，这确实是发动革命的\"好时机\"——但引擎的问题还没解决，如果现在动手......", "echo_applied": []}, "node_012": {"node_id": "node_012", "narrative_text": "\"王叔，我有个想法。\"\n\n林晓拉住老王，把他带到更僻静的角落。三等舱的走廊里人来人往，警报虽然停了，但恐慌的情绪还没有散去。\n\n\"我们需要二等舱的支持，\"林晓压低声音，\"光靠三等舱的力量不够，而且就算成功了，没有技术人员，引擎的问题也解决不了。\"\n\n老王皱起眉头：\"二等舱？那些人？他们巴不得和上面的人站在一起，怎么会帮我们？\"\n\n\"不是所有人都那样，\"林晓说，\"我认识一个人......陈浩，二等舱的医生。他来三等舱出诊过几次，人不坏。而且......\"\n\n他想起几天前的那次会面，想起陈浩在技术主管办公室里那个意味深长的眼神。那个人似乎知道一些事情，而且不像是列车长那边的人。\n\n\"而且他可能知道一些我们不知道的事，\"林晓继续说，\"我想和他谈谈，试试能不能拉拢他。\"\n\n老王沉默了一会儿。他的眼睛眯了起来，那是他在思考的表情。\n\n\"好，\"他最终点头，\"去试试也好。但小心点，别把我们的底牌全亮出来。如果他不可信......\"\n\n\"我明白。\"\n\n第二天，林晓以\"复查\"为由再次来到二等舱。这一次没有通讯员带路，他拿着一张临时通行证，独自穿过那道闸门。\n\n二等舱比上次来时更加紧张。走廊里的人行色匆匆，交头接耳，显然昨晚的警报也影响到了这里。林晓打听到陈浩的位置，找到了医疗区。\n\n陈浩正在给一个年轻女人包扎手臂。看到林晓，他的眉毛扬了扬，但没有说话，只是示意他等一下。\n\n十分钟后，病人离开，陈浩关上了门。\n\n\"三等舱的小天才，\"他靠在桌边，双手抱胸，\"我猜你不是来看病的。\"\n\n\"陈医生，我想问你一些事。\"\n\n\"问吧。\"\n\n\"你知道引擎的真实情况吗？\"\n\n陈浩的表情微微一变，但很快恢复如常。他打量了林晓一会儿，然后低声说：\"你知道得还挺多。\"\n\n\"我是工程师，有些事瞒不了我。\"林晓直视他的眼睛，\"陈医生，我知道你不是列车长那边的人。如果你知道什么，告诉我。\"\n\n陈浩沉默了很长时间。办公室里只有空调运转的嗡嗡声，以及远处隐约传来的引擎轰鸣。\n\n\"好吧，\"他终于开口，\"你说得对，我确实知道一些事。关于引擎，关于列车长的计划，还有......关于一个人。\"\n\n\"什么人？\"\n\n\"叶婷。头等舱的科学家，引擎的设计者之一。\"陈浩的声音压得更低，\"她被列车长软禁起来了。因为她知道的太多，而且......她不同意列车长的做法。\"\n\n林晓的心跳加速：\"她知道引擎的秘密？\"\n\n\"她不仅知道，\"陈浩说，\"她还知道怎么修好它。\"", "choice_presentation": "陈浩的话让林晓看到了新的希望。头等舱有个科学家，知道如何修复引擎，还和列车长不对付。但接下来该怎么做？", "echo_applied": ["陈浩提到他注意到林晓走正规渠道的报告，因此愿意信任他"]}, "node_013": {"node_id": "node_013", "narrative_text": "从老王的储物舱出来后，林晓独自走在三等舱昏暗的走廊里，脑子里转个不停。\n\n两个目标，一个时间表。老王要他修引擎的同时找到进入头等舱的方法——前者是为了活命，后者是为了革命。这两件事并不矛盾，但优先级让林晓纠结。\n\n修复引擎需要什么？首先是技术资料，他对永恒号的动力系统了解有限，需要完整的设计图纸和维护手册。其次是零件，高纯度的散热材料和备用的冷却模块。最后是时间，这是他最缺的东西。\n\n而找到头等舱的弱点需要什么？人脉、情报、潜入的通道。这些他一样都没有。\n\n林晓在一个空置的储物间里坐下来，开始整理思绪。\n\n最合理的做法是把两件事合二为一：他需要进入头等舱或至少是二等舱，获取修复引擎所需的资源；在这个过程中，他可以顺便收集情报，了解上层的布局和漏洞。一石二鸟。\n\n但问题是，他没有进入上层的合法渠道。那条废弃的维护通道也许能让他偷偷摸到二等舱，但风险极大。一旦被发现，不仅修引擎的事泡汤，老王的革命计划也会暴露。\n\n另一个选择是优先侦查头等舱。如果他能找到上层的弱点，也许可以用这些信息作为筹码，换取修复引擎的权限和资源。这条路更复杂，但可能收益更大。\n\n林晓靠在冰冷的墙壁上，感受着列车的震动。引擎的轰鸣声似乎比昨天更沙哑了一些，那是冷却系统在濒死挣扎的声音。\n\n他没有太多时间来犹豫。", "choice_presentation": "时间有限，精力有限。林晓必须决定接下来的重心放在哪里——是优先解决技术问题，还是优先收集情报？", "echo_applied": []}, "node_014": {"node_id": "node_014", "narrative_text": "陈浩把林晓带到走廊尽头的一个僻静角落，声音压得很低。\n\n\"你不应该直接去见技术主管，\"他说，\"那个人是列车长的心腹，你的报告一提交到他那里，就等于是送到了列车长手上。\"\n\n林晓的心沉了下去：\"你是说......他们早就知道我发现了什么？\"\n\n\"不仅知道，而且已经在讨论怎么处理你。\"陈浩的表情严肃，\"我刚才在办公室听到一些话，他们在考虑把你列为'不稳定因素'。你知道这意味着什么吗？\"\n\n林晓当然知道。三等舱每隔一段时间就会有人失踪，官方的说法是\"因违规行为被转移至隔离区\"，但大家都心知肚明：那些人再也没有回来过。\n\n\"你为什么要告诉我这些？\"林晓看着陈浩，试图从他的脸上找到答案。\n\n陈浩沉默了一会儿。他回头看了看走廊，确认没有人靠近，然后说：\n\n\"因为我也不同意他们的做法。\"他的声音带着一种压抑的愤怒，\"引擎要完蛋了，他们知道，但他们选择隐瞒。不仅隐瞒，还在准备......后手。\"\n\n\"后手？\"\n\n\"你以为头等舱那些人是傻子吗？他们不会坐以待毙。\"陈浩说，\"我不知道具体计划是什么，但我知道，那个计划里没有三等舱的位置，甚至二等舱大部分人也会被抛弃。\"\n\n林晓的拳头攥紧了。愤怒像火焰一样从胸口窜起，但他强迫自己保持冷静。\n\n\"那叶婷呢？你刚才提到的那个科学家。\"\n\n\"叶婷是个例外。\"陈浩的语气软了一些，\"她是引擎的设计者之一，技术上可能是这列车上最懂那套系统的人。列车长需要她的知识，但不信任她的立场，所以把她软禁在实验室里。\"\n\n\"她能帮我们修好引擎？\"\n\n\"如果她愿意的话，\"陈浩说，\"问题是，她被看得很紧。想见她，不容易。\"\n\n林晓思考了一会儿：\"你能帮我安排一次会面吗？\"\n\n陈浩没有立刻回答。他的眼睛里有挣扎，有犹豫，但最终，他点了点头。\n\n\"我可以试试。但你要明白，这是冒险。一旦被发现，我们都完了。\"\n\n\"我明白。\"", "choice_presentation": null, "echo_applied": ["陈浩提到他注意到林晓走正规渠道的报告，因此愿意信任他"]}, "node_015": {"node_id": "node_015", "narrative_text": "林晓决定直接去见技术主管，不想在门口浪费时间。\n\n他推开门走进去，看到技术主管正坐在宽大的办公桌后面，翻看着一叠文件。这个五十多岁的男人抬起头，用一种难以捉摸的眼神打量着他。\n\n\"林晓？\"技术主管的声音不带任何感情，\"进来，坐下。\"\n\n林晓在桌前的椅子上坐下，后背僵直。他注意到陈浩不知什么时候已经离开了，办公室里只剩下他们两个人。\n\n技术主管拿起一份文件，正是林晓提交的那份故障报告。\n\n\"你的报告我看了，\"他说，\"关于冷却系统的异常。能说说你是怎么发现的吗？\"\n\n林晓斟酌着用词：\"例行检修时，我注意到一些管道的温度不正常。根据我的判断——\"\n\n\"你的判断，\"技术主管打断他，\"一个三等舱的维修工，有什么资格判断冷却系统的问题？\"\n\n空气突然变 踪\"了，老王派人寻找，却什么也找不到。革命的准备工作因为失去技术骨干而停滞不前。引擎继续恶化，直到再也没有人能够修复它。", "choice_presentation": null, "echo_applied": []}, "dead_009": {"node_id": "dead_009", "narrative_text": "\"撤退！带老王撤退！\"\n\n林晓喊着，试图组织溃散的革命军。但子弹不会因为喊声而停止飞行。\n\n列车长的卫队从三个方向包抄过来，武器精良，训练有素。三等舱的起义者们手里只有棍棒和改造的土制武器，在真正的火力面前不堪一击。\n\n老王受了伤，血从他的肩膀上流下来。林晓架着他往后退，身边的人一个接一个倒下。\n\n\"不要管我，\"老王的声音虚弱，\"你快走......引擎......还需要你......\"\n\n\"我不会丢下你！\"\n\n又一波子弹打过来。林晓感到后背一凉，然后是火烧般的疼痛。他和老王一起倒在了走廊里。\n\n最后的画面是卫队的靴子踏过血泊，走向他们。\n\n\"列车长有令，\"一个冰冷的声音说，\"不留活口。\"", "death_text": "三等舱的起义以惨败告终。老王和林晓死于同一天，革命的火种在血泊中熄灭。列车长宣布戒严令，剩余的三等舱居民被永久禁足。引擎在第三十一天停止运转，所有人都死在了那列不再移动的钢铁棺材里。", "choice_presentation": null, "echo_applied": []}, "dead_010": {"node_id": "dead_010", "narrative_text": "\"赵明远！我们可以谈谈！\"\n\n林晓举起双手，表示自己没有恶意。列车长站在走廊的另一端，身后是全副武装的卫队。叶婷被两个警卫架在中间，脸色苍白。\n\n\"谈什么？\"列车长的声音冷得像车窗外的冰原，\"你一个三等舱的维修工，有什么资格和我谈？\"\n\n\"引擎的事，\"林晓试图保持冷静，\"您知道它在衰竭，我知道怎么修。我们可以合作——\"\n\n\"合作？\"列车长笑了，那笑声在走廊里回荡，\"你真以为自己有谈判的资本？\"\n\n他做了个手势。\n\n林晓还没反应过来发生了什么，就感到胸口一阵剧痛。他低头，看到一把刀柄从自己的胸前突出来——卫队中有人从侧面偷袭了他。\n\n他跪倒在地，血从伤口汩汩流出。\n\n\"天真，\"列车长走到他面前，居高临下地看着他，\"你以为说几句话就能改变什么？在这列车上，权力才是唯一的语言。\"\n\n林晓想说什么，但嘴里已经充满了血腥味。他看到叶婷在挣扎，看到陈浩被押出来，看到一切他曾经希望的东西都在崩塌。\n\n然后，一切都暗了下去。", "death_text": "林晓死于他的\"天真\"。列车长随后清洗了所有\"不稳定因素\"，包括叶婷和陈浩。引擎的问题最终被一种极端的方式\"解决\"：列车长带着少数人乘逃生舱离开，剩下的人被遗弃在停止运转的列车里，等待死亡的降临。", "choice_presentation": null, "echo_applied": []}, "dead_011": {"node_id": "dead_011", "narrative_text": "林晓深吸一口气，启动了替代方案。\n\n他的手指在控制面板上飞舞，按照他计算出的顺序执行每一个步骤。绕过损坏的冷却模块，将冷却液导入备用回路，调整功率输出——每一步都走在刀尖上。\n\n前五分钟，一切顺利。\n\n第六分钟，警告灯开始闪烁。\n\n第七分钟，引擎发出一声不祥的轰鸣，整列火车都在颤抖。\n\n林晓的额头上滚下冷汗。数据不对，他计算出错了什么地方。也许是材料的耐热性被高估了，也许是备用回路的承载能力不够——现在已经不重要了。\n\n引擎过载。\n\n他转身想跑，但已经来不及了。\n\n冷却液管道爆裂的声音像雷鸣一样响起，紧接着是更多的爆裂，更多的蒸汽，更多的火焰。林晓被气浪掀翻在地，滚烫的蒸汽从四面八方涌来。\n\n他来得及发出一声惨叫，然后......\n\n什么都没有了。", "death_text": "引擎室的爆炸没有摧毁整列火车，但造成了无法修复的损伤。动力系统彻底瘫痪，永恒号缓缓减速，最终停在了西伯利亚的某处。没有了热源，寒冷在二十四小时内夺走了所有人的生命。林晓的尸体和其他三千人一起，变成了永恒的冰雕。", "choice_presentation": null, "echo_applied": []}, "dead_012": {"node_id": "dead_012", "narrative_text": "\"好，你可以走。\"\n\n林晓让开了通道，列车长带着他的卫队消失在逃生舱的方向。作为交换，他得到了那枚启动密钥。\n\n他攥着密钥，向引擎室跑去。只要能启动修复程序，就还有希望——\n\n他没有跑多远。\n\n当他回到三等舱时，迎接他的是一片怒火。\n\n\"叛徒！\"有人喊，\"他放走了列车长！\"\n\n\"不，你们听我解释——\"\n\n但没有人愿意听。愤怒的人群涌上来，把他团团围住。他看到了熟悉的面孔：和他一起工作过的维修工，和他一起排队领取配给的邻居，甚至还有老王的几个亲信。\n\n他们的眼中只有仇恨。\n\n\"你把那个混蛋放走了！他抛弃了我们！\"\n\n\"我有密钥，我可以修好引擎——\"\n\n\"骗子！\"\n\n第一拳砸在他的脸上。然后是更多的拳头，更多的脚，更多的棍棒。\n\n林晓倒在人群中央，任由暴力如潮水般涌来。他的手里还攥着那枚密钥，但已经没有力气再站起来了。\n\n\"我能救你们的......\"他喃喃道，但没有人在听。\n\n当暴力终于停止时，林晓已经没有了呼吸。密钥从他的手中滑落，滚进了人群的脚下，被踩进了污浊的血水中。", "death_text": "林晓死于同伴的愤怒。那枚密钥被当作\"列车长的陷阱\"扔掉了。三等舱陷入了无政府状态，人们互相残杀，争夺越来越少的资源。引擎在第三十天停止了。没有人来得及逃出去。", "choice_presentation": null, "echo_applied": []}, "dead_013": {"node_id": "dead_013", "narrative_text": "\"赵明远，你听我说——\"\n\n林晓开始了他精心准备的说辞。关于引擎，关于合作，关于彼此都能活命的可能性。他说得很诚恳，很有条理，他相信理性最终会战胜一切。\n\n列车长一直在听，脸上带着一种意味深长的微笑。\n\n当林晓说完最后一句话时，列车长点了点头：\"你说得很好，确实很有道理。\"\n\n林晓松了口气：\"那么——\"\n\n\"但你忘了一件事。\"\n\n列车长的手从桌下拿出来，手里多了一把枪。\n\n\"我不需要说服。我需要的是消除隐患。\"\n\n林晓的笑容僵在脸上。他转身想跑，但身后的门已经被锁死。他听到卫队的脚步声从各个方向逼近，听到自己的心跳声越来越快，越来越响——\n\n然后，一切都安静了。\n\n枪声在密闭的房间里格外清脆。", "death_text": "林晓相信对话和理性，但列车长只相信权力和暴力。他的尸体和他的理想一起，被抛进了无人知晓的角落。永恒号继续前进，直到燃料耗尽的那一天。没有人再提起那个试图讲道理的三等舱工程师。", "choice_presentation": null, "echo_applied": []}, "ending_001": {"node_id": "ending_001", "narrative_text": "\"让他走。\"\n\n林晓的声音在餐厅里回响。革命军面面相觑，不敢相信自己的耳朵。\n\n\"你疯了？\"一个年轻人喊道，\"他杀了我们那么多人——\"\n\n\"让他走！\"林晓提高了音量，\"叶婷还在他手里，如果我们强攻，她会死。而没有她，我们修不好引擎。\"\n\n列车长的嘴角浮现出一丝笑意。他一步步后退，拖着叶婷走向逃生舱的方向。革命军让出一条通道，眼睁睁看着这个他们恨了七年的人从他们面前离开。\n\n在登上逃生舱之前，列车长停下了脚步，回头看向林晓：\"你做了正确的选择。代价......以后你会知道的。\"\n\n他松开了叶婷，然后消失在舱门后面。\n\n逃生舱分离时，整列火车都感受到了那阵震动。透过舷窗，林晓看到那个银白色的容器越飞越远，最终消失在风雪中。\n\n叶婷站在他身边，浑身发抖，但眼神依然坚定：\"我们没有时间了。引擎......快带我去引擎室。\"\n\n接下来的四十八小时是林晓人生中最漫长的两天。他和叶婷并肩工作，几乎没有合眼。冷却系统被逐步修复，备用模块重新上线，那些刺眼的红色警告灯一个接一个熄灭。\n\n第四十九小时，引擎发出了久违的稳定轰鸣。\n\n永恒号活了下来。\n\n但当林晓走出引擎室，迎接他的不是欢呼，而是一片沉默。三等舱的人们看着他，眼神复杂。有人在低声议论：\"他放走了列车长......\"\n\n老王走上前来，脸上的表情疲惫而苦涩：\"小晓，你做了正确的选择，我知道。但是......有些人不会理解。\"\n\n\"我知道。\"\n\n林晓看向窗外，那片永恒的白色冰原在风雪中翻涌。列车长去哪了？他能在外面活下来吗？那个逃生舱里还有多少物资？这些问题也许永远不会有答案。\n\n他救下了叶婷，修好了引擎，让三千人活了下来。但代价是什么？是正义无法伸张的遗憾，是那些死去的人无法瞑目的眼睛，是三等舱人们眼中永远不会消失的阴影。\n\n一周后，新的管理委员会成立了。林晓被推举为技术负责人，叶婷负责科研，老王代表三等舱进入委员会。列车的阶层依然存在，但隔阂正在一点点弥合。\n\n这不是最好的结局。但至少，大家都还活着。\n\n窗外，永恒号轰鸣着穿过冰原，驶向未知的前方。", "ending_type": "neutral_ending", "choice_presentation": null, "echo_applied": []}, "ending_002": {"node_id": "ending_002", "narrative_text": "\"强攻！\"\n\n林晓的命令从牙缝里挤出来。他知道这意味着什么，但他已经没有选择了——列车长不会放过任何人，这个恶魔必须死在这里。\n\n革命军冲向餐厅。枪声、尖叫、玻璃碎裂的声音混成一片。列车长的卫队进行了最后的抵抗，但在人数上的绝对劣势面前，他们很快被淹没。\n\n混乱中，林晓看到列车长拖着叶婷向后退去。他举起从卫兵手里夺来的枪，瞄准——\n\n但子弹不长眼睛。\n\n当硝烟散去，列车长的尸体倒在血泊中，脸上还残留着最后一丝错愕。而在他身边，叶婷也倒下了，胸口有一个血洞。\n\n\"不......不不不......\"\n\n林晓冲过去，把叶婷抱在怀里。她还有呼吸，但非常微弱。\n\n\"引擎......\"叶婷的声音像风中的蜡烛，\"修复程序......在我的......实验室......密码是......\"\n\n她说出了一串数字，然后永远闭上了眼睛。\n\n林晓跪在血泊中，周围是革命者的欢呼声，但他什么都听不见。他只能看到叶婷苍白的脸，和她嘴角那抹来不及说出的话。\n\n接下来的一周是地狱般的日子。林晓带着叶婷留下的密码，在实验室里翻出了完整的修复程序。没有叶婷的指导，他只能靠自己摸索。无数次失败，无数次重来，他的眼睛布满血丝，双手因为过度操作而颤抖。\n\n最终，引擎被修好了。\n\n革命胜利了。列车长的政权被推翻，三等舱的人们第一次能够自由地走进那些曾经禁止他们踏入的区域。新的秩序在废墟上建立，老王成为了新的领导者，林晓被尊为英雄。\n\n但每当有人提起那场最后的战斗，林晓就会沉默。\n\n他经常梦到叶婷，梦到她倒下的那一刻，梦到她最后那句没有说完的话。在梦里，他问她：如果重来一次，你还会帮我们吗？\n\n她从不回答。\n\n革命的代价，不只是那些死去的人。还有活着的人心中，永远无法愈合的伤口。\n\n永恒号继续前进，但林晓知道，有些东西已经永远失去了。", "ending_type": "bad_ending", "choice_presentation": null, "echo_applied": []}, "ending_003": {"node_id": "ending_003", "narrative_text": "趁列车长还在说话，林晓动了。\n\n他从藏在袖子里的位置抽出那把偷来的刀，向列车长扑去。这是一场赌博——如果失败，叶婷会死，他也会死，革命会失败，一切都会完。\n\n但他赌对了。\n\n列车长显然没有料到林晓会在这种时候动手。他的枪响了，但子弹只是擦过林晓的肩膀。下一秒，林晓的刀已经插进了他的肋下。\n\n两个人一起倒在了地上。\n\n接下来的几秒钟像是被拉长了。林晓感到肩膀上火烧般的疼痛，感到列车长在他身下挣扎，感到周围的人冲上来——然后，是叶婷的声音：\n\n\"林晓！林晓你没事吧！\"\n\n他被人扶起来。肩膀的伤口很深，但不致命。列车长就没那么幸运了——刀插进了要害，他躺在血泊中，眼睛逐渐失去了光彩。\n\n\"你......\"列车长最后看了林晓一眼，嘴角抽搐着，像是想说什么，又像是在笑，\"你以为......这样就能......\"\n\n他没有说完。\n\n革命胜利了，但林晓没有感到任何喜悦。他杀了一个人，亲手，用刀。这和在屏幕上看到的死亡数字不一样，和听说的战场故事不一样。那种温热的、粘稠的液体沾满他的双手的感觉，他这辈子都忘不了。\n\n接下来的日子里，林晓投入了引擎的修复工作。有叶婷的帮助，进展比预想的快得多。十二天后，冷却系统恢复正常，引擎发出了稳定的轰鸣。\n\n永恒号活了下来。\n\n新的管理委员会成立了。老王成为领导者，林晓负责技术，叶婷重建了她的实验室。三等舱、二等舱、头等舱的隔阂正在一点点消融——不是因为强制，而是因为所有人都意识到，在这列火车上，他们是一个命运共同体。\n\n一个月后，林晓站在引擎室的观察窗前，看着那颗巨大的钢铁心脏稳定地跳动。叶婷走到他身边，把头靠在他的肩上。\n\n\"你还在想那件事？\"她轻声问。\n\n林晓沉默了一会儿：\"我杀了一个人。\"\n\n\"你救了三千人。\"\n\n\"这能抵消吗？\"\n\n叶婷没有回答。也许这个问题永远不会有答案。\n\n窗外，冰原依然寒冷，但林晓知道，只要引擎还在跳动，希望就不会熄灭。\n\n这不是一个完美的结局。但这是他选择的结局。他会带着那个扣动扳机的记忆活下去，直到有一天，他能够原谅自己。", "ending_type": "good_ending", "choice_presentation": null, "echo_applied": []}, "ending_005": {"node_id": "ending_005", "narrative_text": "\"不。\"\n\n林晓直视列车长的眼睛，声音坚定：\"我不接受你的逻辑。\"\n\n列车长的脸上闪过一丝惊讶，随即变成了冷笑：\"你太天真了。资源是有限的，这是事实。不是所有人都能活下去——\"\n\n\"那是因为分配不公，\"林晓打断他，\"你们头等舱囤积了多少物资？那些本该属于所有人的东西。如果重新分配，如果优化消耗，如果——\"\n\n\"如果，如果，\"列车长摇头，\"你们这些底层的人，永远只会说如果。但现实是——\"\n\n\"现实是你害怕失去权力，\"林晓的声音提高了，\"你不是在保存什么人类文明的火种，你只是在保护你自己和你的同伙。如果你真的关心人类的未来，你会和我们一起想办法，而不是偷偷造逃生舱准备抛弃我们！\"\n\n走廊里陷入了死寂。\n\n林晓知道他在冒险。列车长的卫队还在，他随时可以下令开枪。但他也知道，这番话被广播系统传遍了整列火车——他让叶婷在战斗开始时打开了全车广播。所有人都在听，所有人都知道真相了。\n\n列车长的脸色变了又变。他环顾四周，看到革命军的枪口，看到自己卫队中犹豫的眼神，看到身后逃生舱的入口——那个他本以为能带他逃离这一切的出口。\n\n\"你以为你赢了？\"他最后说，声音沙哑，\"就算你修好引擎，就算你建立什么新秩序......人性不会变。不出十年，新的你就会出现，新的阶层就会形成，然后——\"\n\n\"也许吧，\"林晓说，\"但至少我们可以试着做得不同。这就是我们和你的区别。\"\n\n列车长没有再说话。他被押走了，在所有人的注视下，被带进了一间囚室。\n\n接下来的日子里，林晓兑现了他的承诺。\n\n引擎被修好了，这是第一步。然后是物资的重新分配——头等舱的囤积被清点、分发，所有人第一次吃上了同样的饭菜。再然后是制度的重建——新的管理委员会由各车厢的代表组成，每一个重大决定都需要投票表决。\n\n不是所有人都满意，不是所有问题都解决了。但至少，不再有人因为出生在错误的车厢而被判定为低人一等。\n\n三个月后，林晓站在曾经属于列车长的观景台上，看着窗外的冰原。叶婷站在他身边，手里拿着一份文件。\n\n\"传感器检测到了一些东西，\"她说，声音里带着难以置信的颤抖，\"在东南方向，大约两百公里外......是热源。一个很大的热源。\"\n\n林晓转过头：\"地热？\"\n\n\"可能是。如果那里真的存在地热活动......理论上，外界温度会比其他地方高很多。也许——\"\n\n\"也许我们可以停下来。\"\n\n叶婷点头，眼中闪着泪光：\"也许......我们终于可以回家了。\"\n\n林晓看向远方，那片永恒的白色冰原。第一次，他觉得它不再那么可怕了。\n\n这不是结束。这只是一个新的开始。", "ending_type": "true_ending", "choice_presentation": null, "echo_applied": ["结局中林晓的演讲引用他拒绝列车长时说的话，成为新时代的座右铭"]}, "ending_009": {"node_id": "ending_009", "narrative_text": "最后一个指示灯变绿的那一刻，林晓几乎不敢相信自己的眼睛。\n\n引擎室里，那些曾经疯狂闪烁的红色警告灯全部熄灭了。取而代之的是一排稳定的绿光，像是一行无声的宣告：我们成功了。\n\n叶婷瘫坐在控制台旁，脸上满是疲惫和汗水，但嘴角挂着一丝微笑：\"完成了......终于完成了。\"\n\n林晓看着她，然后看着那颗重新稳定跳动的钢铁心脏。他们做到了。不是用暴力，不是用牺牲，而是用知识和技术。\n\n叶婷成功绕过了生物认证系统，打开了列车长的保险箱，取出了那个关键的零件。林晓按照她的指导完成了最后的安装。整个过程没有任何战斗，没有任何流血。\n\n当引擎重新轰鸣起来的时候，整列火车都感受到了。\n\n他们从引擎室出来，迎接他们的是一片欢呼。不知道是谁第一个开始鼓掌，然后是更多的人，更响亮的掌声，最后变成了震耳欲聋的欢呼。\n\n\"是他们！是他们修好了引擎！\"\n\n\"我们有救了！列车不会停了！\"\n\n林晓被人群包围，无数双手拍打着他的肩膀。他看到了老王，看到了陈浩，看到了三等舱那些他熟悉的面孔。他们的眼中不再只有愤怒和绝望，还有希望，还有感激。\n\n\"小晓，\"老王挤到他面前，声音沙哑，\"你做到了。你真的做到了。\"\n\n\"不是我一个人，\"林晓说，把叶婷拉到身边，\"没有她，这一切都不可能。\"\n\n老王看了叶婷一眼，眼中闪过复杂的情绪。这个头等舱的科学家，曾经是他们眼中\"敌人\"的一员。但现在......\n\n\"谢谢你，\"老王最终说，向叶婷伸出了手，\"不管之前怎样......谢谢你救了我们所有人。\"\n\n叶婷握住他的手，眼眶有些湿润：\"我只是做了我应该做的事。\"\n\n接下来的日子里，一切都在改变。\n\n列车长被软禁了，但没有被处决——林晓坚持认为，在新的秩序建立之前，审判应该等一等。新的管理委员会成立了，由各车厢的代表组成。隔阂依然存在，但正在一点点消融。\n\n一个月后，林晓站在引擎室的观察窗前，叶婷走到他身边。\n\n\"你在想什么？\"她问。\n\n\"在想，\"林晓说，\"这一切是怎么开始的。我本来只是想修好一台机器。\"\n\n\"但你做的远不止这些。\"\n\n林晓转头看着她：\"是我们。我们做的远不止这些。\"\n\n叶婷笑了，那是林晓第一次看到她真正放松的笑容：\"这是我做过最干净的事。没有妥协，没有牺牲，只是......解决问题。\"\n\n\"这正是工程师的方式。\"\n\n他们相视而笑。窗外，永恒号轰鸣着穿过冰原，驶向未知的明天。\n\n这是一个技术的胜利，也是人性的胜利。", "ending_type": "true_ending", "choice_presentation": null, "echo_applied": ["结局中叶婷感谢林晓当时的信任，正是这种信任让他们成功合作"]}, "ending_013": {"node_id": "ending_013", "narrative_text": "三方联盟的计划，执行得比预想中更顺利。\n\n老王负责控制三等舱的秩序，确保不发生失控的暴动。陈浩带着二等舱的医疗团队待命，准备应对任何突发状况。林晓和叶婷则专注于引擎的修复工作。\n\n与此同时，叶婷准备的那份证据——列车长的阴谋、逃生舱的存在、对三等舱的歧视政策——通过广播系统传遍了整列火车。\n\n真相的力量比子弹更强大。\n\n当所有人都知道列车长打算抛弃他们时，愤怒席卷了每一个车厢。不只是三等舱，二等舱的很多人也加入了抗议的行列。甚至头等舱内部也出现了分裂——并不是所有人都同意列车长的做法。\n\n列车长的卫队开始动摇。当三等舱的人们涌向闸门时，很多士兵选择了放下武器。\n\n\"够了，\"一个年轻的卫兵说，把枪扔在地上，\"我不想再为那个混蛋卖命了。\"\n\n列车长被包围在他的私人车厢里，孤立无援。当林晓和老王推开那扇门时，他正站在窗边，背对着他们。\n\n\"你们赢了，\"他的声音出奇地平静，\"这一局，你们赢了。\"\n\n\"这不是游戏，\"老王说，\"三千条人命不是筹码。\"\n\n\"是吗？\"列车长转过身来，脸上带着一种奇怪的笑容，\"你们以为推翻我就能解决所有问题？资源还是那么多，冰原还是那么冷。不出一年，你们就会发现——\"\n\n\"够了，\"林晓打断他，\"你说得对，问题很多。但我们会一起解决，而不是像你一样，只想着抛弃大多数人保全少数人。\"\n\n列车长的审判在三天后举行。全车公开投票，几乎是压倒性的结果：终身监禁，关押在列车最底层的隔离舱。\n\n\"不处决他？\"老王有些意外。\n\n\"如果我们从处决开始，\"林晓说，\"那和他又有什么区别？新的秩序，应该从公正开始。\"\n\n引擎在一周后修复完毕。那天，整列火车都在庆祝——不是庆祝革命的胜利，而是庆祝所有人都活了下来。\n\n新的管理委员会由三方代表组成：老王代表三等舱，叶婷代表技术部门，一个叫做周明的二等舱教师代表中间阶层。林晓婉拒了加入委员会的邀请——他说自己更擅长修机器，不擅长管理人。\n\n但每个人都知道，如果没有他，这一切都不可能发生。\n\n一年后，永恒号的运行进入了稳定期。阶层依然存在，但隔阂正在消融。配给制度被重新设计，确保每个人都能得到基本的保障。教育系统开始向所有车厢开放，三等舱的孩子们第一次有机会学习工程和科学。\n\n林晓站在引擎室的观察窗前，看着那颗稳定跳动的钢铁心脏。叶婷走到他身边，把一份文件递给他。\n\n\"传感器的数据，\"她说，\"东南方向，大约三百公里。热源信号。\"\n\n林晓接过文件，仔细看了一遍：\"你认为——\"\n\n\"我认为我们应该去看看。如果那里真的存在地热活动......也许我们终于可以不用永远跑下去了。\"\n\n林晓想起了很久以前，他在三等舱那个拥挤的铺位上醒来，第一次感觉到引擎的异常震动。那时候，他只是一个想要修好机器的维修工。\n\n现在，他依然是那个人。只是机器变大了，问题变复杂了，而他......也成长了。\n\n\"好，\"他说，把文件折好，\"我们去看看。\"\n\n窗外，永恒号轰鸣着转向，驶向那个未知的热源。\n\n这是最好的结局——不是因为没有牺牲，而是因为牺牲有了意义。", "ending_type": "true_ending", "choice_presentation": null, "echo_applied": ["结局中提到林晓始终坚守保护平民的承诺，这是新秩序的基石"]}, "ending_017": {"node_id": "ending_017", "narrative_text": "真相的力量，超出了所有人的预料。\n\n当林晓通过全车广播系统公开了一切——引擎的危机、列车长的阴谋、头等舱的囤积和逃生计划——整列火车都沸腾了。但这次不是暴动，而是一种更加强大的力量：觉醒。\n\n三等舱的人们走出舱位，但不是拿着武器。他们高举着从广播中听到的那些数据、那些证据，要求一个解释。\n\n二等舱的技术人员放下了手中的工作，加入了人群。他们中很多人早就怀疑有问题，但从未有人站出来揭露真相。\n\n甚至头等舱内部也出现了分裂。那些不知道逃生舱计划的人——他们占大多数——愤怒地意识到，自己也只是被抛弃者的一员。\n\n列车长的卫队一个接一个放下武器。没有人愿意为一个欺骗了所有人的人卖命。\n\n当人群涌向列车长的私人车厢时，他们发现那扇门已经敞开了。\n\n列车长赵明远站在车厢中央，脸色苍白如纸。他的卫兵已经全部离开，他独自一人面对三千人的愤怒。\n\n\"你们......想怎么做？\"他的声音已经失去了往日的威严。\n\n老王走上前来，身后是林晓、叶婷和陈浩。他们代表了这列火车上的每一个阶层，每一种身份。\n\n\"我们想要公正，\"老王说，\"不是报复，是公正。\"\n\n列车长看了他们一眼，然后环顾四周——那些曾经仰望他的眼睛，那些曾经服从他的人，现在都带着同样的表情：失望，愤怒，还有......解脱。\n\n\"我......\"他张了张嘴，似乎想辩解什么，但最终只是摇了摇头。\n\n没有人知道他最后在想什么。也许是悔恨，也许是不甘，也许只是对权力崩塌的恐惧。\n\n第二天清晨，列车长的尸体在他的车厢里被发现。官方公告说是心脏病发作，但所有人都心知肚明。\n\n没有人为他流泪。\n\n接下来的日子里，永恒号经历了一场和平的变革。\n\n新的管理系统建立起来，不再是一个人说了算，而是由全车投票选出的代表委员会。每一个重大决定都需要公开讨论、公开表决。\n\n配给制度被重新设计，确保每个人——不管来自哪个车厢——都能得到公平的对待。囤积物资被清点分配，空余的头等舱房间向所有人开放。\n\n林晓和叶婷带领技术团队完成了引擎的修复。这一次，没有秘密，没有隐瞒——每一步进展都被公开广播，每一个人都知道自己的命运正在被改变。\n\n三个月后，永恒号的传感器探测到了一个重大信号：东南方向，一片地热活跃区域。那里的外部温度比其他地方高出至少二十度，足以让人在短时间内活动。\n\n全车投票，决定驶向那个方向。\n\n六个月后，永恒号抵达了那片土地。\n\n当车门打开的那一刻，林晓站在门口，看着外面的世界。不再是无尽的白色冰原，而是一片被地热蒸汽包围的灰色岩地。温度依然很低，但已经不再致命。远处，有绿色的东西正在生长——也许是苔藓，也许是某种耐寒的植物。\n\n身后，三千人排成长队，等待着踏出这一步。\n\n叶婷走到林晓身边，握住了他的手：\"准备好了吗？\"\n\n林晓深吸一口气，迈出了车门。\n\n七年来第一次，他的脚踏上了列车以外的土地。空气很冷，但不是那种刺骨的冷。风很大，但带着一股陌生的、几乎被遗忘的气息——那是大地的味道，是生命的味道。\n\n他回头，看向那列承载了他们七年岁月的钢铁巨兽。永恒号静静地停在那里，引擎还在轰鸣，但它不再是一个移动的监狱，而是一个临时的家——一个他们终于可以离开的家。\n\n\"我们到了，\"他轻声说，声音被风吹散，\"我们真的到了。\"\n\n身后，三千人开始欢呼。那欢呼声穿透了风雪，回荡在这片古老的土地上——\n\n这是人类文明在末日之后，第一次真正的重生。", "ending_type": "true_ending", "choice_presentation": null, "echo_applied": []}, "ending_018": {"node_id": "ending_018", "narrative_text": "修复引擎的最后阶段，叶婷发现了一些不寻常的数据。\n\n\"这是什么？\"她盯着控制台上的读数，眉头紧皱，\"传感器在十七天前记录到了一个异常信号，然后被人为删除了。\"\n\n林晓凑过去看：\"什么信号？\"\n\n叶婷的手指在键盘上飞舞，调出了被删除的原始数据：\"热源。一个巨大的热源，在东南方向大约四百公里处。信号强度......\"她的声音突然停住了，\"不可能。这不可能。\"\n\n\"什么不可能？\"\n\n\"这个温度，\"叶婷的声音开始颤抖，\"如果数据没错的话......那里的外部温度在零度以上。\"\n\n林晓愣住了。零度以上？在这个核冬天已经持续了七年的世界，在气温常年维持在零下七十度的冰原上——零度以上意味着什么？\n\n意味着可以停下来。\n\n意味着可以出去。\n\n意味着这列永远不能停止的火车，终于有了一个终点。\n\n\"列车长知道这个，\"叶婷的声音冰冷，\"他十七天前就知道了，但他删除了数据。他......不想让任何人知道。\"\n\n\"为什么？\"\n\n\"因为停下来就意味着他失去权力，\"叶婷说，\"在一列永远奔跑的火车上，他是独裁者。但如果火车停了，他就什么都不是了。\"\n\n林晓站起身，深吸一口气：\"我们需要把这件事告诉所有人。\"\n\n消息传开后，整列火车陷入了一种奇怪的沉默。不是绝望，而是难以置信。七年来，他们被告知外面只有死亡，他们被告知永远不能停下，他们被告知这列火车就是他们唯一的世界——\n\n现在，有人告诉他们，终点就在前方。\n\n列车长的最后一点支持也崩溃了。当人们知道他隐瞒了生存的希望时，愤怒彻底压倒了恐惧。他被押出私人车厢，在所有人的注视下接受审判。\n\n\"你为什么？\"老王问，声音沙哑，\"你明知道那里可以活人，为什么不告诉我们？\"\n\n列车长没有回答。也许他没有答案，也许他的答案不值得说出口。\n\n审判只用了一小时。全车投票，结果是终身流放——把他放在那片温暖的土地上，让他独自面对他曾经想要独占的新世界。\n\n三周后，永恒号抵达了目的地。\n\n那是一片被地热蒸汽笼罩的盆地，周围是冰封的山脉，但盆地内部温暖如春。有温泉，有融化的水流，甚至有一些顽强的植被在岩石缝隙中生长。\n\n当车门打开的那一刻，温暖的空气涌了进来。\n\n林晓站在门口，看着这片他做梦都没想过会见到的风景。身后，三千人屏住呼吸，等待着。\n\n\"我们到了，\"他轻声说，然后迈出了第一步。\n\n脚踏在柔软的土地上的感觉是如此陌生，又如此真实。他弯下腰，抓起一把泥土，让它从指缝间滑落。\n\n泥土。真正的泥土。不是金属，不是钢铁，是能够孕育生命的土地。\n\n身后响起了哭泣声，欢呼声，祈祷声。三千人涌出列车，踏上这片他们曾经以为永远不会再见到的土地。\n\n叶婷走到林晓身边，握住他的手。她的眼中满是泪水，但嘴角是微笑：\"我们做到了。\"\n\n\"是的，\"林晓说，看向远方那些正在升起的蒸汽，那些正在融化的冰雪，那些正在重新开始的生命，\"我们终于到家了。\"\n\n永恒号静静地停在那里，引擎发出最后一声轰鸣，然后缓缓安静下来。它跑了两千八百多天，跨越了半个地球，终于可以休息了。\n\n而人类的故事，将在这片新的土地上继续。", "ending_type": "hidden_ending", "choice_presentation": null, "echo_applied": []}, "node_021": {"node_id": "node_021", "narrative_text": "林晓在头等舱的档案室里找到了更多秘密。\n\n那些被锁在保险柜里的文件揭示了一个令人发指的真相：头等舱不仅囤积了大量的生存物资，还在秘密削减三等舱的配给。每周少一点，每月减一些——不够引起注意，但足以让三等舱的人越来越虚弱，越来越绝望。\n\n林晓把文件藏进工作服里，悄悄离开档案室。这些证据太重要了，必须让更多人知道。", "choice_presentation": "手里攥着那些致命的文件，林晓必须决定下一步该怎么做——", "echo_applied": []}, "node_022": {"node_id": "node_022", "narrative_text": "陈浩的话让林晓意识到，局势比他想象的更加紧迫。\n\n叶婷被软禁，引擎在恶化，列车长在密谋——三条线索交织在一起，每一条都指向同一个结论：时间不多了。\n\n\"你能帮我安排一次和叶婷的会面吗？\"林晓问。\n\n陈浩犹豫了一下：\"不是不能，但很危险。叶婷的实验室被严密监控，进出都需要特殊权限。我可以试着在两天后的例行体检时把你带进去。\"\n\n\"两天……\"林晓默默计算着时间。引擎的衰退不会停止，两天可能意味着更多的系统失效。但比起盲目行动，这已经是最快 计划\"——筛选五十个\"最有价值\"的幸存者。他利用自己在三等舱的信任，帮助卫队悄无声息地转移那些被选中的人。\n\n老王死于一场\"意外\"。当他发现林晓背叛时已经太晚了。林晓亲手把他推进了隔离舱，听着里面逐渐消失的敲击声。\n\n\"为了更大的善，\"他告诉自己，\"必须有人做出牺牲。\"\n\n逃生舱在第二十八天发射。五十人挤在狭小的空间里，看着永恒号消失在风雪中。\n\n他们找到了一个地热区，建立了新基地。林晓成为技术负责人，受人尊敬。但每一个夜晚，他都从噩梦中惊醒。\n\n梦里有老王的脸，有那些被遗弃的三等舱居民。他背叛了所有信任他的人，而他……他活着。\n\n十年后，在纪念活动上，林晓站在人群中，听着列车长的演讲，心里空荡荡的。\n\n他活下来了，但他的灵魂，早就死在了那列永远不会到达的火车上。", "ending_type": "bad_ending", "choice_presentation": null, "echo_applied": []}, "ending_007": {"node_id": "ending_007", "narrative_text": "引擎修复的那一刻，列车长已经消失在风雪中。\n\n林晓站在引擎室里，听着稳定的轰鸣声，心里却没有太多喜悦。叶婷站在他身边，脸上的表情同样复杂。\n\n\"他走了，\"她说，\"带着他的亲信和物资。\"\n\n\"他们能活下来吗？\"\n\n\"谁知道。也许能找到地热区，也许会冻死在半路上。但那已经不是我们的问题了。\"\n\n接下来的日子里，新的秩序在废墟上建立。没有了列车长的独裁，三等舱、二等舱和头等舱的代表第一次坐在同一张桌子旁。\n\n\"我们需要一个新的领导体制，\"老王说，\"不能再是一个人说了算。\"\n\n\"委员会制，\"叶婷建议，\"每个车厢选出代表，重大决定需要多数同意。\"\n\n经过长时间讨论，共识达成了。新的管理委员会成立，林晓被推举为技术负责人，叶婷负责科研，老王代表三等舱进入核心决策层。\n\n六个月后，传感器探测到一个微弱的信号——也许是地热活动的迹象。委员会投票决定驶向那里。\n\n林晓站在驾驶舱的窗前，看着前方无尽的白色。列车长去了哪里？这个问题也许永远不会有答案。\n\n但有一件事是确定的：永恒号还在前进，三千人还活着，而未来……还有无限的可能。", "ending_type": "neutral_ending", "choice_presentation": null, "echo_applied": []}, "ending_011": {"node_id": "ending_011", "narrative_text": "\"不。\"\n\n林晓拒绝了列车长的条件。\"你以为我会帮你镇压我自己人？\"\n\n谈判破裂后，双方陷入对峙。三等舱人群聚集在闸门前，列车长卫队严阵以待。\n\n第五天，有人开了第一枪。没人知道谁先动手，但子弹飞出去就收不回来了。\n\n战斗持续三天。走廊里充满血腥味，尸体堆积如山。老王死在冲锋路上，林晓亲眼看到他倒下，却来不及去救。\n\n最终，三等舱攻占了整列火车。列车长被愤怒的人群撕成碎片。但胜利是苦涩的——将近三百人死于战斗。\n\n而且，在混乱中没人顾得上引擎。当林晓终于回到引擎室时，情况已无法挽回。\n\n\"来不及了，\"他看着闪烁的红灯，声音空洞，\"就算现在开始修，也来不及了。\"\n\n第三十天，永恒号的引擎彻底沉默。列车停在西伯利亚某处。\n\n幸存者们在寒冷中挤作一团。林晓带领技术人员建立临时避难所。\n\n\"我们是自由的，\"他对疲惫的面孔说，\"这是我们选择的自由。现在，我们要为它活下去。\"\n\n这是一个艰难的开始。但至少，他们不再是笼中的鸟。", "ending_type": "bad_ending", "choice_presentation": null, "echo_applied": []}, "ending_016": {"node_id": "ending_016", "narrative_text": "林晓扑向列车长的那一刻，走廊里响起三等舱人民的怒吼。\n\n\"冲啊！！！\"\n\n这是一场彻底的革命。革命军从各方向涌出，势不可挡。列车长的卫队在人海战术面前节节败退。\n\n林晓和列车长扭打在一起。他感到拳头砸在身上的疼痛，但也看到列车长眼中的恐惧——对失去一切的恐惧。\n\n卫队崩溃了。有人投降，有人逃跑。七年的压迫化作今天的怒火。\n\n战斗在三小时后结束。列车长被押到公共区域，面对他曾踩在脚下的人们。\n\n\"审判他！\"有人喊。\n\n老王举起手示意安静：\"公开审判，公平判决。我们不是野兽。\"\n\n审判只用了一天。全车投票，结果压倒性：死刑。\n\n列车长在所有人注视下被执行。林晓站在人群中，心里没有快意，只有疲惫。\n\n\"结束了，\"老王说。\n\n\"不，刚刚开始。\"\n\n林晓投入引擎修复工作。两周后，永恒号重新轰鸣起来。\n\n新秩序在废墟上建立。老王成为领导者，林晓负责技术，叶婷重建研究部门。\n\n窗外，永恒号继续前进。这不是童话般的完美结局，但这是他们选择的道路——荆棘丛生但指向光明的道路。", "ending_type": "good_ending", "choice_presentation": null, "echo_applied": []}, "ending_004": {"node_id": "ending_004", "narrative_text": "林晓的替代方案成功了。\n\n引擎在最后一刻稳定下来，那种熟悉的轰鸣声重新在整列火车中回响。控制台上的红色警告灯一个接一个熄灭，取而代之的是稳定的绿光。林晓站在引擎室中央，浑身湿透，但脸上是难以置信的笑容。\n\n\"成了……真的成了……\"\n\n他踉跄着走出引擎室，迎接他的是一片欢呼。消息已经传开了——三等舱的维修工用自己设计的替代方案救了所有人。不是头等舱的科学家，不是二等舱的技术专家，而是一个被贬到最底层的工程师。\n\n老王冲上来紧紧抱住他，浑浊的眼中满是泪水：\"小晓！我就知道你能行！\"\n\n人群蜂拥而至。林晓看到了陈浩在人群外围投来的微笑；看到了曾经看不起他的二等舱技术员，现在眼中满是敬佩；甚至看到了一些头等舱的居民，第一次以平等的目光注视着他。\n\n列车长的权威受到了严重动摇。六个月后，一场和平的权力交接完成了。新的代表委员会接管了管理，阶层的壁垒开始松动，资源的分配变得更加公平。\n\n林晓站在曾经属于列车长的观景台上，看着窗外的冰原。叶婷走到他身边。\n\n\"你知道吗，\"她说，\"你的替代方案只有五成的成功率。你赌赢了。\"\n\n\"我知道。\"林晓说，\"但有时候，你必须赌。\"\n\n窗外，永恒号轰鸣着继续前进。这不是终点，只是一个新的开始。", "ending_type": "good_ending", "choice_presentation": null, "echo_applied": []}, "ending_008": {"node_id": "ending_008", "narrative_text": "林晓扑向列车长，两人扭打在一起。\n\n走廊里响起惊呼声，但没人敢上前——列车长手里还有枪，而林晓正死死扣住他的手腕。\n\n\"放手！\"列车长咆哮。\n\n林晓不为所动。他的目标只有一个：那枚挂在列车长胸口的启动密钥。两人在地上翻滚，撞翻了桌椅。林晓感到拳头砸在肋骨上，痛得几乎窒息，但他咬紧牙关。\n\n就在这时，列车长失去平衡。他们距离维护井口太近了——那是一个深二十米的竖井。\n\n林晓看到危险，本能地松手后退。但列车长的反应慢了半拍，身体已经倾斜过了临界点。\n\n\"不——！\"\n\n他伸手想抓住什么，却只抓到空气。然后消失在井口的黑暗中。\n\n一声沉闷的撞击从下面传来，然后是死一般的寂静。\n\n林晓跪在井口边缘，大口喘气。那枚启动密钥在扭打中被扯下来，握在他的手里。\n\n二十四小时后，引擎修复完成。\n\n他走出控制台时，整个人像被抽干了力气。叶婷扶住他。\n\n\"你成功了。\"她轻声说。\n\n\"是的。\"林晓看着自己的双手，\"但我还是会记住……那一刻的感觉。\"\n\n窗外，永恒号轰鸣着继续前进。正义得到了伸张，但有些东西已永远改变了——包括他自己。", "ending_type": "good_ending", "choice_presentation": null, "echo_applied": []}, "ending_014": {"node_id": "ending_014", "narrative_text": "林晓选择了引擎。\n\n当革命在三等舱爆发时，他躲在引擎室里专注于修复工作。外面传来枪声、尖叫声，但他假装听不见。\n\n\"他们在外面死战，你却——\"叶婷震惊。\n\n\"我在救所有人。如果引擎停了，不管谁赢都是死。\"\n\n但老王没有机会理解了。革命失败了，在林晓缺席的情况下。没有技术支持，三等舱只能用蛮力冲击防线，结果是可预见的屠杀。老王死在最前线。\n\n林晓修好了冷却系统，但当他走出引擎室时，面对的是死寂。\n\n列车长亲自来迎接：\"做得好，林工程师。你的选择证明了你的价值。\"\n\n林晓成为了英雄——在上层人眼中。但三等舱用另一种目光看他：叛徒的目光。\n\n他不再回三等舱了。把自己关在引擎室里，日复一日维护那颗钢铁心脏。\n\n五年后有人问：后悔吗？\n\n林晓看着稳定跳动的引擎，沉默很久。\n\n\"引擎还在跑，列车还在走。这就够了。\"\n\n但他的眼睛没看引擎，而是看向窗外那片永恒的白色——那里埋葬着老王，埋葬着那些信任他的人，埋葬着他曾经的自己。\n\n这是他选择的孤独。", "ending_type": "bad_ending", "choice_presentation": null, "echo_applied": []}, "ending_015": {"node_id": "ending_015", "narrative_text": "林晓把那些文件摔在列车长面前。\n\n\"人口优化计划，逃生舱设计图，还有你的秘密通讯记录。\"他的声音冷如冰原，\"足够让全车的人撕碎你。\"\n\n列车长的嘴唇颤抖：\"你想怎样？\"\n\n\"交出引擎控制权，退位，接受委员会监管。这是我的条件。\"\n\n沉默蔓延。列车长最终低下头：\"好，我接受。\"\n\n这是一场不流血的政变。列车长交出权力，新的管理委员会成立，资源开始公平分配。\n\n\"你怎么做到的？\"老王难以置信。\n\n\"证据比武器更有力。当所有人都知道真相时，他就无处可逃。\"\n\n\"那些证据怎么拿到的？\"\n\n\"叶婷。她被软禁那些年一直在秘密收集。\"\n\n一个月后，引擎修复完成。林晓站在观察窗前，身边是叶婷、老王、陈浩——曾分属不同阶层的人，现在站在同一阵线。\n\n\"接下来怎么办？\"陈浩问。\n\n\"继续走。去找一个可以停下来的地方。\"林晓转向同伴们，\"不管怎样，我们一起。\"\n\n窗外，永恒号轰鸣着驶向未知。这是一个新的开始——用智慧而非暴力赢得的开始。", "ending_type": "good_ending", "choice_presentation": null, "echo_applied": []}, "ending_010": {"node_id": "ending_010", "narrative_text": "逃生舱被破坏的消息传遍整列火车。\n\n列车长的脸色从愤怒变成苍白：\"你赢了，没有退路了。\"\n\n林晓站在门口：\"我不是来赢的。我是来让所有人都活下去的。\"\n\n谈判持续了一整夜。列车长交出引擎控制权，作为交换，他被允许以\"顾问\"身份保留一定影响力——但所有决定都需委员会批准。\n\n这是一个不稳定的和平，但至少是和平。\n\n三等舱的人不满意，想要彻底清算。老王花了很大力气才压住情绪：\"先活下去，再谈其他。\"\n\n林晓专注于修复引擎。两周后，冷却系统恢复正常。永恒号活了下来。\n\n但问题远未解决。列车长虽失去绝对权力，影响力还在。头等舱很多人依然效忠他，三等舱的人依然记恨七年压迫。委员会每次会议都充满争吵。\n\n\"这样下去不是办法，\"叶婷说，\"迟早会出事。\"\n\n\"我知道。但至少现在每个人都还活着。\"林晓看向窗外，\"其他的……慢慢来吧。\"\n\n窗外，永恒号轰鸣着穿过冰原。这不是最好的结局，也不是最坏的。\n\n也许，这就是现实——没有童话般的完美，只有艰难前行。", "ending_type": "neutral_ending", "choice_presentation": null, "echo_applied": []}}, "reward": 1.0, "duration": 4783.2}];
