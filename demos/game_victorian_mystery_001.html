<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密室与玫瑰：克劳福德侦探案</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #0a0a0f;
  --bg-darker: #050508;
  --gold: #c4a35a;
  --gold-light: #d4b76a;
  --gold-dim: #8a7340;
  --text-warm: #e8e0d0;
  --text-dim: #a09888;
  --red-accent: #8b2020;
  --red-glow: #c0392b;
  --green-accent: #2d8a56;
  --textbox-bg: rgba(10, 10, 20, 0.92);
  --overlay-bg: rgba(5, 5, 10, 0.92);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-darker);
  font-family: 'Noto Serif SC', 'SimSun', serif;
  color: var(--text-warm);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ===== GAME CONTAINER 16:9 ===== */
#game-container {
  position: relative; width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-darker);
}
#game-viewport {
  position: relative; width: 100%; height: 100%;
  max-width: calc(100vh * 16 / 9);
  max-height: calc(100vw * 9 / 16);
  overflow: hidden; background: var(--bg-dark);
}

/* ===== FOG ===== */
@keyframes fogDrift1 {
  0%   { transform: translateX(-10%) translateY(0); opacity: 0.03; }
  50%  { transform: translateX(5%) translateY(-3%); opacity: 0.06; }
  100% { transform: translateX(-10%) translateY(0); opacity: 0.03; }
}
@keyframes fogDrift2 {
  0%   { transform: translateX(10%) translateY(2%); opacity: 0.04; }
  50%  { transform: translateX(-8%) translateY(-1%); opacity: 0.07; }
  100% { transform: translateX(10%) translateY(2%); opacity: 0.04; }
}
.fog-layer {
  position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
  pointer-events: none; z-index: 2;
}
.fog-layer-1 {
  background: radial-gradient(ellipse at 30% 50%, rgba(200,190,170,0.15) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 30%, rgba(180,170,150,0.1) 0%, transparent 50%);
  animation: fogDrift1 20s ease-in-out infinite;
}
.fog-layer-2 {
  background: radial-gradient(ellipse at 60% 60%, rgba(160,150,130,0.12) 0%, transparent 55%),
              radial-gradient(ellipse at 20% 70%, rgba(190,180,160,0.08) 0%, transparent 45%);
  animation: fogDrift2 28s ease-in-out infinite;
}

.vignette {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 5;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
}

/* ===== TITLE SCREEN ===== */
#title-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #080810 0%, #0d0d18 40%, #0a0a12 100%);
  transition: opacity 1s ease;
}
#title-screen.hidden { opacity: 0; pointer-events: none; }

#title-screen .ornament {
  width: 200px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 12px 0;
}
#title-screen h1 {
  font-size: 2.6rem; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 30px rgba(196,163,90,0.3), 0 2px 4px rgba(0,0,0,0.5);
  letter-spacing: 6px; text-align: center; line-height: 1.4;
}
#title-screen .subtitle {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.95rem;
  color: var(--text-dim); letter-spacing: 4px; margin-top: 8px; font-weight: 300;
}
#title-screen .title-buttons {
  display: flex; flex-direction: column; gap: 14px; margin-top: 50px; align-items: center;
}
.btn-title {
  font-family: 'Noto Serif SC', serif; font-size: 1.05rem;
  color: var(--text-warm); background: transparent;
  border: 1px solid var(--gold-dim); padding: 12px 54px;
  cursor: pointer; letter-spacing: 4px; min-width: 220px; text-align: center;
  transition: all 0.3s ease;
}
.btn-title:hover:not(:disabled) {
  border-color: var(--gold); color: var(--gold-light);
  box-shadow: 0 0 15px rgba(196,163,90,0.2), inset 0 0 15px rgba(196,163,90,0.05);
}
.btn-title:disabled { color: #555; border-color: #333; cursor: not-allowed; }

/* ===== SCENE LAYER ===== */
#scene-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10; display: none;
}
#scene-bg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  background-color: var(--bg-dark); transition: opacity 0.8s ease;
}
#scene-bg-next {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  background-color: var(--bg-dark); opacity: 0; transition: opacity 0.8s ease;
}

/* ===== CHARACTER PORTRAITS ===== */
.char-wrap {
  position: absolute; bottom: 28%; height: 58%; max-width: 40%;
  z-index: 12; opacity: 0;
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
}
.char-wrap .char-portrait {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
}
.char-wrap .char-name {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.8rem;
  color: var(--gold-light); letter-spacing: 2px;
  background: rgba(10,10,20,0.75); padding: 4px 16px;
  border: 1px solid rgba(196,163,90,0.2); border-radius: 3px;
  margin-top: 6px; white-space: nowrap;
  backdrop-filter: blur(4px);
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.char-wrap.pos-left { left: 5%; transform: translateY(10px); }
.char-wrap.pos-right { right: 5%; transform: translateY(10px); }
.char-wrap.visible { opacity: 1; transform: translateY(0); }

/* ===== SCENE TITLE OVERLAY ===== */
#scene-title-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 50; background: rgba(0,0,0,0.75);
  opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
}
#scene-title-overlay.visible { opacity: 1; }
#scene-title-overlay .act-label {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.9rem;
  color: var(--gold-dim); letter-spacing: 6px; margin-bottom: 12px;
}
#scene-title-overlay .scene-title-text {
  font-family: 'Noto Serif SC', serif; font-size: 2rem; color: var(--gold);
  text-shadow: 0 0 20px rgba(196,163,90,0.3); letter-spacing: 3px;
}

/* ===== ACT TRANSITION ===== */
#act-transition {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200; background: var(--bg-dark);
  opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
}
#act-transition.visible { opacity: 1; pointer-events: auto; }
#act-transition .act-number {
  font-family: 'Noto Serif SC', serif; font-size: 1rem;
  color: var(--gold-dim); letter-spacing: 8px; margin-bottom: 16px;
}
#act-transition .act-title {
  font-family: 'Noto Serif SC', serif; font-size: 2.4rem; color: var(--gold);
  text-shadow: 0 0 30px rgba(196,163,90,0.3); letter-spacing: 4px;
}
#act-transition .act-line {
  width: 120px; height: 1px; margin-top: 20px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
}

/* ===== TEXT BOX ===== */
#textbox-container {
  position: absolute; bottom: 0; left: 0; width: 100%;
  z-index: 30; pointer-events: auto;
}
#textbox {
  background: var(--textbox-bg);
  border-top: 1px solid rgba(196,163,90,0.15);
  padding: 28px 48px 36px;
  min-height: 260px;
  backdrop-filter: blur(8px);
  cursor: pointer;
}
#speaker-name {
  font-family: 'Noto Sans SC', sans-serif; font-size: 1rem;
  color: var(--gold); letter-spacing: 3px; margin-bottom: 10px;
  font-weight: 500; min-height: 1.3em;
}
#text-content {
  font-size: 1.2rem; line-height: 2; color: var(--text-warm);
  letter-spacing: 0.8px; white-space: pre-wrap;
  min-height: 120px;
}
#text-content em, #text-content i {
  color: var(--gold-dim); font-style: italic;
}
#click-indicator {
  position: absolute; bottom: 12px; right: 30px;
  font-size: 0.75rem; color: var(--gold-dim);
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

/* ===== CHOICE PANEL ===== */
#choice-panel {
  position: absolute; bottom: 0; left: 0; width: 100%;
  z-index: 35; display: none;
  background: linear-gradient(180deg, transparent 0%, rgba(5,5,10,0.85) 20%, rgba(5,5,10,0.95) 100%);
  padding: 40px 60px 36px;
}
#choice-panel .choice-header {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.8rem;
  color: var(--gold-dim); letter-spacing: 4px; margin-bottom: 18px; text-align: center;
}
.choice-btn {
  display: block; width: 100%; max-width: 700px; margin: 0 auto 12px;
  font-family: 'Noto Serif SC', serif; font-size: 0.95rem;
  color: var(--text-warm); background: rgba(20,20,35,0.8);
  border: 1px solid rgba(196,163,90,0.25); padding: 16px 24px;
  cursor: pointer; text-align: left; letter-spacing: 0.5px;
  transition: all 0.3s ease; line-height: 1.6; position: relative;
}
.choice-btn:hover:not(.locked) {
  border-color: var(--gold); color: var(--gold-light);
  background: rgba(30,28,40,0.9);
  box-shadow: 0 0 20px rgba(196,163,90,0.15), inset 0 0 20px rgba(196,163,90,0.03);
}
.choice-btn.locked {
  color: #555; border-color: #2a2a2a; cursor: not-allowed;
}
.choice-btn .lock-reason {
  display: block; font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.75rem; color: var(--red-accent); margin-top: 6px;
  font-style: italic;
}
.choice-btn .dead-end-icon {
  color: var(--red-glow); margin-left: 6px; font-size: 0.85em;
}

/* ===== HUD ===== */
#hud {
  position: absolute; top: 16px; left: 20px; z-index: 40;
  display: none; gap: 16px;
}
.hud-stat {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.75rem;
  color: var(--text-dim); letter-spacing: 1px;
  background: rgba(10,10,20,0.7); padding: 6px 14px;
  border: 1px solid rgba(100,90,70,0.2); border-radius: 4px;
  backdrop-filter: blur(4px); transition: all 0.4s ease;
  display: flex; align-items: center; gap: 6px;
}
.hud-stat .stat-icon { font-size: 0.9rem; }
.hud-stat .stat-val {
  color: var(--gold); font-weight: 500; min-width: 16px; text-align: center;
  transition: all 0.3s ease;
}
.hud-stat.flash { border-color: var(--gold); box-shadow: 0 0 12px rgba(196,163,90,0.3); }

/* ===== HUD RIGHT (save/load/menu) ===== */
#hud-right {
  position: absolute; top: 16px; right: 20px; z-index: 40;
  display: none; gap: 8px;
}
.hud-btn {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.7rem;
  color: var(--text-dim); background: rgba(10,10,20,0.6);
  border: 1px solid rgba(100,90,70,0.15); padding: 5px 12px;
  cursor: pointer; letter-spacing: 1px; transition: all 0.3s;
  border-radius: 3px;
}
.hud-btn:hover { color: var(--gold-light); border-color: var(--gold-dim); }

/* ===== SAVE/LOAD MODAL ===== */
#modal-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 300; background: rgba(0,0,0,0.8);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
#modal-box {
  background: #111118; border: 1px solid var(--gold-dim);
  padding: 30px 40px; max-width: 500px; width: 90%;
  text-align: center;
}
#modal-box h2 {
  font-size: 1.2rem; color: var(--gold); letter-spacing: 3px; margin-bottom: 24px;
}
.save-slot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; margin-bottom: 10px;
  border: 1px solid rgba(196,163,90,0.15); cursor: pointer;
  transition: all 0.3s;
}
.save-slot:hover { border-color: var(--gold-dim); background: rgba(196,163,90,0.05); }
.save-slot .slot-info { font-size: 0.85rem; color: var(--text-dim); text-align: left; }
.save-slot .slot-label { color: var(--text-warm); font-size: 0.9rem; }
#modal-close {
  margin-top: 20px; font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.85rem; color: var(--text-dim); background: transparent;
  border: 1px solid #333; padding: 8px 30px; cursor: pointer;
  letter-spacing: 2px; transition: all 0.3s;
}
#modal-close:hover { color: var(--gold-light); border-color: var(--gold-dim); }

/* ===== ENDING SCREEN ===== */
#ending-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 250; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg-dark); text-align: center; padding: 40px;
}
#ending-screen.bad-end { background: linear-gradient(180deg, #0a0508 0%, #150810 50%, #0a0508 100%); }
#ending-screen .ending-icon { font-size: 3rem; margin-bottom: 20px; }
#ending-screen h2 {
  font-family: 'Noto Serif SC', serif; font-size: 2rem; color: var(--gold);
  letter-spacing: 4px; margin-bottom: 12px;
}
#ending-screen .ending-type {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.8rem;
  color: var(--gold-dim); letter-spacing: 3px; margin-bottom: 30px;
}
#ending-screen .ending-text {
  font-size: 0.95rem; line-height: 1.8; color: var(--text-dim);
  max-width: 600px; margin-bottom: 40px;
}
#ending-screen .ending-stats {
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.8rem;
  color: var(--text-dim); margin-bottom: 30px; line-height: 2;
}
.ending-buttons { display: flex; gap: 16px; }
.btn-ending {
  font-family: 'Noto Serif SC', serif; font-size: 0.95rem;
  color: var(--text-warm); background: transparent;
  border: 1px solid var(--gold-dim); padding: 12px 40px;
  cursor: pointer; letter-spacing: 3px; transition: all 0.3s;
}
.btn-ending:hover { border-color: var(--gold); color: var(--gold-light); }

/* ===== HISTORY PANEL ===== */
#history-panel {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 280; display: none; background: rgba(5,5,10,0.95);
  overflow-y: auto; padding: 40px 60px;
  backdrop-filter: blur(6px);
}
#history-panel h2 {
  font-size: 1.1rem; color: var(--gold); letter-spacing: 3px;
  margin-bottom: 24px; text-align: center;
}
#history-panel .history-entry {
  padding: 12px 0; border-bottom: 1px solid rgba(196,163,90,0.1);
  font-size: 0.85rem; line-height: 1.7; color: var(--text-dim);
}
#history-panel .history-entry .h-title { color: var(--gold-dim); margin-bottom: 4px; }
#history-close {
  position: fixed; top: 20px; right: 30px;
  font-size: 1.5rem; color: var(--text-dim); cursor: pointer;
  background: none; border: none; z-index: 281;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  #textbox { padding: 18px 24px 24px; min-height: 200px; }
  #text-content { font-size: 1.05rem; line-height: 1.8; }
  #title-screen h1 { font-size: 1.8rem; letter-spacing: 3px; }
  #choice-panel { padding: 30px 20px 28px; }
  .choice-btn { font-size: 0.85rem; padding: 12px 16px; }
  #hud { left: 10px; }
  .hud-stat { font-size: 0.65rem; padding: 4px 10px; }
}
</style>
</head>
<body>
<div id="game-container">
<div id="game-viewport">

  <!-- Background -->
  <div id="scene-bg"></div>
  <div id="scene-bg-next"></div>
  <div class="fog-layer fog-layer-1"></div>
  <div class="fog-layer fog-layer-2"></div>
  <div class="vignette"></div>

  <!-- Title Screen -->
  <div id="title-screen">
    <div class="ornament"></div>
    <h1>密室与玫瑰</h1>
    <div class="subtitle">克劳福德侦探案 · 1862</div>
    <div class="ornament"></div>
    <div class="title-buttons">
      <button class="btn-title" id="btn-start">开 始 调 查</button>
      <button class="btn-title" id="btn-continue" disabled>继 续 游 戏</button>
    </div>
  </div>

  <!-- Scene Layer -->
  <div id="scene-layer">
    <!-- Character portraits with name labels -->
    <div class="char-wrap pos-left" id="char-left-wrap">
      <img class="char-portrait" id="char-left" src="" alt="">
      <div class="char-name" id="char-left-name"></div>
    </div>
    <div class="char-wrap pos-right" id="char-right-wrap">
      <img class="char-portrait" id="char-right" src="" alt="">
      <div class="char-name" id="char-right-name"></div>
    </div>

    <!-- Scene title flash -->
    <div id="scene-title-overlay">
      <div class="act-label" id="scene-act-label"></div>
      <div class="scene-title-text" id="scene-title-text"></div>
    </div>

    <!-- Text box -->
    <div id="textbox-container">
      <div id="textbox">
        <div id="speaker-name"></div>
        <div id="text-content"></div>
        <div id="click-indicator">▼ 点击继续</div>
      </div>
    </div>

    <!-- Choice panel -->
    <div id="choice-panel">
      <div class="choice-header">— 请做出选择 —</div>
      <div id="choice-buttons"></div>
    </div>
  </div>

  <!-- Act transition -->
  <div id="act-transition">
    <div class="act-number" id="act-number"></div>
    <div class="act-title" id="act-title"></div>
    <div class="act-line"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-stat" id="hud-clues"><span class="stat-icon">🔍</span>线索 <span class="stat-val" id="val-clues">0</span></div>
    <div class="hud-stat" id="hud-courage"><span class="stat-icon">⚔️</span>勇气 <span class="stat-val" id="val-courage">0</span></div>
    <div class="hud-stat" id="hud-trust"><span class="stat-icon">🤝</span>信任 <span class="stat-val" id="val-trust">0</span></div>
  </div>
  <div id="hud-right">
    <button class="hud-btn" id="btn-save">存档</button>
    <button class="hud-btn" id="btn-load">读档</button>
    <button class="hud-btn" id="btn-history">回顾</button>
    <button class="hud-btn" id="btn-auto">自动</button>
  </div>

  <!-- Ending screen -->
  <div id="ending-screen">
    <div class="ending-icon" id="ending-icon"></div>
    <h2 id="ending-title"></h2>
    <div class="ending-type" id="ending-type-label"></div>
    <div class="ending-text" id="ending-text"></div>
    <div class="ending-stats" id="ending-stats"></div>
    <div class="ending-buttons">
      <button class="btn-ending" id="btn-restart">重新开始</button>
      <button class="btn-ending" id="btn-title-return">返回标题</button>
    </div>
  </div>

  <!-- Save/Load Modal -->
  <div id="modal-overlay">
    <div id="modal-box">
      <h2 id="modal-title">存 档</h2>
      <div id="modal-slots"></div>
      <button id="modal-close">关 闭</button>
    </div>
  </div>

  <!-- History Panel -->
  <div id="history-panel">
    <button id="history-close">&times;</button>
    <h2>— 回 顾 —</h2>
    <div id="history-content"></div>
  </div>

</div>

<script>

清晨六点，伦敦郊外的雾还没有散。\n   \n   马车车轮碾过泥泞的石板路，发出沉闷的节奏声。艾德蒙·克劳福德将圆顶礼帽压低了一些，从车窗向外望去——格雷夫顿庄园的轮廓在浓雾中一点一点浮现出来，像是一幅被水浸湿的铜版画，边缘模糊，却又有着令人不安的清晰。\n   \n   三层哥特式建筑，尖顶刺入灰白的天空。铁制大门上系着黑色丧布，随着晨风微微飘动。墙壁上爬满了枯黄的常青藤，在这个季节显得格外凋零。艾德蒙注意到，庄园的每一扇窗户都拉着窗帘——整栋建筑像是闭上了眼睛。\n   \n   马车停下时，他已经整理好了自己的思绪。\n   \n   \"克劳福德先生。\"\n   \n   门口站着一个身形魁梧的男人，深色大衣，络腮鬓角，表情像是刚刚吃了什么不合口味的东西。艾德蒙认出了他——威廉·霍奇，苏格兰场的老警探，在伦敦干了将近三十年。\n   \n   \"霍奇警探。\"艾德蒙跳下马车，伸出手。\n   \n   威廉没有立刻握手。他打量了艾德蒙一眼，从礼帽看到皮靴，目光里带着毫不掩饰的轻蔑。\n   \n   \"就是你？\"他终于开口，声音粗哑，像砂纸摩擦木头，\"委托人花了多少钱，请了个这么年轻的多管闲事的顾问？\"\n   \n   艾德蒙保持着礼貌的微笑，将手收回来，\"案件的情况，请您说明一下。\"\n   \n   威廉哼了一声，转身走向大门，\"格雷夫顿伯爵，埃德加·格雷夫顿，昨夜死在他的书房里。仆人今天早上六点发现的。死亡时间，\"他顿了顿，语气里带着一种奇特的平淡，\"大约是昨晚十一点。\"\n   \n   \"书房的情况？\"\n   \n   \"门从里面锁死的。窗户也是从里面插上的插销。\"威廉推开铁门，铁门发出低沉的嘎吱声，\"唯一的钥匙，在死者自己的口袋里。\"\n   \n   艾德蒙跟着他走进庄园，脚下的石板路被露水打湿，每一步都发出轻微的回响。他的目光扫过庄园入口的走廊——两侧挂满了油画，沉重的金色画框，昏暗的油彩，描绘着风景、贵族肖像、神话场景。\n   \n   他的脚步微微慢了下来。\n   \n   走廊最里端，靠近楼梯转角的地方，挂着一幅风景画。尺寸不小，画的是某处意大利海岸的黄昏。但画框明显向右倾斜了将近十五度，像是被人匆忙碰动过，又没有来得及扶正。\n   \n   艾德蒙用手指轻轻叩了叩下巴。\n   \n   \"有问题？\"威廉察觉到他停下来，转过身，语气不耐烦。\n   \n   \"没有。\"艾德蒙移开视线，继续跟上，\"请带我去书房。\"", "title": "雾中庄园", "act": 1}, "node_02": {"text": "书房在三楼走廊的尽头。\n   \n   门口站着两名苏格兰场的警员，见到威廉便退到一侧。威廉掏出钥匙——一把临时配制的备用钥匙，笨重而粗糙——将门推开。\n   \n   气味先于视觉到达：陈旧的皮革、烟草、壁炉灰烬，以及某种更深处的、令人不安的腥甜。\n   \n   艾德蒙踏入书房。\n   \n   这是一间四面皆书的房间。书架从地板延伸至天花板，密密麻麻的书脊在晨光中泛出暗沉的色泽。正对门口是一张宽大的橡木书桌，桌面上散落着文件和钢笔。书桌右侧是壁炉，左侧是一扇通向花园的窗户——窗户关闭，插销从内侧插上，玻璃上凝结着昨夜的水汽。\n   \n   伯爵就伏在书桌上。\n   \n   艾德蒙走近，俯身查看，神情平静，只有眼神变得格外专注。\n   \n   伯爵的颈部有明显的掐痕——但不是手指留下的，那种弧度和宽度都不对。痕迹均匀而连续，更像是某种细绳，或者……金属丝。艾德蒙微微皱眉，用手指在痕迹旁边比划了一下，没有触碰。\n   \n   \"不是自杀。\"他直起身，陈述这个显而易见的事实。\n   \n   \"废话。\"威廉靠在书架旁，双臂交叉，\"我们不是傻子。\"\n   \n   艾德蒙没有理会他的语气。他的目光转向书桌——那封未写完的信。\n   \n   信纸是上好的奶油色厚纸，伯爵的笔迹工整有力，但最后几个字明显变得潦草，像是被什么打断了：\n   \n   *\"他们已经知道了，我必须——\"*\n   \n   就此中断。钢笔还搁在旁边，墨水在纸上晕开了一个小小的污点，像是被人突然放下的。\n   \n   艾德蒙将视线从信件移开，扫视整个书房。壁炉里有新鲜的燃烧痕迹——灰烬的颜色比周围浅，还带着轻微的温度。有东西昨夜被烧毁了，而且是在伯爵死后，或者就在死亡发生的那段时间前后。\n   \n   他走向窗户，蹲下身，凑近窗框内侧。\n   \n   光线在这个角度下，他看到了细微的划痕——不是偶然磕碰留下的，而是有规律的、横向的、像是某种细线反复摩擦所致的痕迹。\n   \n   他站起身，手指再次叩了叩下巴。\n   \n   密室。唯一的钥匙在死者口袋。门窗从内锁闭。但那些划痕……\n   \n   \"克劳福德先生，\"威廉的声音带着明显的不耐烦，\"您打算在这里站到中午吗？\"\n   \n   艾德蒙转过身，目光在壁炉和书桌之间来回移动了一秒。\n   \n   线索就在这里，但时间有限，威廉不会无限期地配合他一个人慢慢检查。他必须决定，先从哪里着手。", "title": "现场勘查", "act": 1}, "node_03a": {"text": "艾德蒙蹲下身，将圆顶礼帽搁在膝盖旁的地板上，凑近壁炉检视那一层灰白色的残骸。\n     \n     书房里的壁炉已经熄灭多时，灰烬冷透了，散发着潮湿纸张烧焦后特有的苦涩气息。他从上衣口袋取出一把细头镊子，屏住呼吸，以极缓慢的动作拨开表层的浮灰。炉膛深处，几片残余的纸角侥幸逃过了彻底焚毁的命运——火势想必被什么东西打断了，或者烧的人过于仓促。\n     \n     他将最大的一片碎纸夹出，小心翼翼地平铺在掌心。纸面已焦黑大半，但边缘仍依稀可辨几个墨迹较重的字：\n     \n     \"……玫……兄……会……\"\n     \n     *玫瑰。兄弟。会。*\n     \n     艾德蒙的手指在下巴轻叩了两下。他在爱丁堡的导师曾提过，秘密组织惯于在文件上使用特定的花卉符号作为标记——但那不过是课堂上的闲谈，他从未想到会在伦敦郊外的一桩命案里与之照面。他将碎纸片连同其余几块残片一并用手帕包好，收入外套内袋，随即站起身，走向那扇紧闭的窗。\n     \n     窗框是老式的橡木，漆面已经开裂，多年的风霜在木纹里留下了深深浅浅的纹路。艾德蒙从随身皮革包里取出一把折叠式卷尺，俯身对准窗框内侧一道细而清晰的划痕，仔细量了量。\n     \n     他的眉头微微皱起。\n     \n     划痕的宽度：约零点八毫米。\n     \n     他在脑海里迅速比对——人的手指甲留下的痕迹至少有两三毫米，普通铁丝更粗，而钢琴弦……他记得在爱丁堡的一次法医学实验课上，教授展示过各类细线在木质表面留下的切痕标本。钢琴弦，尤其是高音区的细弦，截面恰好在这个范围之内。\n     \n     他在笔记本上写下：*窗框划痕，宽约0.8mm，方向由外向内斜切，深度均匀——非偶然摩擦，系受力拉拽所致。若以钢琴弦穿过窗缝，绕过锁舌，从窗外操控……*\n     \n     他停笔，抬头望向那扇窗与门锁之间的空间距离，在心里默默丈量了一遍。可行。角度略有难度，但可行。凶手只需在伯爵死后，将细弦从窗缝抽回，门便仍是从内锁死的状态。\n     \n     密室，不再是密室。\n     \n     \"不过是壁炉灰罢了。\"\n     \n     霍奇警探的声音从身后传来，带着一贯的慵懒与漫不经心。艾德蒙没有立刻回头，他继续在笔记本上写完最后一行字，才缓缓合上本子，转过身。\n     \n     霍奇靠在书架旁，两手插在深色大衣的口袋里，眼神扫过艾德蒙手边的卷尺和镊子，嘴角带着一丝不以为然的弧度。\"克劳福德先生，您这一套爱丁堡的把戏，在苏格兰场的老兄弟们看来，实在是……有趣。\"\n     \n     \"有趣。\"艾德蒙把卷尺收回皮包，平静地重复了一遍这个词，语气里没有反驳，也没有附和。他注意到，自从他蹲下检视壁炉的那一刻起，霍奇便始终站在他身后偏左的位置——那个角度，恰好无法看清他从灰烬里夹出了什么。\n     \n     是习惯性的懈怠，还是刻意的回避？\n     \n     他将这个问题压在心底，礼貌地朝霍奇点了点头。\"您说得对，警探先生。也许什么都不是。\"他拿起礼帽，戴回头上，\"我只是养成了记录一切的坏习惯。\"\n     \n     走出书房的时候，他的步伐平稳，神情如常。\n     \n     但笔记本的内页上，在那行关于钢琴弦的推断旁边，他用细小的字迹另外写了一行：\n     \n     *霍奇，为何不想让我看清那些灰烬？*", "title": "物证：细线与灰烬", "act": 1}, "node_03b": {"text": "艾德蒙将那封未竟的信笺从书桌上小心取起，拇指与食指只捏住纸张边角，仿佛多一分触碰便会令某种脆弱的真相碎裂。\n     \n     信纸是奶白色的，质地细腻，在书房昏黄的煤气灯光下泛着微微的光泽。笔迹起初工整，越往后越见凌乱，最后几行字几乎是颤抖着写就的，墨迹有处晕开了——像是有什么液体滴落其上。艾德蒙凑近细看，用指节轻轻触碰那处晕痕，随即在心中默默确认：不是雨水，也不是墨水。纸张的纤维在液体渗透后留下了极细微的盐渍痕迹，只有在光线斜射时才能辨认。\n     \n     是泪水。\n     \n     他在心中停顿了一瞬。无论格雷夫顿伯爵生前是何等人物，至少在写下这封信的那个夜晚，他是恐惧的。\n     \n     *'亲爱的H，我已无路可退。他们要求我归还文件，否则我的秘密将公之于众。你是唯一知晓全部实情之人——'*\n     \n     信在这里戛然而止。没有签名，没有日期，像一句被人掐断喉咙的呼救。\n     \n     艾德蒙将信笺放回原处，目光转向书桌右侧的抽屉。抽屉并未上锁——也许伯爵已来不及上锁，也许他认为没有必要。里面整齐叠放着三封信封，火漆封印均已破开，显然是被反复取出阅读过的。\n     \n     他依次展开，按时间顺序排列在桌面上。\n     \n     第一封措辞尚算客气，近乎是一种提醒：*'阁下应当明白，那些文件不属于您。请在约定期限内归还，以免造成不必要的麻烦。'* 第二封语气已然冷硬，威胁的轮廓开始清晰：*'您的拖延令我们深感不满。请记住，我们对您过去的种种了解，远比您所以为的更为详尽。'* 第三封只有寥寥数行，却字字如刀：*'这是最后的警告。文件，或是您的声誉——请自行选择。我们的耐心已经耗尽。'*\n     \n     艾德蒙将三封信并排摆开，手指在下巴处轻轻叩动，目光在纸张之间来回游移。\n     \n     威胁的升级脉络清晰可辨——从礼貌的催促，到冷酷的警告，到最终的通牒。伯爵显然一直在拖延，而拖延的原因，或许正是他无法轻易交出那份文件。\n     \n     但更令艾德蒙心生疑虑的，是这几封信的纸张本身。\n     \n     他将其中一封凑近灯光，手指摩挲纸面。质地厚实，纹理均匀，边缘裁切精准，没有任何粗糙的毛边——这不是普通文具店能够买到的信纸。他曾在爱丁堡的法医课上见过类似的样本，那是苏格兰某位公爵在庭审中呈堂的私人信函。这种纸张通常由专门的造纸作坊定制，使用者非富即贵，且极为注重身份的隐匿性——因为定制信纸本身便是一种身份的彰显，却又可以在不署名的情况下令收信人心领神会。\n     \n     威胁者来自上层阶级。这几乎是可以确定的。\n     \n     艾德蒙将信件重新叠好，放回抽屉，却没有关上。他站直身子，圆顶礼帽的帽沿在灯光下投下一道阴影，遮住了他眉间渐深的皱纹。\n     \n     *H。*\n     \n     伯爵在生命最后的时刻，选择向这个名字倾诉。是挚友？是同谋？还是某个他以为可以信赖、却未必真正可靠的人？这个字母像一枚楔子，嵌入了这桩案件的核心，却没有留下任何可供追踪的线索。\n     \n     窗外，庄园的花园在夜雾中沉默着。艾德蒙合上抽屉，将那封未完成的信笺折好，小心收入外套内袋。\n     \n     他需要找到'H'是谁。", "title": "书面证据：威胁信", "act": 1}, "node_04": {"text": "蓝色客厅位于庄园二楼的南翼，是整栋建筑里少有的几个不令人压抑的房间之一。\n     \n     墙壁覆着法国进口的蓝色锦缎壁纸，两扇高窗面朝花园，晨雾散去后，稀薄的冬日阳光正从窗帘缝隙里渗入，在地毯上投下细长的光带。壁炉燃着低火，炉架上摆着一对白色大理石烛台。\n     \n     伯爵夫人伊莎贝拉·格雷夫顿坐在靠窗的椅子上。\n     \n     她穿着黑色丧服，裙摆铺展在椅子两侧，乌黑的发髻梳得一丝不苟。她的手放在膝上，指尖交叠，姿态端正得近乎刻意。当艾德蒙被仆人引进来时，她抬起头——深棕色的眼睛，平静，清醒，像是两潭不见底的深水。\n     \n     艾德蒙见过形形色色的丧亲者。有人哭泣，有人愤怒，有人茫然失措。\n     \n     眼前这位伯爵夫人，什么都没有。\n     \n     \"克劳福德先生。\"她的声音带着轻微的意大利口音，元音略微拉长，辅音却咬得清晰，\"请坐。\"\n     \n     艾德蒙在对面的椅子上坐下，将礼帽放在膝上，\"夫人，首先请允许我表达——\"\n     \n     \"不必。\"她轻轻打断，语气并无无礼之意，只是简洁，\"埃德加已经死了。这是事实。我需要的不是慰问。\"\n     \n     艾德蒙停顿了一下，然后微微点头，\"那我直接说。您愿意配合调查吗？\"\n     \n     \"我不只是愿意配合。\"伊莎贝拉将目光从窗外收回，直视着他，\"我希望帮助您。\"\n     \n     \"帮助？\"\n     \n     \"埃德加有很多秘密。\"她的语速平稳，每个字都像是经过衡量，\"但他不是坏人。我希望真相被找到——真正的真相，不是霍奇警探那种粗糙的结论。\"\n     \n     艾德蒙观察着她的表情。她说\"秘密\"这个词时，眼神没有回避，但嘴角有一个细微的、几乎察觉不到的收紧。她知道什么——但她选择了她要说的话，而不是把知道的都说出来。\n     \n     他的目光不经意地落在她的手腕上。\n     \n     在黑色丧服的袖口边缘，露出一截纤细的银链。银链上挂着一个小小的坠饰——一朵玫瑰，花瓣精细，工艺考究，不像是普通的首饰。\n     \n     \"夫人，\"艾德蒙将视线移回她的脸，\"您提到伯爵有很多秘密。您愿意告诉我您知道的吗？\"\n     \n     伊莎贝拉沉默了片刻。\n     \n     \"我愿意带您参观画廊，\"她最终说，\"有些东西，比语言更容易解释。\"\n     \n     她站起身，动作流畅而优雅，\"但首先，克劳福德先生，我需要知道——您来这里，是为了找到真凶，还是只是为了给某人一个满意的答案？\"\n     \n     这个问题悬在空气里，比壁炉的暖意更令人感到灼热。\n     \n     艾德蒙手指轻叩了一下膝盖，做出了他的判断。", "title": "初次会面：伯爵夫人", "act": 1}, "node_05_trust": {"text": "画廊位于庄园二楼东翼，一条狭长的走廊，两侧悬挂着历代格雷夫顿伯爵的收藏。蜡烛壁灯将橙黄的光晕投在厚重的油彩上，令那些沉默的面孔看起来像是随时会开口说话。窗外的雾已经爬上了玻璃，将下午的天光滤成一片灰白。\n       \n       伊莎贝拉走在前面，步伐轻而稳，裙裾拂过打蜡的地板几乎无声。艾德蒙跟在她身后一步的距离，圆顶礼帽夹在臂弯下，眼神在每一幅画框与每一道阴影之间来回移动。\n       \n       她在走廊中段停下，回过头，用那双深棕色的眼睛扫了一遍来路，又扫了一遍前方。确认四下无人之后，她才转向艾德蒙，声音压得极低，带着那一点轻微的意大利腔调，却比平时更加清晰、更加用力。\n       \n       \"克劳福德先生，我只说一次。\"\n       \n       艾德蒙微微抬起下巴，手指在侧边轻轻叩了一下——那个习惯性的动作，他自己几乎没有察觉。\"我在听，夫人。\"\n       \n       \"我丈夫是一个组织的成员。\"她停顿了一下，像是在权衡那个名字值不值得说出口。\"他们自称——'玫瑰兄弟会'。\"\n       \n       那个名字落在走廊里，像一粒石子投入深井，没有回响，只有沉沉的寂静。\n       \n       \"在英国上流社会，\"伊莎贝拉继续说，语速均匀，没有任何多余的情绪，\"他们的影响力比你想象的更深。议员、法官、商人，甚至教会里的人。他们互相掌握彼此的秘密——这是他们维系彼此的方式。没有人能轻易离开。\"\n       \n       艾德蒙在心里快速整理着这些信息。\"而伯爵想离开？\"\n       \n       伊莎贝拉的嘴角动了一下，不是笑，更像是一种苦涩的确认。\"他在我们婚后三个月开始改变。他变得烦躁，夜里不睡觉，烧掉了很多文件。他告诉我，他犯了一个错误，他想退出。\"她的声音在\"退出\"这个词上微微收紧，\"然后威胁信来了。\"\n       \n       \"威胁信。\"艾德蒙重复这个词，手指再度叩了一下，\"您见过那些信？\"\n       \n       \"见过一封。\"她没有解释是如何见到的，\"信上没有署名。只有一枚玫瑰的蜡封。\"\n       \n       走廊深处，某扇窗户的合页因为风而发出一声轻响。伊莎贝拉的肩膀微微一紧，但她没有回头。她转而抬起手，指向走廊尽头挂着的一幅大画。\n       \n       那是一幅《圣母与玫瑰》，画面尺幅宏大，圣母低垂着眼帘，怀中抱着圣婴，周围散落着红色与白色的玫瑰。笔触细腻，年代看起来相当久远。艾德蒙走近了两步，在蜡烛光线下仔细打量——画框厚重，右下角的落款字迹有些模糊，但整幅画的光泽与龟裂纹路之间有一种微妙的不协调。\n       \n       \"答案在画里，\"伊莎贝拉说，声音更低了，几乎只是气声，\"但我——\"\n       \n       地板上传来脚步声。\n       \n       不是走廊里的——是楼梯口方向。那种沉稳而有力的步伐，每一步都踩得很实，像是一个习惯了控制自己存在感的人，此刻偏偏没有刻意压低动静。\n       \n       伊莎贝拉的嘴唇立刻合拢。她退后半步，神情在一瞬间从低声倾诉回归到了那种冷静而疏离的贵族姿态，仿佛刚才的一切对话从未发生过。\n       \n       管家拉扎罗·孔蒂出现在走廊入口。魁梧的身形几乎填满了门框，络腮胡下的表情一如既往地恭顺，但那双眼睛在落到伊莎贝拉与艾德蒙身上的瞬间，有什么东西快速地扫过，又快速地收起。\n       \n       \"夫人，\"他开口，声音低沉，带着浓重的口音，\"厨房问您晚餐的安排。\"\n       \n       \"我随后去。\"伊莎贝拉的语气平静而简短，没有一丝多余的波动。\n       \n       拉扎罗点了点头，目光在艾德蒙身上停留了整整两秒，然后转身，脚步声沿着楼梯重新消失在楼下。\n       \n       走廊里恢复了寂静。艾德蒙没有立刻说话，他的视线停在《圣母与玫瑰》上，停在那些散落的红色花瓣上，停在圣母低垂的眼帘上。他的手指轻轻叩了叩自己的下巴。\n       \n       拉扎罗刚才的眼神——那不是一个管家在打量不速之客时应有的眼神。那是一种评估，一种戒备，甚至，一种警告。\n       \n       伊莎贝拉已经开始往走廊另一端走去，裙裾重新无声地拂过地板。她没有再回头，但在经过艾德蒙身边的瞬间，她的声音轻得像是自言自语：\n       \n       \"克劳福德先生，在这座庄园里，相信任何人之前——先想清楚，他站在谁那一边。\"", "title": "信任路线：画廊的秘密", "act": 2}, "node_05_suspect": {"text": "艾德蒙没有立刻返回客厅。\n       \n       他站在走廊尽头，让伯爵夫人优雅的背影消失在转角之后，才缓缓取下礼帽，以拇指轻轻摩挲帽沿。伊莎贝拉·格雷夫顿的每一个字都像精心打磨过的宝石——光洁，坚硬，不留缝隙。这本身就令人生疑。\n       \n       走廊里飘着淡淡的蜡烛烟气与陈年木料的气息。格雷夫顿庄园的二楼走廊比楼下更为逼仄，两侧挂满了深色调的油画，画中人物的眼睛似乎都在随着来访者移动。艾德蒙重新戴上礼帽，沿走廊慢慢踱步，靴跟踩在橡木地板上发出有节律的轻响。\n       \n       他在转角处停下了。\n       \n       一个金发女孩正跪在地板上，用一块深色抹布反复擦拭同一块地砖，力道大得不像在清洁，更像是在用这个动作压制什么。她的手指绞着围裙一角，指节因为用力而泛白。艾德蒙认出了她——艾米莉·沃特斯，庄园的女仆，今晨在门厅匆匆见过一面。\n       \n       \"艾米莉小姐。\"\n       \n       她猛地抬头，抹布从手里滑落，拍在地板上。\"克——克劳福德先生。\"她站起身，低着头，手指立刻又去找围裙的边缘。\"对不起，我没有注意到您。\"\n       \n       \"不必道歉。\"艾德蒙刻意放缓了语气，在她面前停下，保持着一段令人安心的距离。\"我只是想随便走走，熟悉一下庄园的格局。\"他顿了顿，目光不经意地扫过她的神情——那种紧绷不是面对陌生人的局促，而是更深的、更久的东西。\"你在这里工作多久了？\"\n       \n       \"三年了，先生。\"\n       \n       \"那你对庄园很熟悉。\"他轻描淡写地说，\"案发那晚，你在哪里？\"\n       \n       她的肩膀明显僵了一下。\"我……我在自己的房间，先生。\"\n       \n       艾德蒙没有立刻追问。他转过身，若无其事地打量起走廊上挂着的一幅风景画——一片苏格兰高地的荒原，画框厚重，颜色已经暗沉。\"这幅画，\"他随口说，\"挂得有些歪。\"\n       \n       艾米莉没有回答。\n       \n       艾德蒙侧过头，以一种近乎漫不经心的语气继续道：\"艾米莉，我不是警探霍奇。我不会把你说的话用来为难你。\"他停顿了一下，让这句话沉进去，\"但如果有人在那夜死去之前，庄园里还有不该在场的人——这件事很重要。你明白吗？\"\n       \n       沉默持续了将近十秒。走廊尽头，窗外的风把一枝常青藤拍在玻璃上，发出细碎的声响。\n       \n       \"我……\"艾米莉的声音细如蚊鸣，\"我那晚不是在房间里。我睡不着，就出来倒水。大概是……十点半，或者快十一点。\"她咬住下唇，\"我走过书房那边的走廊，就看到……\"\n       \n       \"看到什么？\"\n       \n       \"一个男人。\"她的手指死死攥住围裙，\"我不认识他。不是庄园里的人，先生，我在这里三年，认得每一张脸。他从书房那边走过来，走得很快，头压得很低，然后就……就从楼梯那边消失了。\"\n       \n       艾德蒙的手指不自觉地抬起，轻叩了一下下巴。\"你去告诉霍奇警探了吗？\"\n       \n       \"没有。\"艾米莉的声音更低了，几乎像是一口气漏出来的，\"威廉先生……霍奇先生，他第二天早上把我们都叫到一起，说……说让我们不要多嘴，说案子自有警方处理，说仆人多说话只会给自己招麻烦。\"\n       \n       艾德蒙没有动，但他感到某种东西在胸腔里收紧了。\n       \n       *威廉叫仆人噤声。*\n       \n       一个主持调查的警探，在案发翌日，第一件事是封住仆人的嘴。这不是办案的逻辑，这是掩盖的逻辑。\n       \n       \"你做得对，告诉我。\"他平静地说，语气里没有任何夸大的安慰，\"你能描述那个男人的样子吗？年纪、身形、衣着？\"\n       \n       \"走廊里光线很暗……\"艾米莉皱起眉，努力回忆，\"他穿着深色大衣，不是仆人的制服。身形……比较高，比拉扎罗先生瘦。年纪……我说不准，但不像老人，走路很快。\"\n       \n       艾德蒙默默记下每一个细节。他感谢了艾米莉，叮嘱她不必声张，随后目送她提着抹布匆匆离去，那背影像一只受惊的鸟。\n       \n       他转回身，重新打量那幅风景画。\n       \n       这一次，他走近了。\n       \n       画框的左侧与墙面之间，有一道极细的缝隙，不仔细看会以为是岁月造成的松动。但艾德蒙蹲下身，在腰线高度发现了更明显的痕迹——地板上有一道浅浅的弧形划痕，木料的颜色略深，是长期摩擦留下的。画框被移动过，而且不止一次。\n       \n       他站起身，用指尖轻轻推了推画框的右侧。\n       \n       画没有动，但他感到了墙壁后面传来的一丝空洞的回响。\n       \n       *隐藏通道。*\n       \n       艾德蒙退后一步，将这一切在脑中重新排列：一个陌生男人，夜间十点半，从书房方向离开，消失于楼梯。一个警探，案发翌日，第一时间封住仆人的嘴。一条隐藏通道，藏在走廊画框之后，通往不知何处。\n       \n       他重新戴正礼帽，沿走廊向楼梯口走去，步伐沉稳，神情冷静。\n       \n       但他的手指，正在衣袖内侧轻轻叩击着。", "title": "怀疑路线：女仆的秘密", "act": 2}, "node_06": {"text": "艾德蒙在后院的马厩旁找到了拉扎罗·孔蒂。\n       \n       管家正在指挥一名年轻仆役搬运柴木，背对着来路。他的身形高大魁梧，黑色的管家制服绷在宽阔的肩膀上，络腮胡修剪得整齐，但眼角的皱纹比他的年纪应有的更深。艾德蒙在他身后停下来，观察了片刻。\n       \n       拉扎罗的靴子。\n       \n       书房壁炉旁的地面有一种特殊的白色石灰粉末——那是老式壁炉底座的材料，年久风化后会在周围留下细密的白色粉尘，与庄园其他地方的灰尘颜色和质地都不同。艾德蒙在书房勘查时已经注意到了。\n       \n       而拉扎罗的左靴靴底，在阳光下清晰可见，有一层薄薄的白色附着物。\n       \n       \"孔蒂先生。\"\n       \n       拉扎罗转过身。他的表情没有什么变化——只是那种职业性的恭顺，眼神平稳，\"克劳福德先生，有什么吩咐？\"\n       \n       \"我想和您谈谈昨晚的事。\"\n       \n       \"是的，先生。我昨晚十点就寝，没有听到任何异常。\"\n       \n       艾德蒙点了点头，像是接受了这个答案，在他旁边的木栏上坐下来，语气随意，\"昨晚睡得好吗？\"\n       \n       \"很好，先生。\"\n       \n       \"那很难得。\"艾德蒙停顿，\"我自己昨晚在马车上颠了一夜，睡得很差。有时候人即使躺下了，心里有事，也睡不踏实。\"\n       \n       拉扎罗没有接话。但他的手，悄悄地向外套口袋的方向移了一寸，随即停住了。\n       \n       艾德蒙的眼神捕捉到了这个动作。外套口袋里有东西——纸张的轮廓，折叠过的，有厚度。\n       \n       \"孔蒂先生，\"艾德蒙的语气不再随意，\"您靴子上的白色粉末，和书房壁炉旁地面上的成分完全一致。我在爱丁堡学过法医学，这种比对不会出错。\"\n       \n       沉默。\n       \n       拉扎罗的表情没有崩溃，但眼神里有什么东西变了——不是恐惧，更像是一种沉重的权衡。他看着艾德蒙，像是在评估这个年轻侦探究竟知道多少，又究竟是什么人。\n       \n       \"您昨晚进入了书房。\"艾德蒙平静地说，\"伯爵死亡时间是昨晚十一点。我需要您告诉我，您是什么时候进去的，看到了什么。\"\n       \n       又是一段沉默。远处有乌鸦的叫声，从庄园东侧的树林里传来，沙哑而短促。\n       \n       拉扎罗终于开口，声音低沉，\"我进去的时候……伯爵已经死了。我没有杀他。\"\n       \n       \"那您为什么进去？\"\n       \n       管家的嘴唇抿紧，没有回答。\n       \n       艾德蒙看着他，手指轻叩着木栏，思考着下一步该怎么走。", "title": "拉扎罗的审问", "act": 2}, "node_07a": {"text": "沉默在书房里拉得很长。\n         \n         艾德蒙没有催促。他只是站在那里，目光平静地落在拉扎罗宽阔的肩膀上，等待着那堵墙开始松动。壁炉里的煤炭发出低沉的爆裂声，窗外的雾气已经将庄园的花园彻底吞没，只剩下模糊的灯影在白茫茫中漂浮。\n         \n         \"夫人让你配合我。\"艾德蒙最终开口，语气平稳，没有威胁，只是陈述一个事实，\"你比任何人都清楚，她现在需要的不是沉默。\"\n         \n         拉扎罗的喉结动了一下。那双布满老茧、有着陈旧伤疤的大手缓缓抬起，伸向了他外套的内衬口袋——那个位置，常人放怀表，他却放着别的东西。\n         \n         他取出的是一叠折叠整齐的纸张，边缘已经微微磨损，像是被人反复触碰过。他将它放在书桌上，没有说话，只是退后了半步。\n         \n         艾德蒙走上前，展开那叠纸。\n         \n         是手写的。墨迹是伯爵惯用的深蓝色，字迹工整却带着隐约的颤抖——那种颤抖不像是年迈，更像是某种长期压抑的紧绷。纸页上罗列着一列名字，整整二十三个，每个名字旁边附着职衔、地址，以及一个艾德蒙看不懂的符号——一朵简化的玫瑰图案，用极细的笔触勾出。\n         \n         他的目光顺着名单往下移动。商人。议员。法官。银行家。一张隐藏在伦敦体面社会深处的关系网，用这张薄薄的纸页呈现出来，竟显得格外触目惊心。\n         \n         然后他的视线停住了。\n         \n         *威廉·霍奇。苏格兰场警探。*\n         \n         艾德蒙沉默了片刻，手指轻轻叩了叩下巴。那个习惯性的动作，此刻带着一种近乎机械的迟缓。他重新看了一遍那个名字，确认自己没有看错，然后才慢慢抬起头。\n         \n         \"霍奇。\"他轻声念出来，不像是在问拉扎罗，更像是在问自己。\n         \n         许多事情在这一刻骤然咬合。霍奇对他的敌意，那些刻意的拖延，那些被轻描淡写带过的细节——那不只是老派警察对外来者的排斥，那是一个人在竭力保护自己。\n         \n         \"拉扎罗，\"艾德蒙放下文件，转向那个沉默的管家，\"你进入书房的时候，他已经死了。\"\n         \n         不是疑问句。\n         \n         拉扎罗点了点头，缓慢而沉重，像是放下了一块压在胸口许久的石头。\"是的，先生。\"他的声音低沉，带着浓重的口音，\"门是虚掩的。我进去……地上有文件，散落着。伯爵在椅子上，已经……\"他停顿了一下，\"我捡起文件，离开了。我没有看到任何人。\"\n         \n         \"虚掩的。\"艾德蒙重复这个词，眉头微微皱起，\"但发现时是从内部锁死的。\"\n         \n         \"是的，先生。\"\n         \n         \"那意味着，在你离开之后，有人进去了，并且从里面锁上了门。\"\n         \n         拉扎罗没有回答，但他的沉默本身就是一种确认。\n         \n         艾德蒙重新看向那份名单，目光在威廉·霍奇的名字上停留了一秒，然后小心地将纸张重新折好，收入自己的内袋。壁炉里的火光跳动，将他的影子拉得很长，投在身后那幅阴暗的油画上。\n         \n         阴谋的轮廓正在黑暗中一点一点显出形状，像是浓雾散去前那一刻，你终于看清了远处的礁石。", "title": "文件揭秘", "act": 2}, "node_07b": {"text": "沉默在审问室里积压成形，几乎有了重量。\n         \n         艾德蒙将那张纸——走廊油画被移动过的痕迹素描，以及他在书房地毯上发现的一枚不属于伯爵的黄铜纽扣——并排推到桌面中央。他没有说话。他只是用两根手指轻轻叩了叩桌沿，目光落在拉扎罗的手背上，落在那道横贯掌心、早已泛白的旧疤上。\n         \n         拉扎罗坐在对面的硬木椅上，魁梧的身形却像一座被侵蚀的礁石——表面纹丝不动，内里已有裂隙。他的络腮胡掩住了嘴角的细微变化，但眼睛出卖了他：那双眼睛扫过纸上的素描，停顿了将近三秒。\n         \n         \"案发当夜，\"艾德蒙平静开口，\"您进入过书房。\"\n         \n         不是疑问句。\n         \n         又是沉默。窗外的风将常青藤拍打在石墙上，发出断续的、类似指节敲门的声响。壁炉里的炭火烧得很低，橙红的光在两人脸上投下不稳定的阴影。\n         \n         \"是的，先生。\"\n         \n         艾德蒙几乎没有表情，但胸腔里有什么东西收紧了。他等待着。\n         \n         拉扎罗的视线从纽扣移开，移向壁炉，在那里停留了片刻——那是一种艾德蒙无法完全解读的眼神，像是在做某种内心的权衡，像是在用一根无形的尺子丈量开口的代价与沉默的代价，究竟哪一个更重。\n         \n         然后他开口，声音低沉，字句之间有意留出了间距：\n         \n         \"书房的壁炉……不只是壁炉。\"\n         \n         艾德蒙的手指停在了桌沿上。\n         \n         他没有追问——他知道追问只会让这扇门重新关上。他只是保持着那个姿势，让这句话在脑中缓缓展开，像一张被折叠多次的地图，每展开一层就多出一段此前看不见的地形。壁炉。书房。从内部锁死的门。唯一的钥匙在死者口袋里。\n         \n         *不只是壁炉。*\n         \n         那意味着另一条路。一条不需要钥匙的路。\n         \n         他想起勘查现场时的细节——书房壁炉台面上那一层极薄的灰尘，与炉膛周围地砖上细微的磨损痕迹之间的矛盾。他当时将其归因于日常清扫的疏漏，现在那个解释像纸糊的一样塌陷了。\n         \n         \"您在书房里做了什么？\"艾德蒙的语气依然平稳，像是在讨论天气。\n         \n         拉扎罗的嘴唇动了动，最终合上。他低下头，大手交叠放在膝上，那道旧疤在昏黄的光线里显得格外清晰。\n         \n         \"是的，先生。\"这一次，这句话是一堵墙。\n         \n         艾德蒙在椅子上向后靠了靠，用拇指和食指慢慢捏了捏下颌。他能感觉到挫败感像砂砾一样摩擦着某处，但他同时也清楚——拉扎罗不是在说谎。这个人在选择他愿意说出口的那部分真相，然后用沉默将其余的部分砌成一道墙。这种谨慎本身就是一种信息：他在保护某人，或者某件事，而那件事的重量足以让他在证据面前也不肯松口。\n         \n         *他不怕我。他怕的是别的什么。*\n         \n         艾德蒙的思路转向了威廉·霍奇。老警探在庄园里的一举一动都透着一种奇特的分寸感——他介入，却又不真正深挖；他质问，却在某些方向上戛然而止。此刻，拉扎罗的这种谨慎与威廉的那种分寸感在艾德蒙脑中叠合在一起，产生了一种令人不安的共鸣。\n         \n         *这个案子里，知道得越多、越不敢说话的人，似乎都对威廉有所顾虑。*\n         \n         他站起身，拿回桌上的两张纸，将它们折好放入外套内袋。他没有再看拉扎罗，只是在转身走向门口时，轻声说了一句：\n         \n         \"壁炉的事，我会自己去查。\"\n         \n         他听到身后拉扎罗沉重地呼出一口气——那声音里有什么东西，不完全是释然，也不完全是担忧，而是两者奇异地混合在一起，像是一个人在黑暗中放开了一根他攥得太久的绳子，却并不知道另一端连着什么。\n         \n         艾德蒙推开门，走进走廊。石灰墙壁散发着潮湿的冷意，煤气灯的火苗在穿堂风里微微摇曳。他在走廊尽头停下脚步，抬起手指，轻叩了两下下颌。\n         \n         他得到的不多。一句话，一个方向，一道还没有找到开关的门。\n         \n         但有时候，一道门本身就已经是答案的一部分了。", "title": "半真半假的供词", "act": 2}, "node_07c": {"text": "艾德蒙放轻了脚步。\n         \n         走廊里的煤气灯将拉扎罗的影子拉得很长，那道黑影在石板地面上滑动，转过楼梯拐角，消失进画廊深处。艾德蒙数了三秒，才跟了上去。\n         \n         画廊是庄园里最安静的地方。两排高窗此刻被夜色封死，只有墙上的壁灯在油画之间投下昏黄的光晕。那些画——伯爵一生搜罗的所谓名作——在半明半暗中俯视着来人，神情暧昧。艾德蒙贴着墙壁移动，皮靴踩在厚实的波斯地毯上，几乎没有声响。空气里有松节油的气味，还有一丝更古老的、说不清楚的霉意，像是某种被压在画布下面的秘密正在缓慢腐烂。\n         \n         拉扎罗停在了画廊最深处。\n         \n         那幅画挂在正中央——《圣母与玫瑰》，尺幅不大，画面里的圣母神情肃穆，膝上搁着一束深红色的玫瑰。艾德蒙认出这幅画：他在现场勘查时扫过一眼，当时只觉得画风比周围几幅都要古朴，并未多想。此刻他躲在一尊大理石半身像的阴影里，屏住呼吸，看着拉扎罗缓缓抬起右手。\n         \n         那只手的手背上有旧疤——月光从高窗斜射进来，那道疤痕显得格外清晰。\n         \n         拉扎罗的手指触碰了画框的右下角。\n         \n         极轻微的机械咬合声。\n         \n         画框弹开了——不是整幅画，只是外层的镶边框架，向外旋出一道缝隙，露出背后一个浅浅的隔层。黑暗中，艾德蒙看见拉扎罗伸手探入，取出一个信封。信封鼓胀，封口已被拆开过，又重新压合，边缘微微起皱。\n         \n         就在这一刻，拉扎罗的动作僵住了。\n         \n         他没有回头，只是静止了两三秒。然后，他慢慢地转过身来。\n         \n         两人对视。\n         \n         壁灯的光从侧面打来，拉扎罗的脸一半明亮，一半沉在阴影里。他的眼睛很平静——不是被抓包时的慌乱，而是某种更深的、评估性的平静，像是一个经历过更危险处境的人，正在重新权衡眼前这个局面。艾德蒙没有动，也没有开口。他的手指在大腿侧轻轻叩了叩，一下，两下。\n         \n         沉默持续了漫长的十数秒。\n         \n         拉扎罗先开口了，声音低沉，带着他一贯的浓重口音，却比平时多出了几分疲倦：\n         \n         \"您跟了多久，先生？\"\n         \n         \"从您离开仆人室开始。\"艾德蒙如实回答。\n         \n         拉扎罗盯着他看了片刻，然后——出乎意料地——叹了口气。那口气很重，像是放下了什么东西。他低下头，看了看手里的信封，再抬起眼睛，将信封向前递出。\n         \n         \"夫人说过，\"他的声音平稳，\"您是可以信任的人。\"\n         \n         艾德蒙没有立刻接。他看着拉扎罗的眼睛，试图判断这句话背后的分量——这是真心话，还是另一种试探？但拉扎罗的神情没有给他答案，那张布满络腮胡的脸像一堵墙，只透出那一句话，不多，也不少。\n         \n         艾德蒙接过了信封。\n         \n         信封入手，他感觉到里面有数张折叠的纸页，边缘硬挺，像是正式的文书。他没有当场拆开，只是将信封收入大衣内袋，目光重新落回拉扎罗身上。\n         \n         \"伯爵夫人知道这个隔层的存在？\"\n         \n         \"是的，先生。\"\n         \n         \"她知道我今晚会看到这一切？\"\n         \n         拉扎罗沉默了一秒，算是默认。\n         \n         艾德蒙轻轻叩了叩下巴。伊莎贝拉·格雷夫顿，他想，你比我以为的更早开始布局了。这个发现让他心里多出一种说不清是钦佩还是警惕的情绪。她没有直接把文件交给他——她让拉扎罗藏着，等他自己找到。这是一种考验，也是一种筛选。\n         \n         画廊里，圣母的眼睛在昏黄灯光下俯视着这一切，神情一如既往地肃穆。那束深红色的玫瑰静静地躺在她膝上，花瓣的每一道纹路都清晰得像是某种无声的警告。", "title": "跟踪：画廊的秘密", "act": 2}, "node_08": {"text": "夜幕降临时，格雷夫顿庄园变得更加沉默。\n         \n         艾德蒙坐在客房的书桌前，将所有的线索在脑海中重新排列。壁炉里的燃烧痕迹。窗框上的细线划痕。拉扎罗靴底的石灰粉末。那封中断的信。伊莎贝拉手腕上的玫瑰银坠。\n         \n         还有一个反复出现的细节，像是一根刺扎在他的思绪里——书房壁炉。\n         \n         那个壁炉太大了。大到不成比例，大到与书房的整体风格有些格格不入。维多利亚时代的书房壁炉通常是装饰性与功能性并重的，但格雷夫顿书房的壁炉深度比寻常的至少多出三分之一。\n         \n         艾德蒙在纸上画了一张简图，标出书房的位置，标出壁炉，然后标出庄园的整体结构。\n         \n         他停下笔。\n         \n         壁炉后面，按照建筑结构推算，应该是……空的。或者说，不应该有空间——但实际上，那里有空间。\n         \n         地下室。\n         \n         庄园最古老的部分，建于十七世纪，后来的扩建将它半掩在地基之下。伯爵的私人物品据说存放于此。但更重要的是——如果壁炉后有隐藏通道，那么凶手完全可以从地下室进入书房，完成谋杀，然后原路返回，将书房留在一个完美密封的状态。\n         \n         密室，就此成立。\n         \n         艾德蒙放下笔，靠在椅背上，闭目片刻。这个推断需要验证。而验证的唯一方式，就是亲自进入地下室。\n         \n         问题在于：书房仍是案发现场，威廉在走廊安排了值班警员，轮班制，整夜都有人。白天进入几乎不可能。\n         \n         深夜是唯一的窗口。\n         \n         他站起身，走到窗边，看着庄园的黑暗庭院。今夜无月，云层厚重，只有主楼入口的煤气灯在雾中晕出昏黄的光圈。\n         \n         他必须决定了。\n         \n         独自行动——快速，不惊动任何人，但地下室的情况完全未知，如果有人在等待，他一个人的处境将极为危险。\n         \n         联系威廉——官方力量，有备无患，但这个老警探究竟站在哪一边？艾德蒙想起他在书房时那种奇特的消极态度，想起他对案件某些细节时眼神里一闪而过的什么……\n         \n         或者，请伊莎贝拉，或者拉扎罗。他们了解这栋建筑，了解那条通道，了解地下室里有什么。但这需要信任——真正的信任，不是策略性的合作。\n         \n         艾德蒙的手指在窗台上叩了三下，停下来。\n         \n         时间不多了。", "title": "地下室的抉择", "act": 2}, "node_09_solo": {"text": "午夜的格雷夫顿庄园沉入了一种令人窒息的静默。\n           \n           艾德蒙·克劳福德将烛台举得更高，棕色的眼瞳在跳动的火焰中收缩成一条细线。书房里的一切都像一幅被时间定格的油画——翻乱的抽屉，倾倒的墨水瓶，以及那张伯爵最后坐过的皮椅，在昏黄烛光下投出一个空洞的影子。他独自一人。这是他自己的选择。\n           \n           *壁炉。*\n           \n           他的手指轻叩了一下下巴，目光落在书房西侧那座哥特式壁炉上。炉台上雕刻着攀援的玫瑰纹样——他现在知道那意味着什么了。他蹲下身，将烛台凑近炉壁右侧的基石，用指腹沿着砖缝仔细触摸，直到感觉到一处轻微的松动。\n           \n           他按下去。\n           \n           低沉的机械摩擦声从墙壁深处传来，像一声压抑的叹息。壁炉左侧的一段墙面向内退缩了几寸，随即整块旋转，露出一条向下延伸的石阶通道。\n           \n           艾德蒙站在入口处，感受着从深处涌上来的冷气——那是一种带着霉味与潮湿气息的寒意，像某种古老秘密的呼吸。他深吸一口气，迈步走了进去。\n           \n           石阶陡而狭窄，每一步都发出轻微的回响。烛焰在通道里被气流压得几乎贴地，他不得不用手掌护住火苗，弓着身子一步一步往下走。十二级台阶，然后是一扇低矮的拱形木门，铁锁已经生锈，但门虚掩着——有人来过，而且不久前才来过。\n           \n           地下室比他想象的要大。\n           \n           烛光勉强照亮了一个半圆形的空间，穹顶由粗糙的砖石砌成，墙壁上渗着水迹，在烛光下泛出暗淡的光泽。空气潮湿而沉重，每一次呼吸都像是在吸入泥土与腐木的气息。艾德蒙站定片刻，让眼睛适应昏暗，然后开始扫视四周。\n           \n           角落里堆着几个木箱，包装材料从箱缝里溢出——那是厚实的亚麻布和防潮的油纸，正是用于运输大型画作的规格。他拿起一块油纸，凑近细看，上面还残留着颜料的痕迹：赭石色与群青，与书房墙上那幅\"疑似赝品\"的风景画色调完全吻合。他的心跳加快了一拍。\n           \n           *被盗画作。不是赝品——是真迹，而且已经被人取走了。*\n           \n           他继续搜索。在一只翻倒的铁皮盒旁，他发现了那根细线。\n           \n           他蹲下身，用手帕小心翼翼地将它拾起，凑近烛火。那是一根钢琴弦，细如发丝，却韧如钢铁。弦的两端各有一个小小的金属套环——专门用于收紧、勒紧的设计。他的喉咙发紧。伯爵颈部的那道细痕，法医报告里描述为\"锐利且均匀的勒痕\"，与这根弦的粗细完全吻合。\n           \n           *这就是凶器。*\n           \n           他将钢琴弦用手帕包好，揣入上衣内袋，继续向里走。在一张布满灰尘的矮桌上，他找到了那封信。\n           \n           信封已经拆开，信纸叠成三折。他展开来，烛光照亮了那几行简短的字迹：\n           \n           *\"任务完成。货款请按约定汇至指定账户。玫瑰已凋，根系犹存。——致H先生。\"*\n           \n           艾德蒙盯着那个字母看了很久。*H。*不是凶手本人写的——是凶手写给雇主的回执。真正下令杀死伯爵的人，藏在这个字母背后。他将信纸折好，正要放入口袋——\n           \n           砰。\n           \n           身后传来沉重的撞击声，随即是石头与石头咬合的低鸣。他猛地转身，烛焰在他急促的动作中剧烈摇曳，险些熄灭。\n           \n           通道入口消失了。\n           \n           那扇旋转的墙壁重新合拢，严丝合缝地嵌回了原处，仿佛从未打开过。\n           \n           地下室陷入了一种更深的静默——但那静默并不完整。从黑暗的某个角落，艾德蒙听到了脚步声。\n           \n           缓慢的，沉稳的，毫不慌乱的脚步声。\n           \n           他将烛台举高，手心已经渗出了一层薄汗。烛光的圆圈向四周扩散，却始终触不到那片黑暗的边缘。他的呼吸变得刻意而克制，大脑在飞速运转：*出口被封死。呼救——地下室隔音，没有人会听到，而且只会暴露位置。藏入阴影——但烛光会出卖他。熄灭蜡烛——那样他将与来者同处黑暗，公平，但危险。*\n           \n           脚步声越来越近。\n           \n           他必须做出决定。", "title": "独行者的地下室", "act": 3}, "node_09_william": {"text": "地下室的入口隐藏在一幅巨大的风景画后面，石阶向下延伸，消失在油灯光芒触及不到的黑暗里。艾德蒙举着灯，侧身走在前面，脚步踩在潮湿的石板上发出沉闷的回响。威廉·霍奇跟在他身后，大衣下摆扫过台阶，呼吸平稳得出奇。\n           \n           \"霍奇警探，\"艾德蒙没有回头，\"您对格雷夫顿庄园的地下结构似乎相当熟悉。\"\n           \n           \"干了三十年这行，\"威廉的声音在石壁间回荡，带着一丝懒散，\"什么样的宅子没见过。\"\n           \n           艾德蒙没有再说话。油灯的火焰在气流中轻轻摇曳，将两人的影子拉得细长而扭曲，投在粗粝的砖墙上。地下室的气味扑面而来——陈年的潮气、腐烂的木料，还有一种艾德蒙辨认不出的、带着金属味的气息。\n           \n           他们走到底部。这是一间低矮的石室，四壁堆放着落满灰尘的箱子和酒架，角落里有一张旧桌子，上面散落着几根蜡烛的残骸。唯一的通道入口就在身后的台阶处。\n           \n           身后传来沉重的铁闩声。\n           \n           艾德蒙猛地转身。\n           \n           威廉·霍奇站在台阶底部，背对着已经锁死的通道门，神情平静得如同一块石头。他的右手垂在身侧，指间缠绕着一根细细的银线——在油灯光芒下反射出冷冽的光泽。那是钢琴弦。\n           \n           艾德蒙的目光在那根弦上停了一秒，随即抬起，与威廉的眼睛正面相对。他感到脊背上有什么东西收紧了。\n           \n           \"你查得太深了，克劳福德先生。\"威廉的声音没有任何起伏，像是在谈论天气，\"这不是个适合年轻人的案子。\"\n           \n           \"伯爵，\"艾德蒙的声音比他预想的更稳，\"是您亲手处理的。\"\n           \n           不是疑问句。\n           \n           威廉轻轻点了点头，嘴角浮现出一丝几乎算不上微笑的弧度。\"他要出卖我们所有人。三十年的经营，三十年建立起来的网络——他打算一股脑儿卖给政府，换取自己的安全。\"他顿了顿，\"这种人，不能留。\"\n           \n           石室里的空气像是凝固了。艾德蒙的大脑飞速运转：通道已锁，威廉堵在唯一的出路前，手中握着与凶器相同的钢琴弦。那个人在苏格兰场浸淫了三十年，见过的死亡比他见过的案件还多。\n           \n           油灯的火焰跳动了一下，两人的影子在墙上交叠、分离。\n           \n           威廉将钢琴弦在手指间绕了一圈，慢慢向前走来。\n           \n           **现在，艾德蒙必须做出选择。**\n           \n           1. 你早有防备，立即反击并逃向另一侧通道\n           2. 试图用语言拖延时间，等待机会", "title": "威廉的陷阱", "act": 3}, "node_09_guided": {"text": "拉扎罗举起油灯，示意艾德蒙跟上。\n           \n           那盏灯发出的光晕在狭窄的通道里摇曳不定，将两人的影子拉得细长，贴着粗粝的石壁蜿蜒而去。通道低矮，艾德蒙不得不微微弓背，圆顶礼帽的帽檐几次蹭过头顶裸露的砖拱。空气里弥漫着潮湿、霉味与某种更古老的气息——像是被长久封存的秘密，终于在这一刻开始渗漏。\n           \n           \"小心脚下。\"拉扎罗低声说，声音在石壁间轻微回响。他的步伐稳健，显然对这条路并不陌生。\n           \n           艾德蒙跟着他拐过一个直角弯，通道骤然开阔了一些。就在这里，拉扎罗停下脚步，将油灯举向右侧墙壁。\n           \n           艾德蒙看见了它。\n           \n           一根细线，挂在一枚锈迹斑斑的铁钉上，几乎与石壁的颜色融为一体。他伸手摘下，在灯光下仔细端详——不足两英尺长，金属质地，纤细却韧劲十足，两端各有一个小小的绕圈，像是专门为了方便握持而制作的。\n           \n           \"钢琴弦。\"他轻声说出这三个字，手指轻叩了两下下巴。\n           \n           \"是的，先生。\"\n           \n           艾德蒙将那根弦在指间绕了一圈，脑海中开始快速拼合碎片。他抬起头，目光扫过通道前方隐约可见的一扇低矮木门——那应当就是通往书房的入口。他走过去，蹲下身，仔细检视门缝与合页。门框边缘有极细微的划痕，漆面剥落处露出铜色的底，新旧程度与周围的陈年磨损截然不同。\n           \n           \"凶手从这里进入书房，\"他缓缓开口，语气像是在自言自语，又像是在向拉扎罗确认，\"杀死伯爵之后，从窗户——\"\n           \n           \"从通风窗。\"拉扎罗接过话头，走到他身旁，用粗壮的手指指向木门左上角的位置，\"书房有一扇通风窗，从外头只能伸进一只手。凶手将这根弦穿过窗缝，套住门锁的舌头，然后……\"他做了一个缓慢收拢的手势，\"从外头把锁舌拨进锁孔，再把弦抽回来。\"\n           \n           \"书房便成了一间从内部锁死的密室。\"艾德蒙站起身，将那根钢琴弦收入外套内袋，\"而凶手，已经通过这条通道离开，不留任何痕迹。\"\n           \n           沉默片刻。油灯的火苗轻轻跳动。\n           \n           \"拉扎罗，\"艾德蒙转过身，直视那双深色的眼睛，\"你说你当夜进入过书房。你离开的时候，伯爵还活着？\"\n           \n           \"活着。\"拉扎罗的回答没有任何迟疑，\"我取走了文件，从通道出去。那时候……\"他停顿了一下，喉咙里发出一声低沉的声音，像是什么东西梗在那里，\"那时候我在通道里听到了脚步声。从我后面来的脚步声。\"\n           \n           艾德蒙的手指停止了轻叩的动作。\n           \n           \"你看到了？\"\n           \n           \"背影。\"拉扎罗说，声音压得更低，\"我躲进了侧面的凹槽。他没有发现我。他走向书房那扇门，推开，进去了。\"\n           \n           \"他穿着什么？\"\n           \n           拉扎罗将油灯向上举了举，光线照亮了他脸上深刻的沟壑。他的表情没有变化，但那双眼睛里有什么东西沉了下去。\n           \n           \"警察的制服，先生。\"\n           \n           艾德蒙没有立刻说话。\n           \n           那三个字落在潮湿的地下通道里，像一块石头沉入深水，激起的涟漪向四面八方扩散开去——威廉·霍奇，五十二岁，苏格兰场警探，第一个抵达现场的人，封锁了书房，主导了调查，对每一个质疑他结论的人投以傲慢的敌意。那个收受过伯爵贿赂、害怕真相暴露的男人。\n           \n           艾德蒙闭了闭眼。他感到一阵近乎眩晕的震撼，随即被一股冷静而清醒的愤怒所取代，从胸腔深处升起，稳稳地压住了那份震撼。\n           \n           他睁开眼睛，目光落在手中那根钢琴弦的轮廓上——那是他外套内袋里微不可察的一道弧线。\n           \n           \"谢谢你，拉扎罗。\"他的声音平稳，甚至带着一丝刻意的克制，\"现在，我需要你告诉我，你愿意在必要的时候，将今晚的一切当着所有人的面再说一遍吗？\"\n           \n           拉扎罗沉默了足足五秒钟。然后，他将油灯在手中换了个方向，朝着通道出口迈出了第一步。\n           \n           \"跟上，先生。\"\n           \n           艾德蒙跟了上去。他知道这不是拒绝。", "title": "引路人：完整的真相", "act": 3}, "node_dead_basement": {"text": "艾德蒙在黑暗中暴露了位置。来者是玫瑰兄弟会派来的清道夫——一个沉默的男人，手法与杀死伯爵的凶手如出一辙。艾德蒙的调查笔记被没收，他本人永远留在了地下室。三天后，庄园以'年轻侦探意外失踪'结案。\n\n独自行动+恐慌暴露位置，被组织清道夫杀死\n\n黑暗中的挣扎，钢琴弦的寒意，然后是永恒的沉默。强调孤立无援的悲剧感。", "title": "地下室的沉默", "act": 3}, "node_dead_william": {"text": "艾德蒙的言辞拖延策略失败。威廉冷笑着说：'我在苏格兰场干了三十年，见过太多以为能靠嘴皮子脱身的人。'随后他动手。艾德蒙的死被伪造成'意外坠入地下室'。威廉继续掌控案件，将所有证据指向拉扎罗，将其投入监狱。案件以'意大利管家杀人、畏罪自尽'结案。\n\n线索不足+轻信威廉，被凶手反杀\n\n强调威廉的职业冷静与残忍，以及错误信任权威的代价。", "title": "警探的手", "act": 3}, "node_10_survive": {"text": "客房的门关上时，艾德蒙靠在门板上，深吸了一口气。\n             \n             他的外套上还有地下室的尘土，靴子底部带着潮湿石地板的气息。手里握着的文件已经被他塞进内衬口袋，纸张在心跳的位置轻微地起伏着。\n             \n             他活着出来了。\n             \n             他点燃了书桌上的油灯，在昏黄的光晕里将所有的证据铺展开来——文件、记录、从地下室带出的物件。它们的数量和完整程度因他走过的路而有所不同，但核心的东西已经在这里了：足以证明密室的机关，足以指向真正的凶手，足以触碰那个在庄园背后运作的、名叫\"玫瑰兄弟会\"的秘密组织。\n             \n             他正在整理思路，门被轻轻敲了两下。\n             \n             \"进来。\"\n             \n             伊莎贝拉推开门。她已经换下了白天的丧服，穿着深色的室内长裙，头发散下来，少了几分白天那种刻意的端庄，却多了一种更真实的、疲惫的神情。她的眼睛在看到他安全坐在书桌前时，有一个极短暂的、几乎无法察觉的松弛。\n             \n             \"您回来了。\"她走进来，关上身后的门，声音压低，\"我以为……\"她没有说完这句话，\"没关系。您回来了。\"\n             \n             \"夫人，\"艾德蒙抬起头，\"您怎么知道我去了地下室？\"\n             \n             \"这栋房子，\"伊莎贝拉在对面的椅子上坐下，\"有很多眼睛。\"\n             \n             她将双手放在膝上，直视着他，\"克劳福德先生，我来这里不是为了追问您找到了什么。我来是因为您需要知道一件事。\"\n             \n             艾德蒙放下手中的文件，等待着。\n             \n             \"玫瑰兄弟会。\"伊莎贝拉说出这个名字时，语气平静，但眼神里有一种艾德蒙第一次在她脸上看到的东西——不是恐惧，而是接近于恐惧的清醒，\"他们今晚派人来。不是明天，不是后天。今晚。\"\n             \n             客房里的油灯在某个看不见的气流中轻微地摇曳了一下，光影在墙壁上晃动。\n             \n             \"他们来这里，\"她继续说，\"是为了取走埃德加留下的东西，并且确保……没有人能够把这些东西交给不该知道的人。\"\n             \n             她的目光落在艾德蒙面前摊开的文件上，停留了一秒，然后重新看向他的眼睛。\n             \n             \"您现在手里有什么，克劳福德先生，在今晚结束之前，必须做出决定。\"", "title": "逃出生天", "act": 3}, "node_11": {"text": "油灯的光芒将两个人的影子投在墙上，长而静止。\n             \n             艾德蒙将所有证据重新整理了一遍，动作缓慢而仔细，像是在用这个过程来整理自己的思维。文件叠放整齐，物证排列有序。他在爱丁堡学法医学的时候，教授曾经说过一句话：证据本身没有立场，但使用证据的人有。\n             \n             现在，他必须决定自己的立场。\n             \n             伊莎贝拉坐在对面，没有催促他。她的手腕上，那枚玫瑰银坠在灯光下反射出细碎的光点。\n             \n             \"夫人，\"艾德蒙开口，\"您说玫瑰兄弟会今晚会来。他们来了之后，会做什么？\"\n             \n             \"取走文件。\"她停顿，\"以及……处理掉可能造成麻烦的人。\"\n             \n             \"包括您？\"\n             \n             伊莎贝拉没有回答，但她的沉默就是回答。\n             \n             艾德蒙手指叩了叩桌面，看着面前的证据。这些东西，在今晚之前，必须找到它们的去处。\n             \n             他想到了《泰晤士报》——伦敦最有影响力的报纸，如果证据足够充分，公开见报将让玫瑰兄弟会无处遁形，让真相在最广泛的意义上得到伸张。但这条路也是最危险的：在证据送达记者之前，有太多可能出错的环节，而组织的人今晚就在路上。\n             \n             他想到了伯爵的律师——法律渠道，缓慢，但相对安全。律师有保密义务，有合法的程序可以依托。代价是时间：法律的磨盘转得很慢，而在那段时间里，对方有机会销毁他们来得及销毁的东西。\n             \n             他看了一眼伊莎贝拉。\n             \n             还有第三条路。伊莎贝拉提过——用证据作为筹码，与组织谈判。不是正义，但也许是生存，也许是某种更复杂的、灰色地带里的平衡。这条路需要他信任她，真正地信任她，将自己的判断押注在这个他认识不足二十四小时的女人身上。\n             \n             窗外，庄园的夜色深沉，没有月亮。\n             \n             某处传来马蹄声，从远处的道路上隐约传来，若有若无。\n             \n             时间，已经开始倒计时了。\n             \n             艾德蒙深吸一口气，抬起头。", "title": "证据的处置", "act": 3}, "node_12_public": {"text": "清晨五点，艾德蒙·克劳福德站在《泰晤士报》编辑部的门廊下，外套领子竖起，抵御着十一月的寒意。他的公文包里装着足以让整个伦敦上流社会震颤的东西——玫瑰兄弟会的完整成员名单、伯爵案的物证副本、以及威廉·霍奇与伯爵之间往来的秘密信件。\n               \n               他在门廊下停留了整整三分钟，手指轻轻叩击着皮包的搭扣。\n               \n               *一旦越过这道门，就没有回头路了。*\n               \n               他推开了门。\n               \n               ---\n               \n               次日清晨，《泰晤士报》的头版以通栏大字刊出：**\"格雷夫顿伯爵案告破——秘密组织'玫瑰兄弟会'二十三名成员名单曝光\"**。\n               \n               消息像一块巨石投入平静的湖面，涟漪以惊人的速度向外扩散。议员、法官、军官、商人——二十三个名字，涵盖了伦敦各个权力阶层。报童在街头扯开嗓子叫卖，报纸在一个小时内售罄。绅士俱乐部里的成员们用颤抖的手指翻阅着名单，在自己认识的名字旁边停下，脸色变得苍白。\n               \n               苏格兰场的行动在上午九点展开。\n               \n               艾德蒙站在格雷夫顿庄园门前的石阶上，亲眼看着威廉·霍奇被两名警员押出大门。老警探的络腮鬓角在晨光中显得格外凌乱，他的深色大衣敞开着，像一个失去了所有傲慢的普通老人。\n               \n               两人目光交汇的瞬间，威廉没有说话。他只是用那双惯于审视别人的眼睛盯着艾德蒙看了很久，然后被警员推着走向了等候的马车。铁门在他身后沉重地合上，发出一声闷响，像是某种终结的宣判。\n               \n               *就这样了，*艾德蒙想，*五年前那桩被掩盖的事故，伯爵的秘密，贿赂，包庇——都结束了。*\n               \n               他以为自己会感到某种畅快。\n               \n               然而那种感觉并没有到来。\n               \n               ---\n               \n               报复来得比他预想的更快。\n               \n               当天下午，他位于贝克街附近的小办公室遭人闯入——书架被推倒，文件散落一地，玻璃窗被砸出一个拳头大小的窟窿。桌上压着一张便条，字迹工整得像是用尺子量过：\n               \n               *\"克劳福德先生，您挖掘的东西比您想象的更深。建议您在伦敦的空气变得不适合呼吸之前，好好考虑一下自己的处境。\"*\n               \n               委托人——那个艾德蒙从未见过真面目的神秘雇主——当晚也传来消息，说他收到了恐吓信，家中的马被人割断了缰绳放走。\n               \n               艾德蒙坐在满地狼藉的办公室里，将那张便条在指间转了又转。窗外的伦敦依旧喧嚣，马车轮子碾过石板路的声音从未停歇。煤气灯的光晕在破碎的玻璃上折射出奇异的光斑。\n               \n               他用拇指轻轻叩了叩下巴。\n               \n               玫瑰兄弟会的二十三名成员或许已经曝光，但一个存在了数十年的秘密组织，绝不会因为一篇报道就轻易瓦解。那些逃过第一波拘捕的人，那些藏在名单之外的人，此刻正以他为目标，集结力量。\n               \n               他站起身，走到破碎的窗边，望着街道上匆匆而过的人影。\n               \n               *正义有时候是一把枪，*他想，*扣下扳机的那一刻是痛快的，但枪声之后，你必须面对所有的回响。*\n               \n               他的外套口袋里还有一封信，是今天早些时候伊莎贝拉托人送来的，尚未拆开。他知道接下来的路不会平坦——但他也知道，他已经走到了这一步，没有任何退缩的理由。", "title": "真相的代价", "act": 4}, "node_12_legal": {"text": "艾德蒙将那只装着证据的皮质公文包放在膝盖上，手指无意识地轻叩着包盖的铜扣。马车在泥泞的街道上颠簸前行，窗外的伦敦在晨雾中若隐若现——烟囱冒出的黑烟与灰白色的雾气搅在一起，将整座城市包裹得密不透风。\n               \n               律师事务所坐落在林肯律师学院广场附近，一栋四层楼的砖石建筑，门口挂着一块磨损的铜牌：'普雷斯顿与霍华德律师事务所'。艾德蒙在台阶上站了片刻，深吸一口冷冽的空气，然后推门而入。\n               \n               伯爵的首席律师罗德里克·普雷斯顿是个六十岁出头的老人，银发梳得一丝不苟，眼镜架在鼻梁中段，习惯性地从镜框上方打量来客。艾德蒙将公文包推到他的办公桌上，简短地陈述了案情的核心。\n               \n               \"钢琴弦，\"艾德蒙说，\"是凶器。成员名单，是动机的证明。威廉·霍奇警探——他不仅是凶手，更是那个组织在苏格兰场的内线。\"\n               \n               普雷斯顿沉默地翻阅了很久，指尖在那份手写名单上缓缓滑过，眉头越皱越深。最后他摘下眼镜，用拇指和食指捏着镜腿，缓缓说道：\"克劳福德先生，法律的车轮转得很慢。你要有心理准备。\"\n               \n               艾德蒙知道。他一直知道。\n               \n               接下来的三个月，他像一个旁观者，看着那些文件在各个部门之间流转、被审核、被质疑、被重新审核。苏格兰场内部的调查启动了，但动作迟缓得像是在糖浆里挣扎。玫瑰兄弟会的其他成员显然得到了风声——艾德蒙听说，组织在萨里郡的一处秘密档案室在某个深夜付之一炬，烧掉的文件足以填满整辆马车。\n               \n               但核心证据完好无损：那根细如发丝的钢琴弦，仍然封存在普雷斯顿事务所的保险柜里；那份用隐形墨水写就的成员名单，已经由法医化学家验证并留存了副本。这些，他们烧不掉。\n               \n               威廉·霍奇在某个阴雨的星期二被捕。艾德蒙没有亲眼看到那一幕，但他从报纸上读到了简短的描述：'前苏格兰场警探，以谋杀格雷夫顿伯爵罪被捕。'短短一行字，遮掩了多少肮脏的真相。\n               \n               伊莎贝拉在威廉被捕后的第十天登上了开往那不勒斯的轮船。临行前，她差人送来一个小包裹，里面是一枚深红色的玫瑰胸针，附着一张便条，只有一行字：\n               \n               '先生，您的正直值得一枚真正的玫瑰，而非那个名字所污染的。'\n               \n               艾德蒙将胸针放在掌心看了很久，然后轻轻放进了抽屉最深处。\n               \n               组织的多数成员，因证据不足，最终逍遥法外。那些名字从名单上消失，又在别处重新出现。艾德蒙明白，这场案件只是掀开了一角，而那块布下面的东西，远比他想象的更深、更黑。\n               \n               正义来了。但它来得不完整。", "title": "法律的车轮", "act": 4}, "node_12_negotiate": {"text": "书房的壁炉在午后燃着低沉的火焰，橘红色的光舔过那张艾德蒙曾经蹲伏检查的橡木地板。三个月前，一具尸体在这里冷却。今天，同一个房间里将要进行一场截然不同的博弈。\n               \n               伊莎贝拉站在书桌旁，背对着窗户。灰白的伦敦天光从她身后透进来，将她的轮廓勾勒得如同一幅剪影画——清晰，却难以看清细节。她穿着深紫色的丧服，乌发盘起，颈间没有任何首饰。她不需要任何装饰来彰显她此刻的分量。\n               \n               \"他们会来的，\"她用那带着轻微意大利口音的声音说，语气平静得像是在谈论天气，\"准时。这类人总是准时。\"\n               \n               艾德蒙站在壁炉旁，手指习惯性地轻叩着下巴。他看着那张空椅子——伯爵生前惯坐的那把——心里有什么东西说不清楚。他们把那把椅子留在原位，这是伊莎贝拉的主意。她说，这会有用的。\n               \n               \"夫人，\"他开口，\"您确定这份名单的分量足够——\"\n               \n               \"足够。\"她转过身，棕色的眼睛直视着他，\"克劳福德先生，您是个聪明人。但有些事情，您需要学着相信您不完全理解的力量。\"\n               \n               他没有再说什么。\n               \n               玫瑰兄弟会的代表在下午两点整推开了书房的门。来的是两个人：一个年长的绅士，银发，手持文明杖，笑容温和得令人不安；另一个是他的随从，站在门口，沉默如石。艾德蒙注意到随从的右手始终没有离开大衣口袋。\n               \n               谈判以一种令人窒息的礼貌开始。\n               \n               银发绅士落座，接过茶杯，轻轻抿了一口。\"格雷夫顿夫人，您的丧夫之痛，我们深感遗憾。\"他说，\"但您也明白，伯爵生前的某些……承诺，在法律之外，同样具有约束力。\"\n               \n               \"当然。\"伊莎贝拉在对面坐下，双手交叠放在膝上，神情平和，\"我也明白，一份完整的成员名单，若是出现在《泰晤士报》的编辑桌上，会产生怎样的约束力。\"\n               \n               沉默。壁炉里的木柴轻响了一声。\n               \n               艾德蒙站在一侧，看着这一切，感到一种奇异的眩晕。他以为自己是这个案子的侦探。他以为他在追查真相，在拼凑线索，在保护无辜。但此刻站在书房里，他忽然意识到，从他踏进格雷夫顿庄园的第一天起，这个女人就已经知道棋局会走向哪里。他，艾德蒙·克劳福德，不过是她手中一枚她选择使用的棋子——一枚诚实的、有用的棋子。\n               \n               谈判持续了将近两个小时。伊莎贝拉以公开名单为威胁，要求组织正式放弃对格雷夫顿遗产的任何主张，并要求对威廉·霍奇警探的\"私人罪行\"以组织内部方式予以处置——不经公开审判，不留案可查，但必须有实质性的惩处。\n               \n               银发绅士的笑容在某一刻终于消失了，但只消失了片刻。他重新端起茶杯，轻声说：\"您的条件，我们接受。\"\n               \n               当两人离开书房，随从带上门的声音在走廊里回响，艾德蒙感到双腿有些发沉。他走到窗边，看着灰蒙蒙的庄园草坪，那两个身影穿过铁门，消失在郊外的雾里。\n               \n               \"您一直知道，\"他说，没有回头，\"从一开始，您就知道结局会是这样。\"\n               \n               伊莎贝拉在他身后，声音里有某种东西，介于疲惫和释然之间：\"我知道我想要什么结局，克劳福德先生。至于能否达成——\"她停顿了一下，\"我需要一个诚实的人站在我身边。一个不会被收买，不会撒谎的人。这让他们相信，那份名单是真实的威胁。\"\n               \n               艾德蒙终于转过身，看着她。\n               \n               她没有笑，也没有得意。她只是站在那里，在那张死过人的书桌旁，看起来比任何时候都更加疲倦，也更加真实。\n               \n               \"威廉，\"他说，\"他会……\"\n               \n               \"他会得到他应得的。\"她的声音简短而确定，\"只是不以您期待的方式。\"\n               \n               艾德蒙轻轻叩了叩下巴，沉默了很久。\n               \n               正义，他想，有时候长着一张他不认识的脸。", "title": "玫瑰与荆棘", "act": 4}, "node_end_true": {"text": "审判持续了整整六周。\n\n伦敦的冬天在庭审过程中悄然降临，泰晤士河两岸结了薄薄的冰，晨雾比往年更加浓厚。艾德蒙几乎每天都出现在旁听席上，圆顶礼帽放在膝头，眼神专注地追踪着每一个证人的证词。他的名字频繁出现在报纸上，有人称他为\"维多利亚时代最勇敢的年轻侦探\"，也有人在匿名信中称他为\"不知天高地厚的冒失鬼\"。\n\n他对这两种评价都只是淡淡一笑。\n\n威廉·霍奇在第三周认罪。老警探在证人席上的样子出乎所有人意料地平静——没有眼泪，没有辩解，只是用那把粗嘎的嗓音，一字一句地陈述了五年前他如何帮助伯爵掩盖那起事故，如何收受贿赂，如何在伯爵案发生后试图阻挠调查。\n\n终身监禁。法槌落下的声音在法庭高高的穹顶间回响。\n\n玫瑰兄弟会的二十三名成员，最终有十九人受到了不同程度的法律制裁。剩余四人在审判期间秘密出逃，据称已离开英格兰。艾德蒙将这个数字记在脑子里，知道这四个名字将是他未来某个案件的开端。\n\n---\n\n判决结束后的第三天，伊莎贝拉·格雷夫顿在艾德蒙的书面证词支持下，正式取得了格雷夫顿庄园及伯爵名下全部遗产的合法继承权。玫瑰兄弟会试图援引秘密协议没收遗产的图谋，随着组织的覆灭而彻底落空。\n\n她在庄园的会客室里接见了艾德蒙，一如初次见面时那般端坐，乌发梳得一丝不苟，深棕色的眼眸平静而深邃。壁炉里的火烧得正旺，将整个房间映照成暖金色，与窗外铅灰色的冬日天空形成鲜明的对比。\n\n\"我欠你一个真相，\"她开口，意大利口音依旧轻微，却比艾德蒙第一次听到时多了几分松动，\"关于委托你的那个人。\"\n\n艾德蒙将手指轻搭在下巴上，没有说话。\n\n\"他叫马可·格雷夫顿，\"伊莎贝拉说，\"是埃德加二十年前在那不勒斯留下的私生子。他的母亲在五年前去世前，才告诉了他父亲的身份。他一直在追踪玫瑰兄弟会的动向，知道埃德加陷得太深，试图警告他——但来不及了。\"\n\n房间里安静了片刻，只有壁炉中木柴轻微爆裂的声音。\n\n艾德蒙慢慢放下手，目光落在窗外的庄园大门方向。他想起了那封从未见过真面目的委托信，想起了那个始终藏在阴影里的雇主，想起了那些他以为是谜题、实则是一个儿子对父亲最后的守护的线索。\n\n\"他现在在哪里？\"他问。\n\n\"安全的地方，\"伊莎贝拉说，嘴角浮现出一丝几乎察觉不到的弧度，\"他说，谢谢你。\"\n\n---\n\n艾德蒙离开庄园时，已是下午三点。伦敦郊区的冬日天光短暂，西边的云层已经开始染上暮色的橙红。\n\n他站在庄园铁门外的碎石路上，没有立刻招呼马车，只是抬头看着那栋三层哥特式建筑在薄雾中的轮廓，看着它高耸的尖顶，看着那些沉默的石雕，看着挂满油画的窗子后面透出的昏黄灯光。\n\n然后他转过身，面向伦敦的方向。\n\n晨雾——或者说，这个季节从未真正散去的伦敦薄雾——正在某种难以言说的光线作用下，呈现出一种几近透明的质感。远处城市的轮廓若隐若现，烟囱的黑烟与雾气缠绕在一起，工厂的汽笛声随风飘来，混杂着马蹄声和街头叫卖声，构成这座城市永不停歇的低鸣。\n\n艾德蒙·克劳福德将圆顶礼帽戴正，深吸了一口带着煤烟和泥土气息的冬日空气。\n\n他的名声已经建立。他也永远成为了某些人眼中的威胁。这两件事将在他未来的每一个清晨同时等候着他，如同硬币的两面，不可分割。\n\n他迈开步子，走向伦敦。\n\n*这一次，*他想，*我做了一件正确的事。*\n\n*下一次，会更难。*\n\n【结局：真相的光 · 完整正义】\n*玫瑰兄弟会全面覆灭。威廉·霍奇终身监禁。伊莎贝拉获得遗产。艾德蒙·克劳福德之名，从此刻入伦敦的历史。*", "title": "真相的光", "act": 4}, "node_end_bittersweet": {"text": "报纸刊出的那一刻，艾德蒙以为最难的部分已经过去。\n\n他错了。\n\n玫瑰兄弟会的律师团队在证据公开后的十二小时内便已集结完毕。他们训练有素，手段娴熟，像一台精密运转的机器，专门为这种危机时刻而存在。部分关键证据的取得程序遭到质疑——艾德蒙在调查过程中的某些行动游走在法律边缘，而对方的律师对此了如指掌。\n\n威廉·霍奇被捕，这是确定的。伯爵案在法律层面告破，这也是确定的。\n\n但二十三名成员中，最终只有九人真正受到了法律制裁。其余十四人，或凭借律师的辩护脱身，或在审判期间悄然转移了财产，或干脆消失在了通往欧陆的某条航线上。玫瑰兄弟会的组织架构被重创，却并未被彻底摧毁。它像一棵被砍去大半枝桠的树，根系仍在地下蔓延。\n\n报复来得猛烈而持续。\n\n艾德蒙的办公室在一周内被砸了两次。他的房东在收到匿名信后，客气而坚定地请他另觅住处。合作过的两位证人收到了威胁，其中一人选择撤回证词。他本人在某个雾夜被两个陌生男人跟踪了整整半条街，直到他拐进一家仍在营业的酒馆才算脱身。\n\n他在酒馆的角落里坐了很久，盯着杯中的麦酒，听着周围人的喧嚣，第一次认真地意识到：他准备得不够充分。\n\n*我以为真相本身就是武器，*他想，*却忘了真相需要足够坚实的盔甲来保护它。*\n\n---\n\n伊莎贝拉走得很安静。\n\n没有告别，没有通知，只是在某个清晨，庄园的管家传话说伯爵夫人已经离开。艾德蒙赶到时，格雷夫顿庄园的大门已经锁上，窗帘全部拉下，整栋建筑陷入一种沉默的封闭状态，像一个拒绝再开口的人。\n\n门缝里塞着一封信，信封上只写着他的名字，字迹娟秀而克制。\n\n他站在冬日的寒风里，拆开了信。\n\n*\"克劳福德先生：*\n\n*真相是一把双刃剑，年轻的侦探。你握住了它，这需要勇气，我对此毫无异议。但一把剑需要剑鞘，而你的，还不够结实。*\n\n*希望你的伤口不太深。*\n\n*保重。*\n\n*——I.G.\"*\n\n艾德蒙将信折好，放回信封，放进外套内袋，贴着心口。\n\n他在庄园门外站了很久，看着那栋哥特式建筑在阴云下的轮廓，看着挂满油画的窗子后面彻底熄灭的灯光。伊莎贝拉的遗产问题悬而未决，混乱的局势让她的处境变得复杂，她的离开或许是某种自我保护，或许是另一种他尚未理解的选择。\n\n他不知道她去了哪里。\n\n他想，也许有一天会再见到她。\n\n---\n\n医生建议他离开伦敦休养。他在格拉斯哥的一位旧友那里住了三个月，每天在冰冷的海风中散步，读书，整理自己的思路，将这桩案件从头到尾重新梳理了无数遍，标记出每一个他本可以做得更好的节点。\n\n他活了下来。\n\n这是确定的。\n\n正义不完整，胜利有裂缝，代价比他预想的更重——但他活了下来，并且带着某种此前不曾拥有的东西：对这个世界真实重量的认识。\n\n三个月后，他回到伦敦，在另一条街上租了一间新的办公室，挂上了他的招牌。\n\n第一批登门的客人里，有人带来了新的案子，有人带来了警告，还有一个人，只是沉默地将一张名片放在桌上，转身离去。名片上没有名字，只有一个地址，和一行字：\n\n*\"当你准备好了，我们可以谈谈那剩下的十四个人。\"*\n\n艾德蒙将名片压在台灯底座下，重新戴上圆顶礼帽，走向窗边，望着伦敦灰白色的天空。\n\n*好，*他想，*那就等我准备好。*\n\n【结局：破碎的胜利 · 苦甜正义】\n*威廉·霍奇被捕。玫瑰兄弟会重创但未覆灭。伊莎贝拉下落不明。艾德蒙·克劳福德付出了代价，也学到了什么叫做真正的代价。*", "title": "破碎的胜利", "act": 4}, "node_end_neutral": {"text": "法庭的旁听席上坐满了人。艾德蒙选了一个靠近过道的位置，圆顶礼帽放在膝盖上，手指习惯性地轻叩着帽檐，一下，又一下。\n\n法官宣读判决的声音在高拱顶的法庭里回响，字字清晰，却又像是隔着一层棉絮传来。威廉·霍奇，谋杀罪，有罪。\n\n旁听席上有人倒吸一口冷气，有人低声议论。威廉本人站在被告席上，那张曾经大腹便便、总带着讽刺笑意的脸，此刻只是灰白而空洞。他没有看向任何人，目光落在地板上某个不存在的点。\n\n艾德蒙没有感到预期中的那种释然。\n\n他想到了拉扎罗·孔蒂，那个沉默的大块头，曾经为了保护伊莎贝拉而深陷嫌疑，在等待法律厘清他的身份期间被关押了整整数周。铁窗和潮湿的牢房，是一个无辜者为\"程序\"所付出的代价。艾德蒙曾去探视过他一次，拉扎罗只是点了点头，说：\"这没什么，先生。\"那种平静比任何愤怒都更令人难受。\n\n伊莎贝拉的遗产纠纷拖了将近半年。伯爵的远房亲属、组织的幕后律师、以及各种不知从哪里冒出来的债权人，轮番出现，试图从那份遗产里分一杯羹。最终，伊莎贝拉在那不勒斯的家族律师介入，事情才得以解决——但她为此付出的精力与心力，是艾德蒙从未计算进去的代价。\n\n格雷夫顿庄园最终被拍卖。那栋三层哥特式建筑，带着它所有的秘密和阴影，被一位来自曼彻斯特的纺织业大亨买下，据说打算改建成乡村别墅。密室里的书架、那把锁死的门、钢琴弦曾经绷过的地方——一切都将被粉刷和改造，变成另一种面目。\n\n那幅《圣母与玫瑰》最终由伦敦国家美术馆收购。画中的圣母低垂着眼帘，手中捧着一朵半开的白玫瑰，神情宁静得近乎冷漠。艾德蒙偶尔会去看那幅画，站在人群边缘，看游客们指指点点，听导览员说这是一幅\"来历颇为曲折的珍品\"。\n\n他想起那个雾蒙蒙的清晨，马车驶向格雷夫顿庄园的铁门，他第一次看到那栋建筑时的感觉——像是某种古老的、等待被解开的谜题，正以沉默的姿态注视着他。\n\n谜题解开了。答案是真实的，代价也是真实的。\n\n艾德蒙戴上圆顶礼帽，从美术馆的侧门走出去，融入伦敦灰色的人流之中。", "title": "迟来的正义", "act": 4}, "node_end_cold": {"text": "判决结果送达的那个下午，伦敦下着细密的冬雨。\n\n艾德蒙坐在自己位于霍尔本区的小办公室里，那张窄小的木桌上摊开着厚厚一叠案件笔记——密密麻麻的铅笔字，潦草的示意图，以及几张他反复翻看过的证据副本。壁炉里的炭火烧得很低，橘红色的光将整个房间映成暖色，却驱不散他心里的某种寒意。\n\n普雷斯顿的信措辞礼貌而遗憾：威廉·霍奇的辩护律师成功以\"证据采集程序存在瑕疵\"为由，向法官申请将关键证据排除在庭审之外。那根钢琴弦，因为在移交过程中缺少完整的监管链记录，被认定为\"不可采信\"。成员名单，因原件的取得方式\"未经授权\"，同样遭到排除。\n\n威廉以\"程序问题\"获释。\n\n艾德蒙手指轻叩着桌面，一下，一下，一下。他知道那根弦是凶器。他知道那份名单是真实的。他知道威廉·霍奇用一根从书房钢琴上取下的琴弦，在密室里结束了格雷夫顿伯爵的性命，然后用那把从死者口袋里摸出的钥匙从容锁上了门，再从他早已知晓的隐藏通道离开。\n\n他知道这一切。法律不在乎他知道什么。\n\n威廉在获释后的两周内从伦敦消失，没有留下任何地址。玫瑰兄弟会的案件被苏格兰场归入\"悬案\"档案，贴上封条，推进某个阴暗的储藏室。\n\n艾德蒙将笔记合上，靠在椅背上，看着天花板上那块因漏雨而留下的黄色水渍。他想，真相是存在的。它就在那里，清晰而完整，就像一座被雾气包围的建筑——你知道它在那里，你能看到它的轮廓，但你无法走进去，无法触碰它。\n\n桌上的信件里，有一封来自那不勒斯，邮戳已经是三周前的事了。他一直没有拆开，不知道为什么。\n\n现在，他拿起那封信，用裁纸刀沿着封口划开。信纸是奶白色的，字迹纤细而有力，带着一种不容置疑的从容：\n\n'克劳福德先生，\n\n我听说了法庭的结果。我并不惊讶，但我依然感到遗憾——不是为我自己，而是为您所付出的努力。\n\n有些事情，法律无法触及。但世界并非只有法律一种语言。\n\n如果您愿意，请来意大利。那不勒斯的冬天比伦敦温暖，而我还有一些事情，需要一个正直的人来帮我完成。\n\n伊莎贝拉·格雷夫顿'\n\n艾德蒙将信纸折好，放在案件笔记的最上面，然后起身，走到窗边。\n\n细雨中的霍尔本街道湿漉漉的，煤气灯的光晕在积水里颤抖。一辆马车驶过，溅起一片水花，消失在雾中。\n\n他站了很久，手指轻轻叩着窗框，思考着意大利的冬天，以及那句话的含义——\n\n有些事情，需要用另一种方式解决。", "title": "未竟之案", "act": 4}, "node_end_grey": {"text": "威廉·霍奇在谈判后的第三天从人间蒸发。\n\n没有逮捕，没有审判，没有讣告。他的同事们说他申请了提前退休，去了乡下养病。没有人追问。艾德蒙坐在他位于伦敦城内的小公寓里，看着窗外的煤烟把天空染成铅灰色，想了很久，最终决定不去追问细节。有些事情，知道了只会在心里留下一个无法愈合的缺口。\n\n伯爵埃德加·格雷夫顿的案子在苏格兰场的档案室里被标注为\"凶手不明，案件存档\"。雾还在伦敦的街道上漫游，就好像什么都没有发生过。\n\n伊莎贝拉在一周后差人送来了报酬。那是一个深棕色的信封，里面装着一张数额令艾德蒙沉默半晌的支票，以及一张手写的便条。字迹是她的，倾斜而有力：\n\n*\"克劳福德先生，您是我见过的最诚实的人。在我们的世界里，这是一种危险的特质。请好好保护它。——I.G.\"*\n\n艾德蒙把便条叠好，夹进他的案件记录册里。\n\n他在那天傍晚打开日记，在新的一页顶端写下日期：1862年11月。然后他停了很久，听着窗外马车辗过石板路的声音，听着远处泰晤士河上的汽笛在雾里沉沉鸣响。\n\n最终他写下：\n\n*\"格雷夫顿案结。威廉得到了惩罚，但不是法律的惩罚。伊莎贝拉保住了她的遗产，也保住了她的秘密。我拿了报酬，离开了庄园。我不知道这算不算正义。我只知道，正义有时候长着一张我不认识的脸——而我不得不学着与它握手。\"*\n\n他合上日记，把那张支票压在桌角，起身去倒了一杯茶。\n\n茶是苦的，他没有加糖。\n\n窗外，伦敦的雾越来越浓，把街灯晕成一个个模糊的光圈，像是某种他永远无法完全看清的真相。格雷夫顿庄园在城郊的黑暗里沉默着，玫瑰花圃在冬天已经枯萎，但那些荆棘还在，坚硬，沉默，经久不去。\n\n艾德蒙·克劳福德喝完了那杯苦茶，重新坐到桌前，翻开了下一个案子的卷宗。\n\n【结局：玫瑰的交易】\n*灰色正义。威廉受到惩处，真相以扭曲的方式实现。艾德蒙在道德的模糊地带留下了自己的足迹——但他的诚实，完好无损。*", "title": "玫瑰的交易", "act": 4}}, "assets": {"backgrounds": {"node_01": "assets/victorian/img_18.webp", "node_02": "assets/victorian/img_30.webp", "node_03a": "assets/victorian/img_03.webp", "node_03b": "assets/victorian/img_24.webp", "node_04": "assets/victorian/img_05.webp", "node_05_trust": "assets/victorian/img_08.webp", "node_05_suspect": "assets/victorian/img_21.webp", "node_06": "assets/victorian/img_13.webp", "node_07a": "assets/victorian/img_01.webp", "node_07b": "assets/victorian/img_26.webp", "node_07c": "assets/victorian/img_29.webp", "node_08": "assets/victorian/img_14.webp", "node_09_solo": "assets/victorian/img_19.webp", "node_09_william": "assets/victorian/img_20.webp", "node_09_guided": "assets/victorian/img_20.webp", "node_10_survive": "assets/victorian/img_28.webp", "node_11": "assets/victorian/img_28.webp", "node_12_public": "assets/victorian/img_09.webp", "node_12_legal": "assets/victorian/img_17.webp", "node_12_negotiate": "assets/victorian/img_11.webp", "node_dead_basement": "assets/victorian/img_12.webp", "node_dead_william": "assets/victorian/img_31.webp", "node_end_true": "assets/victorian/img_10.webp", "node_end_bittersweet": "assets/victorian/img_22.webp", "node_end_neutral": "assets/victorian/img_16.webp", "node_end_cold": "assets/victorian/img_02.webp", "node_end_grey": "assets/victorian/img_07.webp"}, "characters": {"char_edmund": {"name": "艾德蒙·克劳福德", "url": "assets/victorian/img_25.webp"}, "char_lazaro": {"name": "拉扎罗·孔蒂", "url": "assets/victorian/img_04.webp"}, "char_william": {"name": "威廉·霍布斯警探", "url": "assets/victorian/img_06.webp"}, "char_emily": {"name": "艾米莉·霍普", "url": "assets/victorian/img_23.webp"}, "char_count_ghost": {"name": "已故伯爵·亨利·布莱克伍德三世", "url": "assets/victorian/img_15.webp"}, "char_isabella": {"name": "伊莎贝拉·布莱克伍德", "url": "assets/victorian/img_27.webp"}}, "videos": {"node_end_02": "assets/victorian/video_32.mp4"}}};

<script>
(function() {
'use strict';

const ACT_NAMES = { 1: '第一幕 · 调查开端', 2: '第二幕 · 深入调查', 3: '第三幕 · 地下室危机', 4: '第四幕 · 终局' };
const ENDING_LABELS = {
  true_ending: '完整正义', bittersweet_ending: '苦甜正义',
  neutral: '中性结局', cold_ending: '未竟之案', bad_ending: '死亡结局'
};
const ENDING_ICONS = {
  true_ending: '☀️', bittersweet_ending: '🌤️',
  neutral: '🌫️', cold_ending: '❄️', bad_ending: '💀'
};

const story = GAME_DATA.story;
const narratives = GAME_DATA.narratives;
const assets = GAME_DATA.assets;
const nodes = story.nodes;
const entryId = story.entry_node_id;

/* ===== STATE ===== */
let state = {
  currentNode: null,
  values: { clues: 0, courage: 0, trust_isabella: 0 },
  visited: [],
  history: [],
  currentAct: 0,
  textQueue: [],
  textIdx: 0,
  typing: false,
  typeTimer: null,
  autoMode: false,
  autoTimer: null,
};

/* ===== DOM REFS ===== */
const $ = id => document.getElementById(id);
const titleScreen = $('title-screen');
const sceneLayer = $('scene-layer');
const sceneBg = $('scene-bg');
const sceneBgNext = $('scene-bg-next');
const sceneTitleOverlay = $('scene-title-overlay');
const actTransition = $('act-transition');
const textbox = $('textbox');
const textContent = $('text-content');
const speakerName = $('speaker-name');
const clickIndicator = $('click-indicator');
const choicePanel = $('choice-panel');
const choiceButtons = $('choice-buttons');
const hud = $('hud');
const hudRight = $('hud-right');
const endingScreen = $('ending-screen');
const modalOverlay = $('modal-overlay');
const historyPanel = $('history-panel');
const charLeft = $('char-left');
const charRight = $('char-right');
const charLeftWrap = $('char-left-wrap');
const charRightWrap = $('char-right-wrap');
const charLeftName = $('char-left-name');
const charRightName = $('char-right-name');

/* ===== INIT ===== */
function init() {
  if (hasSaveData()) $('btn-continue').disabled = false;
  $('btn-start').addEventListener('click', () => startGame(false));
  $('btn-continue').addEventListener('click', () => startGame(true));
  $('btn-save').addEventListener('click', () => openModal('save'));
  $('btn-load').addEventListener('click', () => openModal('load'));
  $('btn-history').addEventListener('click', toggleHistory);
  $('btn-auto').addEventListener('click', toggleAuto);
  $('btn-restart').addEventListener('click', () => { endingScreen.style.display = 'none'; startGame(false); });
  $('btn-title-return').addEventListener('click', () => { endingScreen.style.display = 'none'; returnToTitle(); });
  $('modal-close').addEventListener('click', closeModal);
  $('history-close').addEventListener('click', () => historyPanel.style.display = 'none');
  textbox.addEventListener('click', onTextClick);
  document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') onTextClick(); });
}

/* ===== START ===== */
function startGame(continued) {
  if (continued && hasSaveData()) {
    loadFromSlot('auto');
  } else {
    state.currentNode = null;
    state.values = { clues: 0, courage: 0, trust_isabella: 0 };
    state.visited = [];
    state.history = [];
    state.currentAct = 0;
  }
  titleScreen.classList.add('hidden');
  setTimeout(() => {
    titleScreen.style.display = 'none';
    sceneLayer.style.display = 'block';
    hud.style.display = 'flex';
    hudRight.style.display = 'flex';
    updateHUD();
    if (state.currentNode && nodes[state.currentNode]) {
      enterNode(state.currentNode);
    } else {
      enterNode(entryId);
    }
  }, 800);
}

function returnToTitle() {
  sceneLayer.style.display = 'none';
  hud.style.display = 'none';
  hudRight.style.display = 'none';
  titleScreen.style.display = 'flex';
  titleScreen.classList.remove('hidden');
  if (hasSaveData()) $('btn-continue').disabled = false;
}

/* ===== NODE ENTRY ===== */
function enterNode(nodeId) {
  const node = nodes[nodeId];
  if (!node) return;

  state.currentNode = nodeId;
  if (!state.visited.includes(nodeId)) state.visited.push(nodeId);

  const newAct = node.act || 1;
  if (newAct !== state.currentAct) {
    state.currentAct = newAct;
    showActTransition(newAct, () => showScene(nodeId, node));
  } else {
    showScene(nodeId, node);
  }

  autoSave();
}

/* ===== ACT TRANSITION ===== */
function showActTransition(act, cb) {
  $('act-number').textContent = `第 ${['一','二','三','四'][act-1]} 幕`;
  $('act-title').textContent = ACT_NAMES[act] || '';
  actTransition.classList.add('visible');
  setTimeout(() => {
    actTransition.classList.remove('visible');
    setTimeout(cb, 600);
  }, 2500);
}

/* ===== SCENE ===== */
function showScene(nodeId, node) {
  choicePanel.style.display = 'none';
  clickIndicator.style.display = 'block';

  const bgUrl = assets.backgrounds[nodeId];
  if (bgUrl) {
    sceneBgNext.style.backgroundImage = `url('${bgUrl}')`;
    sceneBgNext.style.opacity = '1';
    setTimeout(() => {
      sceneBg.style.backgroundImage = `url('${bgUrl}')`;
      sceneBgNext.style.opacity = '0';
    }, 900);
  } else {
    sceneBg.className = '';
    sceneBg.classList.add('bg-fallback');
    sceneBg.style.backgroundImage = '';
  }

  showCharacters(node);

  const narr = narratives[nodeId];
  const title = narr ? narr.title : node.title;
  const act = narr ? narr.act : node.act;

  $('scene-act-label').textContent = `第 ${['一','二','三','四'][(act||1)-1]} 幕`;
  $('scene-title-text').textContent = title || '';
  sceneTitleOverlay.classList.add('visible');
  setTimeout(() => sceneTitleOverlay.classList.remove('visible'), 2000);

  setTimeout(() => {
    const fullText = narr ? narr.text : (node.scene_description || node.title);
    startTextDisplay(fullText, node);
  }, 1800);
}

/* ===== CHARACTERS ===== */
function showCharacters(node) {
  charLeftWrap.classList.remove('visible');
  charRightWrap.classList.remove('visible');
  charLeft.src = '';
  charRight.src = '';
  charLeftName.textContent = '';
  charRightName.textContent = '';

  const witnesses = node.witnesses || [];
  const nonPlayer = witnesses.filter(c => c !== 'char_edmund');
  const playerInScene = witnesses.includes('char_edmund');

  if (playerInScene && assets.characters['char_edmund']) {
    charLeft.src = assets.characters['char_edmund'].url;
    charLeftName.textContent = assets.characters['char_edmund'].name;
    setTimeout(() => charLeftWrap.classList.add('visible'), 400);
  }
  if (nonPlayer.length > 0) {
    const npc = nonPlayer[0];
    if (assets.characters[npc]) {
      charRight.src = assets.characters[npc].url;
      charRightName.textContent = assets.characters[npc].name;
      setTimeout(() => charRightWrap.classList.add('visible'), 600);
    }
  }
}

/* ===== TEXT DISPLAY ===== */
function startTextDisplay(fullText, node) {
  const paragraphs = splitIntoParagraphs(fullText);
  state.textQueue = paragraphs;
  state.textIdx = 0;
  state.currentNodeObj = node;
  displayNextParagraph();
}

function splitIntoParagraphs(text) {
  if (!text) return ['...'];
  const raw = text.split(/\n\s*\n/);
  const result = [];
  let buffer = '';
  for (const para of raw) {
    const trimmed = para.trim();
    if (!trimmed) continue;
    if (buffer.length + trimmed.length > 300 && buffer.length > 0) {
      result.push(buffer.trim());
      buffer = trimmed;
    } else {
      buffer += (buffer ? '\n\n' : '') + trimmed;
    }
  }
  if (buffer.trim()) result.push(buffer.trim());
  if (result.length === 0) result.push(text.trim() || '...');
  return result;
}

function displayNextParagraph() {
  if (state.textIdx >= state.textQueue.length) {
    onTextComplete();
    return;
  }
  const para = state.textQueue[state.textIdx];
  state.textIdx++;

  const speaker = extractSpeaker(para);
  speakerName.textContent = speaker || '';
  const displayText = speaker ? para.replace(/^"[^"]*"\s*/, '').replace(/^「[^」]*」\s*/, '') : para;

  typeText(formatText(displayText));
}

function extractSpeaker(text) {
  const dialogMatch = text.match(/^["「](.+?)["」]/);
  if (dialogMatch) {
    const said = dialogMatch[1];
    if (said.length < 20) return '';
  }
  return '';
}

function formatText(text) {
  return text
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/---/g, '—');
}

function typeText(html) {
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = html;
  const plainText = tempDiv.textContent;

  state.typing = true;
  textContent.innerHTML = '';
  clickIndicator.style.display = 'none';

  let charIdx = 0;
  const speed = 30;

  clearInterval(state.typeTimer);
  state.typeTimer = setInterval(() => {
    if (charIdx >= plainText.length) {
      clearInterval(state.typeTimer);
      textContent.innerHTML = html;
      state.typing = false;
      clickIndicator.style.display = 'block';
      if (state.autoMode) {
        clearTimeout(state.autoTimer);
        state.autoTimer = setTimeout(onTextClick, 2500);
      }
      return;
    }
    charIdx++;
    const partial = plainText.substring(0, charIdx);
    let reconstructed = html;
    const emMatches = [...html.matchAll(/<em>([^<]*)<\/em>/g)];
    if (emMatches.length === 0) {
      textContent.textContent = partial;
    } else {
      textContent.innerHTML = buildPartialHTML(html, charIdx);
    }
  }, speed);
}

function buildPartialHTML(html, charCount) {
  let result = '';
  let count = 0;
  let inTag = false;
  for (let i = 0; i < html.length && count < charCount; i++) {
    const ch = html[i];
    if (ch === '<') { inTag = true; const end = html.indexOf('>', i); if (end >= 0) { result += html.substring(i, end + 1); i = end; } inTag = false; continue; }
    result += ch;
    count++;
  }
  const openEm = (result.match(/<em>/g) || []).length;
  const closeEm = (result.match(/<\/em>/g) || []).length;
  if (openEm > closeEm) result += '</em>';
  return result;
}

function skipTypewriter() {
  if (!state.typing) return false;
  clearInterval(state.typeTimer);
  const html = formatText(state.textQueue[state.textIdx - 1] || '');
  textContent.innerHTML = html;
  state.typing = false;
  clickIndicator.style.display = 'block';
  return true;
}

function onTextClick() {
  if (choicePanel.style.display === 'flex') return;
  if (skipTypewriter()) return;
  displayNextParagraph();
}

function onTextComplete() {
  const node = state.currentNodeObj;
  if (!node) return;

  state.history.push({ nodeId: node.node_id, title: node.title });

  clickIndicator.style.display = 'none';

  const isEnding = node.node_type === 'ending' || node.node_type === 'dead_end';
  if (isEnding) {
    setTimeout(() => showEnding(node), 800);
    return;
  }

  if (node.choices && node.choices.length > 0) {
    setTimeout(() => showChoices(node), 400);
    return;
  }

  if (node.next_nodes && node.next_nodes.length > 0) {
    let targetNode = node.next_nodes[0];
    if (node.auto_route && node.next_nodes.length > 1) {
      targetNode = resolveAutoRouteTarget(node);
    }
    clickIndicator.style.display = 'block';
    textbox.onclick = () => {
      textbox.onclick = onTextClick;
      enterNode(targetNode);
    };
    return;
  }

  showEnding(node);
}

/* ===== CHOICES ===== */
function showChoices(node) {
  textbox.style.display = 'none';
  choicePanel.style.display = 'flex';
  choicePanel.style.flexDirection = 'column';
  choiceButtons.innerHTML = '';

  node.choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';

    let locked = false;
    let lockReason = '';

    if (choice.gate_condition) {
      for (const [attr, cond] of Object.entries(choice.gate_condition)) {
        const match = cond.match(/(>=|<=|>|<|==)(\d+)/);
        if (match) {
          const op = match[1];
          const threshold = parseInt(match[2]);
          const val = state.values[attr] || 0;
          if (op === '>=' && val < threshold) locked = true;
          else if (op === '<=' && val > threshold) locked = true;
          else if (op === '>' && val <= threshold) locked = true;
          else if (op === '<' && val >= threshold) locked = true;
          else if (op === '==' && val !== threshold) locked = true;
        }
      }
      if (locked) lockReason = choice.locked_hint || '条件未满足';
    }

    let label = `${idx + 1}. ${choice.text}`;
    if (choice.is_dead_end) label += ' <span class="dead-end-icon">💀</span>';

    btn.innerHTML = label;
    if (locked) {
      btn.classList.add('locked');
      btn.innerHTML += `<span class="lock-reason">🔒 ${lockReason}</span>`;
    }

    if (!locked) {
      btn.addEventListener('click', () => makeChoice(choice));
    }

    choiceButtons.appendChild(btn);
  });
}

function makeChoice(choice) {
  choicePanel.style.display = 'none';
  textbox.style.display = 'block';
  textbox.onclick = onTextClick;

  if (choice.value_effects) {
    choice.value_effects.forEach(eff => {
      const attr = eff.attribute;
      const delta = eff.delta || 0;
      if (state.values.hasOwnProperty(attr)) {
        state.values[attr] += delta;
        flashStat(attr, delta);
      }
    });
    updateHUD();
  }

  let targetNode = choice.target_node_id;

  if (choice.gate_branch) {
    const gb = choice.gate_branch;
    let pass = true;
    if (gb.condition) {
      for (const [attr, cond] of Object.entries(gb.condition)) {
        const match = cond.match(/(>=|<=|>|<|==)(\d+)/);
        if (match) {
          const op = match[1];
          const threshold = parseInt(match[2]);
          const val = state.values[attr] || 0;
          if (op === '>=' && val < threshold) pass = false;
          else if (op === '<=' && val > threshold) pass = false;
          else if (op === '>' && val <= threshold) pass = false;
          else if (op === '<' && val >= threshold) pass = false;
        }
      }
    }
    targetNode = pass ? gb.true_target : gb.false_target;
  }

  state.history.push({ nodeId: state.currentNode, choice: choice.text });

  enterNode(targetNode);
}

/* ===== AUTO ROUTE ===== */
function resolveAutoRouteTarget(node) {
  const nid = node.node_id;
  const v = state.values;

  if (nid === 'node_12_public') {
    return (v.courage >= 3 && v.clues >= 4 && v.trust_isabella >= 1)
      ? 'node_end_true' : 'node_end_bittersweet';
  }
  if (nid === 'node_12_legal') {
    return v.clues >= 3 ? 'node_end_neutral' : 'node_end_cold';
  }

  return node.next_nodes[0];
}

/* ===== HUD ===== */
function updateHUD() {
  $('val-clues').textContent = state.values.clues;
  $('val-courage').textContent = state.values.courage;
  $('val-trust').textContent = state.values.trust_isabella;
}

function flashStat(attr, delta) {
  const map = { clues: 'hud-clues', courage: 'hud-courage', trust_isabella: 'hud-trust' };
  const el = $(map[attr]);
  if (!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1200);
}

/* ===== ENDING ===== */
function showEnding(node) {
  sceneLayer.style.display = 'none';

  const isBad = node.ending_type === 'bad_ending' || node.node_type === 'dead_end';
  endingScreen.className = isBad ? 'bad-end' : '';
  endingScreen.style.display = 'flex';

  const endType = node.ending_type || (node.node_type === 'dead_end' ? 'bad_ending' : 'neutral');
  $('ending-icon').textContent = ENDING_ICONS[endType] || '🌫️';
  $('ending-title').textContent = node.title || '结局';
  $('ending-type-label').textContent = ENDING_LABELS[endType] || '';

  const narr = narratives[node.node_id];
  const endText = narr ? narr.text : (node.scene_description || '');
  const shortText = endText.length > 200 ? endText.substring(0, 200) + '...' : endText;
  $('ending-text').textContent = shortText;

  $('ending-stats').innerHTML =
    `线索: ${state.values.clues} | 勇气: ${state.values.courage} | 信任: ${state.values.trust_isabella}<br>` +
    `经过节点: ${state.visited.length}/${Object.keys(nodes).length}`;

  autoSave();
}

/* ===== SAVE / LOAD ===== */
function getSaveKey(slot) { return `avg_save_${story.story_id}_${slot}`; }

function hasSaveData() {
  return !!localStorage.getItem(getSaveKey('auto'));
}

function autoSave() {
  saveToSlot('auto');
}

function saveToSlot(slot) {
  const data = {
    currentNode: state.currentNode,
    values: { ...state.values },
    visited: [...state.visited],
    history: [...state.history],
    currentAct: state.currentAct,
    timestamp: new Date().toISOString(),
    nodeTitle: nodes[state.currentNode]?.title || '',
  };
  localStorage.setItem(getSaveKey(slot), JSON.stringify(data));
}

function loadFromSlot(slot) {
  const raw = localStorage.getItem(getSaveKey(slot));
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    state.currentNode = data.currentNode;
    state.values = data.values || { clues: 0, courage: 0, trust_isabella: 0 };
    state.visited = data.visited || [];
    state.history = data.history || [];
    state.currentAct = data.currentAct || 0;
    return true;
  } catch { return false; }
}

function openModal(mode) {
  $('modal-title').textContent = mode === 'save' ? '存 档' : '读 档';
  const slots = $('modal-slots');
  slots.innerHTML = '';

  ['slot1', 'slot2', 'slot3'].forEach((slot, i) => {
    const div = document.createElement('div');
    div.className = 'save-slot';
    const raw = localStorage.getItem(getSaveKey(slot));
    let info = '空';
    if (raw) {
      try {
        const d = JSON.parse(raw);
        info = `${d.nodeTitle || '?'} — ${new Date(d.timestamp).toLocaleString('zh-CN')}`;
      } catch { info = '损坏'; }
    }
    div.innerHTML = `<span class="slot-label">存档 ${i + 1}</span><span class="slot-info">${info}</span>`;
    div.addEventListener('click', () => {
      if (mode === 'save') {
        saveToSlot(slot);
        closeModal();
      } else {
        if (loadFromSlot(slot)) {
          closeModal();
          endingScreen.style.display = 'none';
          sceneLayer.style.display = 'block';
          updateHUD();
          enterNode(state.currentNode);
        }
      }
    });
    slots.appendChild(div);
  });

  modalOverlay.style.display = 'flex';
}

function closeModal() { modalOverlay.style.display = 'none'; }

/* ===== HISTORY ===== */
function toggleHistory() {
  if (historyPanel.style.display === 'block') {
    historyPanel.style.display = 'none';
    return;
  }
  const content = $('history-content');
  content.innerHTML = '';
  state.history.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'history-entry';
    if (entry.choice) {
      div.innerHTML = `<div class="h-title">选择</div>${entry.choice}`;
    } else {
      div.innerHTML = `<div class="h-title">${entry.title || entry.nodeId}</div>`;
    }
    content.appendChild(div);
  });
  historyPanel.style.display = 'block';
}

/* ===== AUTO MODE ===== */
function toggleAuto() {
  state.autoMode = !state.autoMode;
  $('btn-auto').textContent = state.autoMode ? '停止' : '自动';
  $('btn-auto').style.borderColor = state.autoMode ? 'var(--gold)' : '';
  if (state.autoMode && !state.typing) {
    state.autoTimer = setTimeout(onTextClick, 2000);
  }
  if (!state.autoMode) clearTimeout(state.autoTimer);
}

/* ===== BOOT ===== */
init();

})();
</script>
