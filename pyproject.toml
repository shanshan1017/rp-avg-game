[project]
name = "rp-avg-game"
version = "0.1.0"
description = "Seed-to-game pipeline for branching AI-generated AVG / interactive novels"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Correctness-only gate: syntax errors, undefined names, invalid comparisons.
select = ["E9", "F63", "F7", "F82"]
