name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q pipeline avg_engine qa avg_game_toolkit_v1/tool_core
      - name: Offline pipeline + game build
        run: |
          python pipeline/pipeline.py --mode offline --output-dir /tmp/offline
          python avg_engine/build_game.py --story-graph /tmp/offline/story_graph.json \
            --narratives /tmp/offline/narratives.json --output /tmp/offline/game.html
      - name: QA (offline run + committed samples)
        run: |
          python qa/test_pipeline.py --output-dir /tmp/offline
          for s in seed001 seed003; do python qa/test_pipeline.py --output-dir outputs/$s; done
      - name: Validate runtime package
        run: |
          python avg_game_toolkit_v1/tool_core/bin/validate_runtime_package.py \
            avg_game_toolkit_v1/playable_games/zhuxian_qimai_huiwu_v1/runtime/runtime_game_package.json --assets-complete

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (working tree)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-git --source . --redact -v
